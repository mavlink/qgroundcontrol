# RunsOn self-hosted runner pools, referenced by the workflows via
# `runs-on=<run_id>-<job>-<attempt>-<matrix entry>/runner=<pool>`. Keep sizing here, not in workflow labels.
# Public repositories load these definitions from the default branch only.
# Families list exact types in on-demand priority order; RunsOn then ignores cpu/ram,
# so the ranges below document the listed types.
#
# Every pool is on-demand, pull requests included: a reclaimed Spot instance discards a whole build.
# Rename or remove a pool only after no workflow names it: labels naming a pool missing on the
# default branch fail to launch.
images:
  qgc-ubuntu24-x64:
    platform: linux
    arch: x64
    name: qgc-runs-on-ubuntu24-x64-*

runners:
  linux-x64-builder:
    family: ["c8i.xlarge", "c8a.xlarge", "m8i.xlarge"]
    cpu: [4]
    ram: [8, 16]
    spot: false
    image: ubuntu24-full-x64
    extras: s3-cache
    volume: 80gb
  linux-x64-builder-prebaked:
    # Shared opt-in for desktop, Android, and Docker: retain desktop's 16 GiB floor.
    family: ["m8i.xlarge", "m8a.xlarge", "r8i.xlarge"]
    cpu: [4]
    ram: [16, 32]
    spot: false
    image: qgc-ubuntu24-x64
    extras: s3-cache
    volume: 80gb
  linux-x64-builder-60gb:
    family: ["m8i.xlarge", "m8a.xlarge", "r8i.xlarge"]
    cpu: [4]
    ram: [16, 32]
    spot: false
    image: ubuntu24-full-x64
    extras: s3-cache
    volume: 60gb
  linux-arm64-builder:
    family: ["c8g.xlarge", "m8g.xlarge"]
    cpu: [4]
    ram: [8, 16]
    spot: false
    image: ubuntu24-full-arm64
    extras: s3-cache
    volume: 60gb
  linux-x64-tester:
    family: ["m8i.xlarge", "m8a.xlarge", "r8i.xlarge"]
    cpu: [4]
    ram: [16, 32]
    spot: false
    image: ubuntu24-full-x64
    extras: s3-cache
    volume: 60gb
  linux-x64-analyzer:
    # Analysis peaks near 11 GiB, so the 32 GiB fallback has ample headroom.
    family: ["m8i.4xlarge", "c8i.4xlarge"]
    cpu: [16]
    ram: [32, 64]
    spot: false
    image: ubuntu24-full-x64
    extras: s3-cache
    volume: 60gb
  linux-x64-emulator:
    # Nested virtualization needs Intel 7i/8i types; AMD and Graviton do not support it.
    family: ["c8i.xlarge", "m8i.xlarge"]
    cpu: [4]
    ram: [8, 16]
    spot: false
    image: ubuntu24-full-x64
    extras: s3-cache
    volume: 80gb
    nested-virt: true
  linux-x64-vm-builder:
    # The 12 GiB guests need host headroom; do not share the 8 GiB emulator pool.
    family: ["c8i.2xlarge", "m8i.2xlarge"]
    cpu: [8]
    ram: [16, 32]
    spot: false
    image: ubuntu24-full-x64
    extras: s3-cache
    volume: 80gb
    nested-virt: true
  windows-x64-builder:
    # windows22-full-x64 ships without Visual Studio; this image includes the MSVC toolchain.
    family: ["m8i.xlarge", "r8i.xlarge", "m7i.xlarge"]
    cpu: [4]
    ram: [16, 32]
    spot: false
    image: windows25-full-x64
    extras: s3-cache
    # The image itself uses about 75 GB, leaving about 55 GiB for the Release build (100 GB, with 24.6 GiB
    # free, ran out). windows.yml repeats the volume as a job label, because public repositories only
    # read this file from master.
    volume: 130gb
