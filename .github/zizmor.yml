# Repo convention is version-tag pinning (@v2, @v6, ...) for all actions, not SHA pins.
# ref-pin keeps the floating-ref protection (rejects @main / branch refs) while allowing tags.
rules:
  # Runners cannot load $/ actions from a fork PR's merge commit, so local actions stay checkout-backed ./ paths.
  self-repository:
    disable: true
  unpinned-uses:
    config:
      policies:
        "*": ref-pin
