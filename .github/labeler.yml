# Labeler configuration - auto-label PRs based on changed files
# https://github.com/actions/labeler

Docs:
  - changed-files:
      - any-glob-to-any-file: 'docs/**'

github_actions:
  - changed-files:
      - any-glob-to-any-file: '.github/**'

"Platform: Android":
  - changed-files:
      - any-glob-to-any-file:
          - 'android/**'
          - 'deploy/android/**'

"Platform: iOS":
  - changed-files:
      - any-glob-to-any-file:
          - 'deploy/ios/**'

"Platform: Linux":
  - changed-files:
      - any-glob-to-any-file:
          - 'deploy/linux/**'
          - 'deploy/docker/**'
          - 'tools/setup/install_dependencies/_debian.py'
          - 'tools/setup/install_dependencies/_arch.py'
          - 'tools/setup/install_dependencies/_fedora.py'

"Platform: Windows":
  - changed-files:
      - any-glob-to-any-file:
          - 'deploy/windows/**'
          - 'tools/setup/install_dependencies/_windows.py'

"Platform: macOS":
  - changed-files:
      - any-glob-to-any-file:
          - 'deploy/macos/**'
          - 'tools/setup/install_dependencies/_macos.py'

Tests:
  - changed-files:
      - any-glob-to-any-file: ['test/**', 'tools/tests/**', '.github/scripts/tests/**']

CMake:
  - changed-files:
      - any-glob-to-any-file:
          - 'CMakeLists.txt'
          - 'cmake/**'
          - '**/CMakeLists.txt'

Video:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/VideoManager/**'

Translations:
  - changed-files:
      - any-glob-to-any-file: 'translations/**'

QML:
  - changed-files:
      - any-glob-to-any-file: 'src/**/*.qml'

MAVLink:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/MAVLink/**'
          - 'src/Comms/**'

Tools:
  - changed-files:
      - any-glob-to-any-file: 'tools/**'
