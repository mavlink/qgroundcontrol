name: PR Checks

on:
  pull_request_target:  # zizmor: ignore[dangerous-triggers] reads PR metadata, posts comments/labels; only checks out trusted base ref
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # The title check reads the pull request's current title through the API.
    permissions:
      pull-requests: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      # A squash merge commits the title, so it must be a subject the conventional-commit-msg hook in
      # .pre-commit-config.yaml accepts, here with the text after the type limited to 80 characters;
      # test_workflow_security_policy.py compares the two patterns. Bots open pull requests with
      # these titles too: Renovate's `deps` type, GitHub's `Revert "..."`.
      - name: Check PR title format
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TITLE_PATTERN: '^((feat|fix|perf|revert|docs|style|chore|refactor|test|build|ci|deps)(\([^)\n]+\))?!?: \S.{0,79}$|(fixup|squash|amend)! |Merge |Revert ")'
        run: |
          title="$(gh pr view "${PR_NUMBER}" --json title --jq .title)"
          echo "PR title: ${title}"
          if ! grep -qP -- "${TITLE_PATTERN}" <<<"${title}"; then
            echo "::error title=PR title::Expected '<type>(<scope>): <subject>' with a subject of at most 80 characters; see Commit & Review Conventions in AGENTS.md."
            exit 1
          fi

  label:
    name: Label PR
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # pull-requests: write scoped here: this job applies PR size and path-based labels.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            tools/_bootstrap.py
            tools/ci
            tools/common
            tools/qgc_tools
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      # Non-blocking, unlike the title check: labels and the XL notice are advisory.
      - name: Label PR by size
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
        run: python3 tools/ci/reporting/gh_pr_size_label.py apply

      # Reads .github/labeler.yml from the base commit through the API; the sparse checkout omits it.
      - name: Label PR by changed files
        uses: actions/labeler@v7
        with:
          repo-token: ${{ github.token }}
          sync-labels: true
