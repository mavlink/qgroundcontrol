name: PR Checks

on:
  pull_request_target:  # zizmor: ignore[dangerous-triggers] reads PR metadata, posts comments/labels; only checks out trusted base ref
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # The title check reads the pull request's current title through the API.
    permissions:
      pull-requests: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Check PR title format
        continue-on-error: true
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            deps
          requireScope: false
          subjectPattern: ^.{1,80}$
          subjectPatternError: PR title must be 80 characters or less.
          validateSingleCommit: false

  label:
    name: Label PR
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # pull-requests: write scoped here: this job applies PR size and path-based labels.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            tools/ci/reporting/gh_pr_size_label.py
            tools/_bootstrap.py
            tools/common
            tools/qgc_tools
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      # Non-blocking, like the title check: labels and the XL notice are advisory.
      - name: Label PR by size
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
        run: python3 tools/ci/reporting/gh_pr_size_label.py apply

      # Reads .github/labeler.yml from the base commit through the API; the sparse checkout omits it.
      - name: Label PR by changed files
        uses: actions/labeler@v7
        with:
          repo-token: ${{ github.token }}
          sync-labels: true
