name: CodeQL

on:
  push:
    branches:
      - master
      - 'Stable*'
    paths-ignore:
      - 'docs/**'
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CODEQL_ACTION_OVERLAY_ANALYSIS: "false"

permissions:
  contents: read
  security-events: write
  actions: read
  packages: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # On ubuntu-22.04, about 1 in 7 PR runs failed checkout after ~100 s and then hung in
    # harden-runner's post step until the timeout; ubuntu-latest jobs with the same steps never did.
    runs-on: ubuntu-latest
    # An analysis takes about 80 s; a hung runner should not hold the check for long.
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        language: [actions, java-kotlin, python]

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
          trap-caching: false
          dependency-caching: false

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
