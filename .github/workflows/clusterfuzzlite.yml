name: ClusterFuzzLite

on:
  pull_request:
    paths:
      - '.clusterfuzzlite/**'
      - '.github/workflows/clusterfuzzlite.yml'
      - 'cmake/CustomOptions.cmake'
      - 'test/Fuzz/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  fuzz:
    name: MAVLink Parser (AddressSanitizer)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          language: c++
          github-token: ${{ secrets.GITHUB_TOKEN }}
          keep-unaffected-fuzz-targets: true
          sanitizer: address

      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@v1
        timeout-minutes: 10
        env:
          # Use the bundled seed corpus; scanning all repository artifacts can exhaust the job timeout.
          NO_CLUSTERFUZZ_DEPLOYMENT: 'true'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          mode: code-change
          sanitizer: address
          output-sarif: true

      - name: Upload fuzzing diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: mavlink-fuzzing-diagnostics
          path: |
            out/artifacts
            cifuzz-sarif/results.sarif
          if-no-files-found: warn
          retention-days: 7
