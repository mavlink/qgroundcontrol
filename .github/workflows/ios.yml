name: iOS

on:
  push:
    branches:
      - master
      - 'Stable*'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    paths-ignore:
      - 'docs/**'
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      debug_runner:
        description: 'Open an actor-only SSH session after a failure (up to 15 minutes, branches only)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read
  actions: read

jobs:
  changes:
    uses: ./.github/workflows/_detect-changes.yml
    with:
      platform: ios

  build:
    name: iOS (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.should_build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120

    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: device
            runner: macos-15
            build_type: Release
            preset: iOS
            qt_arch: ios_device
          - target: simulator
            runner: macos-15-intel
            build_type: Debug
            # Line tables keep simulator crash traces while halving objects, so Debug fits its cache budget;
            # unity builds of QGC targets halve compile CPU. The shipped device build stays per-file.
            preset: iOS-simulator
            qt_arch: ios_simulator_x86_64

    defaults:
      run:
        shell: bash

    env:
      PACKAGE: QGroundControl
      APPSTORE_BUNDLE_ID: ${{ vars.APPSTORE_BUNDLE_ID || 'org.mavlink.qgroundcontrol' }}
      APPSTORE_TAG: ${{ matrix.target == 'device' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
      # Version tags sign the device build for the App Store and upload it to TestFlight; without
      # the signing secrets and variables they build the unsigned IPA instead of failing.
      APPSTORE_RELEASE: >-
        ${{ matrix.target == 'device' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') &&
          secrets.APPSTORE_API_PRIVATE_KEY != '' && secrets.APPSTORE_CERTIFICATES_FILE_BASE64 != '' &&
          secrets.APPSTORE_CERTIFICATES_PASSWORD != '' && vars.APPSTORE_TEAM_ID != '' &&
          vars.APPSTORE_ISSUER_ID != '' && vars.APPSTORE_API_KEY_ID != '' &&
          vars.APPSTORE_PROVISIONING_PROFILE_NAME != '' }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Record build timeline
        uses: Kesin11/actions-timeline@v3
        continue-on-error: true
        with:
          show-waiting-runner: true

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}
          persist-credentials: false

      - name: Build Setup (iOS)
        id: setup
        uses: ./.github/actions/build-setup
        with:
          mode: ios
          qt-arch: ${{ matrix.qt_arch }}
          build-type: ${{ matrix.build_type }}

      - name: Skip TestFlight without App Store signing
        if: env.APPSTORE_TAG == 'true' && env.APPSTORE_RELEASE != 'true'
        run: echo "::notice::App Store signing secrets or variables are missing; building an unsigned IPA without uploading it to TestFlight"

      - name: Import App Store signing certificate
        if: env.APPSTORE_RELEASE == 'true'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Download App Store provisioning profiles
        id: profiles
        if: env.APPSTORE_RELEASE == 'true'
        uses: apple-actions/download-provisioning-profiles@v6
        with:
          bundle-id: ${{ env.APPSTORE_BUNDLE_ID }}
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Select App Store provisioning profile
        id: profile
        if: env.APPSTORE_RELEASE == 'true'
        env:
          BUNDLE_ID: ${{ env.APPSTORE_BUNDLE_ID }}
          PROFILE_NAME: ${{ vars.APPSTORE_PROVISIONING_PROFILE_NAME }}
          PROFILES: ${{ steps.profiles.outputs.profiles }}
          TEAM_ID: ${{ vars.APPSTORE_TEAM_ID }}
        run: python3 tools/ci/ios/ios_package.py select-profile

      - name: Configure
        uses: ./.github/actions/cmake-configure
        env:
          QT_HOST_PATH: ${{ steps.setup.outputs.host_qt_root_dir }}
        with:
          preset: >-
            ${{ env.APPSTORE_RELEASE == 'true' && 'iOS-appstore' || matrix.preset }}
          extra-args: ${{ steps.profile.outputs.cmake_args }}

      - name: Build
        uses: ./.github/actions/cmake-build

      - name: Verify Simulator Bundle
        if: matrix.target == 'simulator'
        env:
          APP_PATH: ${{ runner.temp }}/build/${{ matrix.build_type }}/${{ env.PACKAGE }}.app
        run: python3 tools/ci/ios/ios_package.py verify --app "$APP_PATH" --arch x86_64

      # ios_boot_test.py ends its attempts within 25 minutes; the step timeout keeps a stuck
      # simulator from holding the runner until it is lost with its logs.
      - name: Run simulator boot test
        if: matrix.target == 'simulator'
        timeout-minutes: 30
        env:
          APP_PATH: ${{ runner.temp }}/build/${{ matrix.build_type }}/${{ env.PACKAGE }}.app
        run: python3 tools/ci/ios/ios_boot_test.py --app "$APP_PATH" --log "$RUNNER_TEMP/ios-boot-test/ios-boot-test.log"

      - name: Upload simulator boot log
        id: boot-log
        if: ${{ !cancelled() && matrix.target == 'simulator' }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-boot-test
          path: ${{ runner.temp }}/ios-boot-test

      - name: Link simulator boot log
        if: ${{ !cancelled() && steps.boot-log.outputs.artifact-url != '' }}
        env:
          ARTIFACT_NAME: ios-boot-test
          ARTIFACT_URL: ${{ steps.boot-log.outputs.artifact-url }}
        run: python3 tools/ci/packaging/artifact_link.py --label "Boot test log and diagnostics"

      - name: Package IPA
        if: matrix.target == 'device'
        working-directory: ${{ runner.temp }}/build/${{ matrix.build_type }}
        run: python3 "$GITHUB_WORKSPACE/tools/ci/ios/ios_package.py" package

      - name: Attest and Upload
        if: matrix.target == 'device'
        uses: ./.github/actions/attest-and-upload
        with:
          artifact-name: ${{ env.PACKAGE }}.ipa
          artifact-source-path: ${{ runner.temp }}/build/${{ matrix.build_type }}/${{ env.PACKAGE }}.ipa
          package-name: ${{ env.PACKAGE }}-ios
          subject-name: ${{ env.PACKAGE }}-ios
          upload-aws: 'false'

      - name: Upload to TestFlight
        if: env.APPSTORE_RELEASE == 'true'
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ runner.temp }}/build/${{ matrix.build_type }}/${{ env.PACKAGE }}.ipa
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Debug failed runner
        if: ${{ failure() && !cancelled() && inputs.debug_runner && github.ref_type == 'branch' }}
        timeout-minutes: 15
        uses: ./.github/actions/debug-runner

  # The required status check: a skipped matrix job reports an unexpanded name, so branch
  # protection requires this stable name instead. always(): a skipped gate would count as passing.
  ios-ok:
    name: iOS
    if: always()
    needs: [changes, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Require every leg to pass
        uses: re-actors/alls-green@v1.3.0
        with:
          allowed-skips: build
          jobs: ${{ toJSON(needs) }}
