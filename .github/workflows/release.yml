name: Release

# Release tags are created and pushed by hand, which also starts the platform builds. This drafts
# the tag's GitHub Release with git-cliff notes; release assets are uploaded by hand.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing vX.Y.Z tag to draft a release for'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Per-job permissions narrow each scope; the top-level only grants read.
permissions:
  contents: read

jobs:
  draft-release:
    name: Draft Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # gh release create --draft
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      # fetch-depth 0 fetches every tag and every branch as origin/*. A dispatch runs the dispatching
      # branch's tooling, so it can draft tags on Stable branches that predate this workflow.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a Stable branch tag
        run: python3 tools/ci/publish/release_branch_check.py --ref "refs/tags/${RELEASE_TAG}"

      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          groups: release

      # Creates a draft release only when the tag has none; an existing release is left unchanged.
      - name: Draft release notes
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/ci/publish/release_notes.py "${RELEASE_TAG}"
          --output "${RUNNER_TEMP}/release-notes.md" --draft
