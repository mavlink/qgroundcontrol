name: Detect Changes

on:
  workflow_call:
    inputs:
      platform:
        description: 'Platform to detect changes for (detect_changes.py --platform)'
        required: true
        type: string
    outputs:
      should_build:
        description: 'Whether the caller should build: relevant PR changes, a Stable* release tag, or any other event'
        value: ${{ jobs.detect.outputs.should_build }}

permissions:
  contents: read

jobs:
  detect:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_build: ${{ steps.detect.outputs.should_build }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      # PR diffs fetch their base and head commits on demand. Tags need full
      # history and branch refs for the Stable* release-tag check.
      - name: Checkout detection scripts
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.ref_type != 'tag' && 1 || 0 }}
          sparse-checkout: |
            tools/_bootstrap.py
            tools/ci/__init__.py
            tools/ci/planning/detect_changes.py
            tools/common
            tools/qgc_tools
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Detect changes
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PLATFORM: ${{ inputs.platform }}
        run: python3 "${GITHUB_WORKSPACE}/tools/ci/planning/detect_changes.py" --platform "${PLATFORM}"
