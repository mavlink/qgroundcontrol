name: Update Translations

on:
  schedule:
    - cron: '0 3 * * 0'  # Every Sunday at 03:00 UTC
  workflow_dispatch:

concurrency:
  # Mid-flight cancel would apply translations but skip PR creation, leaving repo silently ahead.
  group: 'lupdate'
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-translations:
    if: github.repository_owner == 'mavlink'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          groups: qt

      # lupdate ships in qttools and links QtQml, QtNetwork and ICU.
      - name: Install Qt for Linux
        uses: ./.github/actions/qt-install
        with:
          host: linux
          arch: linux_gcc_64
          archives: qtbase qttools qtdeclarative icu

      - name: Update translation files
        run: python3 tools/translations/qgc_lupdate.py

      # PRs opened with GITHUB_TOKEN start no workflows, so their required checks would never report.
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: update-translations
          token: ${{ secrets.PX4BUILDBOT_ACCESSTOKEN || github.token }}
          add-paths: translations/*.ts
          title: "chore: update translations"
          commit-message: "chore: update translations"
          body: |
            This PR was automatically generated by GitHub Actions to update the Qt `.ts` translation files.
