name: Linux

on:
  push:
    branches:
      - master
      - 'Stable*'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    paths-ignore:
      - 'docs/**'
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      debug_runner:
        description: 'Open an actor-only SSH session after a failure (up to 15 minutes, branches only)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read
  actions: read

jobs:
  changes:
    uses: ./.github/workflows/_detect-changes.yml
    with:
      platform: linux

  build:
    name: Release ${{ matrix.arch }}
    needs: changes
    if: needs.changes.outputs.should_build == 'true'
    # RUNS_ON_LINUX_BUILDER replaces only the x64 pool.
    runs-on: >-
      ${{
        github.repository_owner == 'mavlink' &&
        format('runs-on={0}-build-{1}-{2}/runner={3}{4}',
          github.run_id, github.run_attempt, strategy.job-index,
          matrix.arch == 'linux_gcc_64' && vars.RUNS_ON_LINUX_BUILDER || matrix.runson_runner,
          github.event_name == 'pull_request' && (vars.RUNS_ON_SPOT_POOLS == 'true' && '-spot' ||
            format('/spot=cop/family={0}', matrix.spot_family)) || '') ||
        matrix.hosted_runner
      }}
    timeout-minutes: 120
    env:
      QGC_APPIMAGE_UPDATE_INFORMATION: >-
        ${{ github.repository == 'mavlink/qgroundcontrol' && format('gh-releases-zsync|mavlink|qgroundcontrol|latest|{0}.AppImage.zsync', matrix.package) || '' }}
      # The repository variable QGC_COMPILER_CACHE=sccache pilots sccache on RunsOn S3 (ci-overview.md).
      QGC_COMPILER_CACHE: ${{ vars.QGC_COMPILER_CACHE }}

    permissions:
      contents: read
      id-token: write
      attestations: write
      actions: read
      checks: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: linux_gcc_arm64
            runson_runner: linux-arm64-builder
            # Pull requests request the -spot twin's families until RUNS_ON_SPOT_POOLS is enabled.
            spot_family: c8g.xlarge+m8g.xlarge+c7g.xlarge+m7g.xlarge
            hosted_runner: ubuntu-24.04-arm
            package: QGroundControl-aarch64
            host: linux_arm64

          - arch: linux_gcc_64
            runson_runner: linux-x64-builder-60gb
            spot_family: m8i.xlarge+r8i.xlarge+m7i.xlarge
            hosted_runner: ubuntu-24.04
            package: QGroundControl-x86_64
            host: linux

    defaults:
      run:
        shell: bash

    steps:
      # The Harden-Runner community tier audits GitHub-hosted runners only, not RunsOn.
      - name: Harden Runner
        if: runner.environment == 'github-hosted'
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Record build timeline
        uses: Kesin11/actions-timeline@v3
        continue-on-error: true
        with:
          show-waiting-runner: true

      - name: Enable RunsOn magic cache
        uses: runs-on/action@v2
        with:
          show_costs: summary
          sccache: ${{ vars.QGC_COMPILER_CACHE == 'sccache' && 's3' || '' }}

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}
          persist-credentials: false

      - name: Build Setup
        uses: ./.github/actions/build-setup
        with:
          qt-host: ${{ matrix.host }}
          qt-arch: ${{ matrix.arch }}
          build-type: Release

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          preset: ${{ matrix.arch == 'linux_gcc_arm64' && 'Linux-arm64' || 'Linux' }}
          extra-args: -DQGC_APPIMAGE_UPDATE_INFORMATION=${{ env.QGC_APPIMAGE_UPDATE_INFORMATION }}

      - name: Build
        id: build
        uses: ./.github/actions/cmake-build
        with:
          reviewdog: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}

      - name: Verify Executable
        uses: ./.github/actions/verify-executable
        with:
          binary-path: ${{ runner.temp }}/build/Release/QGroundControl

      - name: Analyze binary size
        if: matrix.arch == 'linux_gcc_64'
        run: |
          python3 "${GITHUB_WORKSPACE}/tools/ci/reporting/size_analysis.py" \
            --binary "${RUNNER_TEMP}/build/Release/QGroundControl" --install-bloaty

      - name: Create AppImage
        working-directory: ${{ runner.temp }}/build
        run: cmake --install . --config Release

      - name: Verify AppImage
        uses: ./.github/actions/verify-executable
        with:
          binary-path: ${{ runner.temp }}/build/${{ matrix.package }}.AppImage
          type: appimage
          expected-appimage-update-information: ${{ env.QGC_APPIMAGE_UPDATE_INFORMATION }}

      - name: Attest and Upload
        uses: ./.github/actions/attest-and-upload
        with:
          artifact-name: ${{ matrix.package }}.AppImage
          package-name: ${{ matrix.package }}
          additional-artifact-paths: |
            ${{ env.QGC_APPIMAGE_UPDATE_INFORMATION != '' && format('{0}/build/{1}.AppImage.zsync', runner.temp, matrix.package) || '' }}
            ${{ matrix.arch == 'linux_gcc_64' && format('{0}/build/appimagelint-report.json', runner.temp) || '' }}
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-distribution-id: ${{ secrets.AWS_DISTRIBUTION_ID }}

      - name: Debug failed runner
        if: ${{ failure() && !cancelled() && inputs.debug_runner && github.ref_type == 'branch' }}
        timeout-minutes: 15
        uses: ./.github/actions/debug-runner

  debug-validation:
    name: ${{ matrix.mode == 'coverage' && 'Test + Coverage linux_gcc_64 Debug' || 'Sanitizers linux_gcc_64 Debug (ASan+UBSan)' }}
    needs: changes
    if: needs.changes.outputs.should_build == 'true'
    runs-on: >-
      ${{
        github.repository_owner == 'mavlink' &&
        format('runs-on={0}-debug-validation-{1}-{2}/runner=linux-x64-tester{3}',
          github.run_id, github.run_attempt, strategy.job-index,
          github.event_name == 'pull_request' && (vars.RUNS_ON_SPOT_POOLS == 'true' && '-spot' ||
            '/spot=cop/family=m8i.xlarge+r8i.xlarge+m7i.xlarge') || '') ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 120

    permissions:
      actions: read
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        mode: [coverage, sanitizers]

    defaults:
      run:
        shell: bash

    steps:
      # The Harden-Runner community tier audits GitHub-hosted runners only, not RunsOn.
      - name: Harden Runner
        if: runner.environment == 'github-hosted'
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Record build timeline
        uses: Kesin11/actions-timeline@v3
        continue-on-error: true
        with:
          show-waiting-runner: true

      - name: Enable RunsOn magic cache
        uses: runs-on/action@v2
        with:
          show_costs: summary

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build Setup
        uses: ./.github/actions/build-setup
        with:
          qt-host: linux
          qt-arch: linux_gcc_64
          build-type: Debug
          cache-variant: ${{ matrix.mode }}
          python-groups: ${{ matrix.mode == 'coverage' && 'scripts,coverage' || 'scripts' }}

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          # Both presets use line tables (-g1) and unity builds of QGC targets: full -g costs ~17% compile CPU
          # and ~3.5x object size, and unity halves compile CPU. Release jobs stay non-unity because they ship.
          preset: ${{ matrix.mode == 'coverage' && 'Linux-coverage' || 'Linux-sanitizers' }}

      - name: Build
        id: build
        uses: ./.github/actions/cmake-build

      - name: Run and report tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: ./.github/actions/test-phase
        # Sanitizer runtime options come from CTest (cmake/QGCTest.cmake), as in local runs.
        with:
          suite: linux-${{ matrix.mode }}
          # Instrumented integration tests run slower; at one per CPU MissionControllerTest exceeds its timeout.
          integration-parallel: ${{ matrix.mode == 'coverage' && '2' || 'auto' }}
          exclude-labels: ${{ matrix.mode == 'sanitizers' && 'Flaky|Network|NoSanitizer' || 'Flaky|Network' }}
          upload-codecov: ${{ vars.CODECOV_TEST_ANALYTICS == 'true' }}

      - name: Verify coverage data files exist
        if: matrix.mode == 'coverage'
        working-directory: ${{ runner.temp }}/build
        run: |
          gcda_count=$(find . -name '*.gcda' | wc -l | tr -d '[:space:]')
          echo "Detected ${gcda_count} .gcda files"
          if [ "${gcda_count}" -eq 0 ]; then
            echo "::error::No .gcda files were produced by test execution"
            exit 1
          fi

      - name: Generate Coverage Report
        if: matrix.mode == 'coverage'
        run: |
          python3 "${GITHUB_WORKSPACE}/tools/coverage_report.py" \
            --report \
            --build-dir "${RUNNER_TEMP}/build" \
            --log-file "${RUNNER_TEMP}/build/coverage-output.txt" \
            --step-summary

      - name: Upload to Codecov
        if: matrix.mode == 'coverage'
        uses: codecov/codecov-action@v7
        with:
          files: ${{ runner.temp }}/build/coverage.xml
          flags: unittests
          name: qgc-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload Coverage Artifact
        if: matrix.mode == 'coverage'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            ${{ runner.temp }}/build/coverage-output.txt
            ${{ runner.temp }}/build/coverage.xml
            ${{ runner.temp }}/build/coverage-summary.json
            ${{ runner.temp }}/build/coverage.html
            ${{ runner.temp }}/build/coverage.*.html
          retention-days: 14

      - name: Verify Coverage Thresholds
        if: matrix.mode == 'coverage'
        working-directory: ${{ runner.temp }}/build
        run: python3 "${GITHUB_WORKSPACE}/tools/ci/reporting/verify_coverage_thresholds.py" --build-dir .

      - name: Run normally excluded tests
        id: excluded
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.mode == 'coverage' && github.event_name == 'workflow_dispatch' }}
        uses: ./.github/actions/run-unit-tests
        with:
          include-labels: 'Network|Flaky'
          exclude-labels: ''
          parallel: '1'
          junit-output: junit-excluded.xml
          ctest-output: excluded-output.txt
          report-name: Network and flaky tests
          artifact-name: test-results-excluded

      - name: Debug failed runner
        if: ${{ failure() && !cancelled() && inputs.debug_runner && github.ref_type == 'branch' }}
        timeout-minutes: 15
        uses: ./.github/actions/debug-runner

  # The required status check: a skipped matrix job reports an unexpanded name, so branch
  # protection requires this stable name instead. always(): a skipped gate would count as passing.
  linux-ok:
    name: Linux
    if: always()
    needs: [changes, build, debug-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Require every leg to pass
        uses: re-actors/alls-green@v1.3.0
        with:
          allowed-skips: build, debug-validation
          jobs: ${{ toJSON(needs) }}
