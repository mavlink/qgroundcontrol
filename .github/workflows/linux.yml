name: Linux

on:
  push:
    branches:
      - master
      - 'Stable*'
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      debug_runner:
        description: 'Open an actor-only SSH session after a failure (up to 15 minutes, branches only)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  # build-mode:manual can't produce overlay DBs (those need build-mode:none); disable the
  # overlay attempt so CodeQL doesn't log the "falling back to a full database" message.
  CODEQL_ACTION_OVERLAY_ANALYSIS: "false"

permissions:
  contents: read
  actions: read

jobs:
  changes:
    uses: ./.github/workflows/_detect-changes.yml
    with:
      platform: linux

  build:
    name: Release ${{ matrix.arch }}
    needs: changes
    if: needs.changes.outputs.should_build == 'true'
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 120
    env:
      QGC_APPIMAGE_UPDATE_INFORMATION: >-
        ${{ github.repository == 'mavlink/qgroundcontrol' && format('gh-releases-zsync|mavlink|qgroundcontrol|latest|{0}.AppImage.zsync', matrix.package) || '' }}

    # security-events: write is scoped here (CodeQL runs only in this job),
    # not at workflow level — the debug/changes jobs cannot upload SARIF.
    permissions:
      contents: read
      id-token: write
      attestations: write
      security-events: write
      actions: read
      checks: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: linux_gcc_arm64
            runs_on: >-
              ${{
                github.repository_owner == 'mavlink' &&
                (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
                format('runs-on={0}/runner=linux-arm64-builder', github.run_id) ||
                'ubuntu-24.04-arm'
              }}
            package: QGroundControl-aarch64
            host: linux_arm64

          - arch: linux_gcc_64
            runs_on: >-
              ${{
                github.repository_owner == 'mavlink' &&
                (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
                format('runs-on={0}/runner={1}', github.run_id,
                  vars.RUNS_ON_LINUX_BUILDER || 'linux-x64-builder-60gb') ||
                'ubuntu-24.04'
              }}
            package: QGroundControl-x86_64
            host: linux

    defaults:
      run:
        shell: bash

    steps:
      # harden-runner is x86_64 Linux only — skip on the ubuntu-24.04-arm matrix entry.
      # macOS/Windows runners no-op silently, so other workflows don't need the guard.
      - name: Harden Runner
        if: runner.arch != 'ARM64'
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Record build timeline
        uses: Kesin11/actions-timeline@v3
        continue-on-error: true
        with:
          show-waiting-runner: true

      - name: Enable RunsOn magic cache
        if: github.repository_owner == 'mavlink' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: runs-on/action@v2
        with:
          metrics: cpu,network,memory,disk,io
          show_costs: summary

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}
          persist-credentials: false

      - name: Build Setup
        uses: ./.github/actions/build-setup
        with:
          qt-host: ${{ matrix.host }}
          qt-arch: ${{ matrix.arch }}
          build-type: Release

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      - name: Initialize CodeQL
        if: runner.arch != 'ARM64'
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          # c-cpp can't use overlay DBs (those require build-mode: none, interpreted-only); declare manual to match the cmake-build step below and silence the "undefined build-mode" fallback warning.
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml
          trap-caching: false
          dependency-caching: false

      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release
          preset: ${{ matrix.arch == 'linux_gcc_arm64' && 'Linux-arm64' || 'Linux' }}
          extra-args: -DQGC_APPIMAGE_UPDATE_INFORMATION=${{ env.QGC_APPIMAGE_UPDATE_INFORMATION }}

      - name: Build
        id: build
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release
          reviewdog: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          reviewdog-token: ${{ github.token }}

      - name: Perform CodeQL Analysis
        id: codeql
        if: runner.arch != 'ARM64'
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c-cpp"

      - name: Annotate CodeQL failure
        if: steps.codeql.outcome == 'failure'
        run: echo "::warning::CodeQL analysis failed — see step log for details"

      - name: Verify Executable
        uses: ./.github/actions/verify-executable
        with:
          binary-path: ${{ runner.temp }}/build/Release/QGroundControl

      - name: Analyze binary size
        if: matrix.arch == 'linux_gcc_64'
        uses: ./.github/actions/size-analysis
        with:
          binary-path: ${{ runner.temp }}/build/Release/QGroundControl
          output-file: ${{ runner.temp }}/build/metrics.json

      - name: Upload metrics artifact
        if: matrix.arch == 'linux_gcc_64'
        uses: actions/upload-artifact@v7
        with:
          name: size-metrics
          path: ${{ runner.temp }}/build/metrics.json
          if-no-files-found: error
          retention-days: 90

      - name: Create AppImage
        uses: ./.github/actions/cmake-install
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release

      - name: Verify AppImage
        uses: ./.github/actions/verify-executable
        with:
          binary-path: ${{ runner.temp }}/build/${{ matrix.package }}.AppImage
          type: appimage
          expected-appimage-update-information: ${{ env.QGC_APPIMAGE_UPDATE_INFORMATION }}

      - name: Attest and Upload
        uses: ./.github/actions/attest-and-upload
        with:
          artifact-name: ${{ matrix.package }}.AppImage
          package-name: ${{ matrix.package }}
          additional-artifact-paths: |
            ${{ env.QGC_APPIMAGE_UPDATE_INFORMATION != '' && format('{0}/build/{1}.AppImage.zsync', runner.temp, matrix.package) || '' }}
            ${{ matrix.arch == 'linux_gcc_64' && format('{0}/build/appimagelint-report.json', runner.temp) || '' }}
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-distribution-id: ${{ secrets.AWS_DISTRIBUTION_ID }}

      - name: Debug failed runner
        if: ${{ failure() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.debug_runner && github.ref_type == 'branch' }}
        timeout-minutes: 15
        uses: ./.github/actions/debug-runner

  debug-validation:
    name: ${{ matrix.mode == 'coverage' && 'Test + Coverage linux_gcc_64 Debug' || 'Sanitizers linux_gcc_64 Debug (ASan+UBSan)' }}
    needs: changes
    if: needs.changes.outputs.should_build == 'true'
    runs-on: >-
      ${{
        github.repository_owner == 'mavlink' &&
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
        format('runs-on={0}/runner=linux-x64-tester', github.run_id) ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 120

    permissions:
      actions: read
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        mode: [coverage, sanitizers]

    defaults:
      run:
        shell: bash

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Record build timeline
        uses: Kesin11/actions-timeline@v3
        continue-on-error: true
        with:
          show-waiting-runner: true

      - name: Enable RunsOn magic cache
        if: github.repository_owner == 'mavlink' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: runs-on/action@v2
        with:
          metrics: cpu,network,memory,disk,io
          show_costs: summary

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build Setup
        uses: ./.github/actions/build-setup
        with:
          qt-host: linux
          qt-arch: linux_gcc_64
          build-type: Debug
          cache-variant: ${{ matrix.mode }}

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      - name: Ensure coverage tools are available
        if: matrix.mode == 'coverage'
        run: python3 tools/setup/install_python.py scripts,coverage

      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Debug
          preset: ${{ matrix.mode == 'coverage' && 'Linux-coverage' || 'Linux-debug' }}
          testing: 'true'
          coverage: ${{ matrix.mode == 'coverage' && 'true' || 'false' }}
          extra-args: ${{ matrix.mode == 'sanitizers' && '-DQGC_ENABLE_ASAN=ON -DQGC_ENABLE_UBSAN=ON -DQGC_TEST_DETECT_LEAKS=ON' || '' }}

      - name: Build
        id: build
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Debug

      - name: Run and report tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: ./.github/actions/test-phase
        env:
          ASAN_OPTIONS: ${{ matrix.mode == 'sanitizers' && 'detect_leaks=1:halt_on_error=1:check_initialization_order=1' || '' }}
          LSAN_OPTIONS: ${{ matrix.mode == 'sanitizers' && format('suppressions={0}/build/asan_suppressions.txt', runner.temp) || '' }}
          UBSAN_OPTIONS: ${{ matrix.mode == 'sanitizers' && format('print_stacktrace=1:halt_on_error=1:suppressions={0}/build/ubsan_suppressions.txt', runner.temp) || '' }}
        with:
          build-dir: ${{ runner.temp }}/build
          suite: linux-${{ matrix.mode }}
          parallel: ${{ matrix.mode == 'coverage' && '1' || 'auto' }}
          exclude-labels: ${{ matrix.mode == 'sanitizers' && 'Flaky|Network|NoSanitizer' || 'Flaky|Network' }}
          upload-codecov: ${{ vars.CODECOV_TEST_ANALYTICS == 'true' }}

      - name: Verify coverage data files exist
        if: matrix.mode == 'coverage'
        working-directory: ${{ runner.temp }}/build
        run: |
          gcda_count=$(find . -name '*.gcda' | wc -l | tr -d '[:space:]')
          echo "Detected ${gcda_count} .gcda files"
          if [ "${gcda_count}" -eq 0 ]; then
            echo "::error::No .gcda files were produced by test execution"
            exit 1
          fi

      - name: Coverage Report
        if: matrix.mode == 'coverage'
        uses: ./.github/actions/coverage
        with:
          build-dir: ${{ runner.temp }}/build
          mode: report-only
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

      - name: Verify Coverage Thresholds
        if: matrix.mode == 'coverage'
        working-directory: ${{ runner.temp }}/build
        run: |
          line_thresh=$(python3 "${GITHUB_WORKSPACE}/.github/scripts/cmake_helper.py" \
            cache-var --build-dir . --name QGC_COVERAGE_LINE_THRESHOLD --default 30)
          branch_thresh=$(python3 "${GITHUB_WORKSPACE}/.github/scripts/cmake_helper.py" \
            cache-var --build-dir . --name QGC_COVERAGE_BRANCH_THRESHOLD --default 20)
          python3 "${GITHUB_WORKSPACE}/.github/scripts/verify_coverage_thresholds.py" \
            --coverage-xml coverage.xml \
            --line-threshold "${line_thresh}" \
            --branch-threshold "${branch_thresh}"

      - name: Run normally excluded tests
        id: excluded
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.mode == 'coverage' && github.event_name == 'workflow_dispatch' }}
        uses: ./.github/actions/run-unit-tests
        with:
          build-dir: ${{ runner.temp }}/build
          include-labels: 'Network|Flaky'
          exclude-labels: ''
          parallel: '1'
          junit-output: junit-excluded.xml
          ctest-output: excluded-output.txt

      - name: Report normally excluded tests
        if: ${{ !cancelled() && steps.excluded.outcome != 'skipped' && steps.excluded.outcome != '' }}
        uses: ./.github/actions/test-report
        with:
          name: Network and flaky tests
          build-dir: ${{ runner.temp }}/build
          junit-file: junit-excluded.xml
          output-file: excluded-output.txt
          artifact-name: test-results-excluded

      - name: Debug failed runner
        if: ${{ failure() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.debug_runner && github.ref_type == 'branch' }}
        timeout-minutes: 15
        uses: ./.github/actions/debug-runner
