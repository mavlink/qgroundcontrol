name: Linux

on:
  push:
    branches:
      - master
      - 'Stable*'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    paths-ignore:
      - 'docs/**'
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      debug_runner:
        description: 'Open an actor-only SSH session after a failure (up to 15 minutes, branches only)'
        type: boolean
        default: false

# Only a pull request's superseded runs are cancelled. The pushes to one branch or tag take turns
# and are never cancelled mid-run: Publish Builds publishes a commit from its push runs, once
# every platform has one. A push run still waiting for its turn gives way to a newer push. A run
# started by hand has a group of its own: in the ref's group it would replace the waiting push run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  changes:
    uses: ./.github/workflows/_detect-changes.yml
    with:
      platform: linux

  build:
    name: Release ${{ matrix.arch }}
    needs: changes
    if: needs.changes.outputs.should_build == 'true'
    # RUNS_ON_LINUX_BUILDER replaces only the x64 pool.
    runs-on: >-
      ${{
        github.repository_owner == 'mavlink' &&
        format('runs-on={0}-build-{1}-{2}/runner={3}',
          github.run_id, github.run_attempt, strategy.job-index,
          matrix.arch == 'linux_gcc_64' && vars.RUNS_ON_LINUX_BUILDER || matrix.runson_runner) ||
        matrix.hosted_runner
      }}
    timeout-minutes: 120
    env:
      QGC_APPIMAGE_UPDATE_INFORMATION: >-
        ${{ github.repository == 'mavlink/qgroundcontrol' && format('gh-releases-zsync|mavlink|qgroundcontrol|latest|{0}.AppImage.zsync', matrix.package) || '' }}
      # The repository variable QGC_COMPILER_CACHE=sccache pilots sccache on RunsOn S3
      # (.github/ci-notes/caching.md#sccache-pilot).
      QGC_COMPILER_CACHE: ${{ vars.QGC_COMPILER_CACHE }}

    permissions:
      contents: read
      id-token: write
      attestations: write
      actions: read
      checks: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: linux_gcc_arm64
            runson_runner: linux-arm64-builder
            hosted_runner: ubuntu-24.04-arm
            package: QGroundControl-aarch64
            host: linux_arm64

          - arch: linux_gcc_64
            runson_runner: linux-x64-builder-60gb
            hosted_runner: ubuntu-24.04
            package: QGroundControl-x86_64
            host: linux

    defaults:
      run:
        shell: bash

    steps:
      # The Harden-Runner community tier audits GitHub-hosted runners only, not RunsOn.
      - name: Harden Runner
        if: runner.environment == 'github-hosted'
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Record build timeline
        uses: Kesin11/actions-timeline@460b1f8a750077029ad3589824d371b200e91dcf # v3.2.1
        continue-on-error: true
        with:
          show-waiting-runner: true

      - name: Enable RunsOn magic cache
        uses: runs-on/action@13fbb6a39310a0dac9ab4716da2c4e74a3326dfc # v2.7.0
        with:
          show_costs: summary
          sccache: ${{ vars.QGC_COMPILER_CACHE == 'sccache' && 's3' || '' }}

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}
          persist-credentials: false

      - name: Build Setup
        uses: ./.github/actions/build-setup
        with:
          qt-host: ${{ matrix.host }}
          qt-arch: ${{ matrix.arch }}
          build-type: Release

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          preset: ${{ matrix.arch == 'linux_gcc_arm64' && 'Linux-arm64' || 'Linux' }}
          extra-args: -DQGC_APPIMAGE_UPDATE_INFORMATION=${{ env.QGC_APPIMAGE_UPDATE_INFORMATION }}

      - name: Build
        id: build
        uses: ./.github/actions/cmake-build
        with:
          reviewdog: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}

      - name: Verify Executable
        uses: ./.github/actions/verify-executable
        with:
          binary-path: ${{ runner.temp }}/build/Release/QGroundControl

      - name: Analyze binary size
        if: matrix.arch == 'linux_gcc_64'
        run: |
          python3 "${GITHUB_WORKSPACE}/tools/ci/reporting/size_analysis.py" \
            --binary "${RUNNER_TEMP}/build/Release/QGroundControl" --install-bloaty

      - name: Create AppImage
        working-directory: ${{ runner.temp }}/build
        run: cmake --install . --config Release

      # Known issue: Ubuntu's libavcodec, loaded by the bundled gst-libav plugin, pulls GPL x264 and x265
      # into the AppImage, so its GPL findings only warn (.github/ci-notes/reporting.md#artifact-report).
      - name: Report AppImage contents
        uses: ./.github/actions/artifact-report
        with:
          package: ${{ runner.temp }}/build/${{ matrix.package }}.AppImage
          artifact-name: ${{ matrix.package }}
          gpl-findings: warn

      - name: Verify AppImage
        uses: ./.github/actions/verify-executable
        with:
          binary-path: ${{ runner.temp }}/build/${{ matrix.package }}.AppImage
          type: appimage
          expected-appimage-update-information: ${{ env.QGC_APPIMAGE_UPDATE_INFORMATION }}

      - name: Attest and Upload
        uses: ./.github/actions/attest-and-upload
        with:
          artifact-name: ${{ matrix.package }}.AppImage
          package-name: ${{ matrix.package }}
          # appimagetool writes the update file when update information is embedded. It goes
          # to the tag's GitHub Release, which is where that information tells an updater to look.
          companion-path: ${{ env.QGC_APPIMAGE_UPDATE_INFORMATION != '' && format('{0}/build/{1}.AppImage.zsync', runner.temp, matrix.package) || '' }}
          publish: 'true'
          job-id: ${{ job.check_run_id }}

      - name: Debug failed runner
        if: ${{ failure() && !cancelled() && inputs.debug_runner && github.ref_type == 'branch' }}
        timeout-minutes: 15
        uses: ./.github/actions/debug-runner

  # Boots the x86_64 AppImage in clean containers of the oldest distributions it supports (glibc 2.38+, so
  # not Ubuntu 22.04 or Debian 12), which have no GStreamer or Qt: it must bring its own. The images come from
  # Docker Hub, whose pull limit GitHub-hosted runners are exempt from, rather than the ECR Public mirror the
  # RunsOn jobs use: ECR Public meters anonymous pulls by data per IP, which the shared hosted-runner IPs exhaust.
  appimage-distros:
    name: AppImage on ${{ matrix.distro }}
    needs: [changes, build]
    if: needs.changes.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Ubuntu 24.04
            image: docker.io/library/ubuntu:24.04
          - distro: Debian 13
            image: docker.io/library/debian:13

    defaults:
      run:
        shell: bash

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: ./.github/actions/setup-python

      - name: Download AppImage
        uses: actions/download-artifact@v8
        with:
          name: QGroundControl-x86_64
          path: ${{ runner.temp }}/appimage

      - name: Boot AppImage in ${{ matrix.distro }}
        env:
          IMAGE: ${{ matrix.image }}
        run: >-
          python3 "${GITHUB_WORKSPACE}/tools/ci/packaging/appimage_container_boot.py"
          --appimage "${RUNNER_TEMP}/appimage/QGroundControl-x86_64.AppImage" --image "${IMAGE}"

  debug-validation:
    name: ${{ matrix.mode == 'coverage' && 'Test + Coverage linux_gcc_64 Debug' || 'Sanitizers linux_gcc_64 Debug (ASan+UBSan)' }}
    needs: changes
    if: needs.changes.outputs.should_build == 'true'
    runs-on: >-
      ${{
        github.repository_owner == 'mavlink' &&
        format('runs-on={0}-debug-validation-{1}-{2}/runner=linux-x64-tester',
          github.run_id, github.run_attempt, strategy.job-index) ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 120

    permissions:
      actions: read
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        mode: [coverage, sanitizers]

    defaults:
      run:
        shell: bash

    steps:
      # The Harden-Runner community tier audits GitHub-hosted runners only, not RunsOn.
      - name: Harden Runner
        if: runner.environment == 'github-hosted'
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Record build timeline
        uses: Kesin11/actions-timeline@460b1f8a750077029ad3589824d371b200e91dcf # v3.2.1
        continue-on-error: true
        with:
          show-waiting-runner: true

      - name: Enable RunsOn magic cache
        uses: runs-on/action@13fbb6a39310a0dac9ab4716da2c4e74a3326dfc # v2.7.0
        with:
          show_costs: summary

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build Setup
        uses: ./.github/actions/build-setup
        with:
          qt-host: linux
          qt-arch: linux_gcc_64
          build-type: Debug
          cache-variant: ${{ matrix.mode }}
          python-groups: ${{ matrix.mode == 'coverage' && 'scripts,coverage' || 'scripts' }}

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          # Both presets use line tables (-g1) and unity builds of QGC targets: full -g costs ~17% compile CPU
          # and ~3.5x object size, and unity halves compile CPU. Release jobs stay non-unity because they ship.
          preset: ${{ matrix.mode == 'coverage' && 'Linux-coverage' || 'Linux-sanitizers' }}

      - name: Build
        id: build
        uses: ./.github/actions/cmake-build

      - name: Run and report tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: ./.github/actions/test-phase
        # Sanitizer runtime options come from CTest (cmake/QGCTest.cmake), as in local runs.
        with:
          suite: linux-${{ matrix.mode }}
          # Instrumented integration tests run slower; at one per CPU MissionControllerTest exceeds its timeout.
          integration-parallel: ${{ matrix.mode == 'coverage' && '2' || 'auto' }}
          exclude-labels: ${{ matrix.mode == 'sanitizers' && 'Flaky|Network|NoSanitizer' || 'Flaky|Network' }}
          upload-codecov: ${{ vars.CODECOV_TEST_ANALYTICS == 'true' }}

      # coverage_report.py fails when the tests produced no .gcda files.
      - name: Generate Coverage Report
        if: matrix.mode == 'coverage'
        run: |
          python3 "${GITHUB_WORKSPACE}/tools/coverage_report.py" \
            --report \
            --build-dir "${RUNNER_TEMP}/build" \
            --log-file "${RUNNER_TEMP}/build/coverage-output.txt" \
            --step-summary

      # OIDC (this job has id-token: write), as for test analytics: the CODECOV_TOKEN secret was rejected
      # with 404 "Repository not found", so master reports never arrived; fork PRs upload tokenless.
      # Only gcovr's report: the default search also picks up Qt's and CPM packages' coverage files.
      - name: Upload to Codecov
        if: matrix.mode == 'coverage'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ${{ runner.temp }}/build/coverage.xml
          disable_search: true
          flags: unittests
          name: qgc-coverage
          use_oidc: true
          fail_ci_if_error: false
          verbose: true

      - name: Upload Coverage Artifact
        if: matrix.mode == 'coverage'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            ${{ runner.temp }}/build/coverage-output.txt
            ${{ runner.temp }}/build/coverage.xml
            ${{ runner.temp }}/build/coverage-summary.json
            ${{ runner.temp }}/build/coverage.html
            ${{ runner.temp }}/build/coverage.*.html
          retention-days: 14

      - name: Verify Coverage Thresholds
        if: matrix.mode == 'coverage'
        working-directory: ${{ runner.temp }}/build
        run: python3 "${GITHUB_WORKSPACE}/tools/ci/reporting/verify_coverage_thresholds.py" --build-dir .

      # A tr() call that Qt's lupdate rejects or skips otherwise fails only the weekly lupdate.yml run, after
      # it has merged. One leg is enough, and Build Setup installed lupdate. It runs after the tests, whatever
      # their result, so a failure here never hides the test and coverage reports.
      - name: Check translation extraction
        if: ${{ !cancelled() && matrix.mode == 'coverage' }}
        run: python3 "${GITHUB_WORKSPACE}/tools/translations/qgc_lupdate.py" --check

      - name: Run normally excluded tests
        id: excluded
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.mode == 'coverage' && github.event_name == 'workflow_dispatch' }}
        uses: ./.github/actions/run-unit-tests
        with:
          include-labels: 'Network|Flaky'
          exclude-labels: ''
          parallel: '1'
          junit-output: junit-excluded.xml
          ctest-output: excluded-output.txt
          report-name: Network and flaky tests
          artifact-name: test-results-excluded

      - name: Debug failed runner
        if: ${{ failure() && !cancelled() && inputs.debug_runner && github.ref_type == 'branch' }}
        timeout-minutes: 15
        uses: ./.github/actions/debug-runner

  # The custom-example overlay changes the app name and feature set, global compile definitions, so it is its own
  # build. Pull requests unit-test and boot the Debug variant (the stock legs run the integration suites); pushes also
  # package and boot the Release AppImage.
  # One Debug build of the custom-example overlay: unit tests and a build-tree boot on every event, and
  # outside pull requests its stripped AppImage too. The stock Release legs cover Release compiles.
  custom-plugin:
    name: Custom Plugin
    needs: changes
    if: needs.changes.outputs.should_build == 'true'
    runs-on: >-
      ${{
        github.repository_owner == 'mavlink' &&
        format('runs-on={0}-custom-plugin-{1}-{2}/runner=linux-x64-tester',
          github.run_id, github.run_attempt, strategy.job-index) ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 120

    permissions:
      actions: read
      contents: read
      id-token: write

    defaults:
      run:
        shell: bash

    steps:
      # The Harden-Runner community tier audits GitHub-hosted runners only, not RunsOn.
      - name: Harden Runner
        if: runner.environment == 'github-hosted'
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Record build timeline
        uses: Kesin11/actions-timeline@460b1f8a750077029ad3589824d371b200e91dcf # v3.2.1
        continue-on-error: true
        with:
          show-waiting-runner: true

      - name: Enable RunsOn magic cache
        uses: runs-on/action@13fbb6a39310a0dac9ab4716da2c4e74a3326dfc # v2.7.0
        with:
          show_costs: summary

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Build Environment
        uses: ./.github/actions/build-setup
        with:
          qt-host: linux
          qt-arch: linux_gcc_64
          build-type: Debug
          cache-variant: custom

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          preset: Linux-debug
          extra-args: -DQGC_CUSTOM_DIR=custom-example

      - name: Build
        id: build
        uses: ./.github/actions/cmake-build

      - name: Run unit tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: ./.github/actions/run-unit-tests
        with:
          junit-output: junit-results-custom-unit.xml
          ctest-output: test-output-custom-unit.txt
          include-labels: 'Unit'
          exclude-labels: 'Flaky|Network|StockUI'
          report-name: Unit Tests (custom)
          artifact-name: test-results-custom-unit
          retention-days: 7
          duration-report: 'true'
          upload-codecov: ${{ vars.CODECOV_TEST_ANALYTICS == 'true' }}
          codecov-flags: custom-unit

      - name: Verify custom executable
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: ./.github/actions/verify-executable
        with:
          binary-path: ${{ runner.temp }}/build/Debug/Custom-QGroundControl
          build-dir: ${{ runner.temp }}/build

      # --strip keeps the AppImage near Release size: the Debug binary carries ~800 MB of debug info.
      - name: Create AppImage
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.build.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/build
        run: cmake --install . --config Debug --strip

      - name: Verify Custom AppImage
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.build.outcome == 'success' }}
        uses: ./.github/actions/verify-executable
        with:
          binary-path: ${{ runner.temp }}/build/Custom-QGroundControl-x86_64.AppImage
          type: appimage

      - name: Debug failed runner
        if: ${{ failure() && !cancelled() && inputs.debug_runner && github.ref_type == 'branch' }}
        timeout-minutes: 15
        uses: ./.github/actions/debug-runner

  # The check a ruleset should require (none does today): a skipped matrix job reports an
  # unexpanded name, so this job has the stable one. always(): a skipped gate would count as passing.
  linux-ok:
    name: Linux
    if: always()
    needs: [changes, build, appimage-distros, debug-validation, custom-plugin]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Require every leg to pass
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: build, appimage-distros, debug-validation, custom-plugin
          jobs: ${{ toJSON(needs) }}
