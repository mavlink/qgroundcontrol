name: Android

on:
  push:
    branches:
      - master
      - 'Stable*'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    paths-ignore:
      - 'docs/**'
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      debug_runner:
        description: 'Open an actor-only SSH session after a failure (up to 15 minutes, branches only)'
        type: boolean
        default: false
      build_type:
        description: 'Build type'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read
  actions: read

jobs:
  # android_matrix.py drops the windows leg, the PR long pole by a decent amount, for pull
  # requests and keeps it for push / merge queue / dispatch.
  changes:
    uses: ./.github/workflows/_detect-changes.yml
    with:
      platform: android

  build:
    name: Android (${{ matrix.host }})
    needs: changes
    if: needs.changes.outputs.should_build == 'true'
    # Use RunsOn for upstream jobs when the platform defines a runner.
    runs-on: >-
      ${{
        github.repository_owner == 'mavlink' &&
        matrix.runson_runner != '' &&
        format('runs-on={0}-build-{1}-{2}/{3}',
          github.run_id, github.run_attempt, strategy.job-index,
          matrix.host == 'windows' && vars.RUNS_ON_WINDOWS_POOL != '' &&
            format('pool={0}', vars.RUNS_ON_WINDOWS_POOL) ||
          matrix.host == 'linux' &&
            format('runner={0}', vars.RUNS_ON_LINUX_BUILDER || matrix.runson_runner) ||
          format('runner={0}', matrix.runson_runner)) ||
        matrix.fallback_runner
      }}
    timeout-minutes: 120

    # id-token/attestations scoped here: only the "Attest and Upload" step needs them.
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}

    defaults:
      run:
        shell: ${{ matrix.shell }}

    env:
      BUILD_TYPE: ${{ inputs.build_type || 'Release' }}
      PACKAGE: QGroundControl
      QT_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/deploy/android/android_release.keystore
      QT_ANDROID_KEYSTORE_ALIAS: QGCAndroidKeyStore
      # Same-repo PRs (including Renovate) would otherwise receive the release keystore password;
      # an empty password makes every PR leg sign with a throwaway debug keystore.
      QT_ANDROID_KEYSTORE_STORE_PASS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
      QT_ANDROID_KEYSTORE_KEY_PASS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
      QT_ANDROID_ABIS: ${{ matrix.android_abis }}
      HAS_PLAYSTORE_SECRET: ${{ secrets.GOOGLE_SERVICE_ACCOUNT != '' }}

    steps:
      # The Harden-Runner community tier audits GitHub-hosted runners only, not RunsOn.
      - name: Harden Runner
        if: runner.environment == 'github-hosted'
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Record build timeline
        uses: Kesin11/actions-timeline@v3
        continue-on-error: true
        with:
          show-waiting-runner: true

      - name: Enable RunsOn magic cache
        uses: runs-on/action@v2
        with:
          show_costs: summary

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}
          persist-credentials: false

      - name: Build Setup (Android)
        id: setup
        uses: ./.github/actions/build-setup
        with:
          mode: android
          qt-host: ${{ matrix.qt_host || matrix.host }}
          qt-arch: ${{ matrix.arch }}
          abis: ${{ env.QT_ANDROID_ABIS }}
          build-type: ${{ env.BUILD_TYPE }}
          # matrix.host is unique per leg; linux and linux-emulator otherwise
          # resolve to identical cache inputs and would race on the moccache
          # save key.
          cache-key-suffix: ${{ matrix.host }}

      # setup-java's javac problem matcher turned every deprecation warning in the Gradle build into
      # an annotation. Build errors, javac's included, are annotated by cmake-build instead.
      - name: Drop javac warning annotations
        run: echo "::remove-matcher owner=javac::"

      - name: Install host build dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-dependencies
        with:
          # setup-java provides the JDK; Qt's host tools need none of the desktop libraries.
          category: core

      - name: Create Debug Keystore
        if: ${{ env.QT_ANDROID_KEYSTORE_STORE_PASS == '' || !matrix.primary }}
        shell: bash
        run: python3 "${GITHUB_WORKSPACE}/tools/ci/android/android_sdk_helper.py" debug-keystore

      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          preset: ${{ env.BUILD_TYPE == 'Debug' && 'Android-debug' || 'Android' }}
          use-qt-cmake: 'false'
          extra-args: >-
            -DCMAKE_WARN_DEPRECATED=FALSE
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup.outputs.target_qt_root_dir }}/lib/cmake/Qt6/qt.toolchain.cmake
            -DCMAKE_PREFIX_PATH=${{ steps.setup.outputs.target_qt_root_dir }}
            -DQT_ANDROID_ABIS=${{ env.QT_ANDROID_ABIS }}
            -DQT_HOST_PATH=${{ steps.setup.outputs.host_qt_root_dir }}
            -DQT_ANDROID_SIGN_APK=ON
            -DQT_ANDROID_SIGN_AAB=ON

      - name: Build
        id: build
        continue-on-error: ${{ matrix.emulator }}
        timeout-minutes: 75
        # Disable Gradle daemon on CI — Windows runners hang for 30+ min after BUILD SUCCESSFUL waiting for daemon shutdown.
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        uses: ./.github/actions/cmake-build
        with:
          parallel-jobs: ${{ matrix.emulator && '2' || '' }}
          output-file: qgc-build.log

      - name: Retry Build (emulator JSON truncation recovery)
        id: build-retry
        if: ${{ matrix.emulator && steps.build.outcome == 'failure' }}
        shell: bash
        run: |
          python3 "${GITHUB_WORKSPACE}/tools/ci/android/android_build_retry.py" \
            --build-dir "${{ runner.temp }}/build" \
            --build-type "${BUILD_TYPE}"

      - name: Save recovered build caches
        if: steps.build-retry.outcome == 'success'
        uses: ./.github/actions/save-build-cache

      # `failure()` is required: build's continue-on-error makes outcome alone insufficient.
      - name: Annotate emulator build retry failure
        if: ${{ failure() && matrix.emulator && steps.build.outcome == 'failure' && steps.build-retry.outcome == 'failure' }}
        run: echo "::error::Android emulator build failed (initial + retry). See logs for the truncation root cause."

      - name: Upload build log on failure
        if: ${{ failure() && steps.build.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.host }}-build-log
          path: |
            ${{ runner.temp }}/build/qgc-build.log
            ${{ runner.temp }}/build/qgc-build-retry.log
            ${{ runner.temp }}/build/CMakeFiles/CMakeConfigureLog.yaml
            ${{ runner.temp }}/build/.ninja_log
            ${{ runner.temp }}/build/android-QGroundControl-deployment-settings.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Android Lint
        id: lint
        if: ${{ matrix.host == 'linux' }}
        shell: bash
        run: |
          python3 "${GITHUB_WORKSPACE}/tools/ci/android/android_lint.py" \
            --project-dir "${RUNNER_TEMP}/build/android-build"

      - name: Upload lint reports on failure
        id: upload-lint
        if: ${{ failure() && steps.lint.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.host }}-lint-reports
          path: |
            ${{ runner.temp }}/build/android-build/build/reports/lint-results-release.html
            ${{ runner.temp }}/build/android-build/build/reports/lint-results-release.xml
            ${{ runner.temp }}/build/android-lint.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Link lint reports
        if: ${{ failure() && steps.upload-lint.outputs.artifact-url != '' }}
        shell: bash
        env:
          ARTIFACT_NAME: android-${{ matrix.host }}-lint-reports
          ARTIFACT_URL: ${{ steps.upload-lint.outputs.artifact-url }}
        run: python3 "${GITHUB_WORKSPACE}/tools/ci/packaging/artifact_link.py" --label "Android Lint reports"

      - name: Prepare Artifact
        shell: bash
        run: |
          python3 "${GITHUB_WORKSPACE}/tools/ci/packaging/find_artifact.py" \
            --build-dir "${RUNNER_TEMP}/build/android-build" \
            --pattern '*.apk' --top-level \
            --copy-to "${RUNNER_TEMP}/build/${PACKAGE}.apk"

      # Master pushes also publish an App Bundle of the same multi-ABI release build. androiddeployqt runs
      # Gradle's all-variant `bundle` task, so only outputs/bundle/release holds the release bundle.
      - name: Build Android App Bundle
        id: aab
        if: ${{ !matrix.emulator && matrix.primary && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        uses: ./.github/actions/cmake-build
        with:
          target: aab
          output-file: qgc-aab-build.log

      - name: Prepare App Bundle
        id: aab-artifact
        if: ${{ steps.aab.outcome == 'success' }}
        shell: bash
        run: |
          python3 "${GITHUB_WORKSPACE}/tools/ci/packaging/find_artifact.py" \
            --build-dir "${RUNNER_TEMP}/build/android-build/build/outputs/bundle/release" \
            --pattern '*.aab' \
            --copy-to "${RUNNER_TEMP}/build/${PACKAGE}.aab"

      - name: Emulator Boot Test
        if: ${{ matrix.emulator }}
        uses: ./.github/actions/android-emulator-test
        with:
          apk-path: ${{ runner.temp }}/build/${{ env.PACKAGE }}.apk
          package: org.mavlink.qgroundcontrol
          android-platform: ${{ steps.setup.outputs.android_platform }}
          diagnostics-name: ${{ matrix.host }}

      - name: Attest and Upload
        if: ${{ !matrix.emulator }}
        uses: ./.github/actions/attest-and-upload
        with:
          artifact-name: ${{ env.PACKAGE }}.apk
          package-name: ${{ format('{0}-{1}-{2}', env.PACKAGE, matrix.host, matrix.artifact_abi_suffix) }}
          subject-name: ${{ env.PACKAGE }}-${{ matrix.host }}
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-distribution-id: ${{ secrets.AWS_DISTRIBUTION_ID }}
          upload-aws: ${{ matrix.primary }}

      - name: Attest and Upload App Bundle
        if: ${{ steps.aab-artifact.outcome == 'success' }}
        uses: ./.github/actions/attest-and-upload
        with:
          artifact-name: ${{ env.PACKAGE }}.aab
          package-name: ${{ format('{0}-{1}-{2}-aab', env.PACKAGE, matrix.host, matrix.artifact_abi_suffix) }}
          subject-name: ${{ env.PACKAGE }}-${{ matrix.host }}-aab
          upload-aws: 'false'

      # Tags start a 20% staged production rollout; master pushes complete a beta release.
      - name: Deploy to Play Store
        if: ${{ !matrix.emulator && matrix.primary && env.HAS_PLAYSTORE_SECRET == 'true' && (github.ref_type == 'tag' || github.ref == 'refs/heads/master') }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          packageName: org.mavlink.qgroundcontrol
          releaseFiles: ${{ runner.temp }}/build/${{ env.PACKAGE }}.apk
          track: ${{ github.ref_type == 'tag' && 'production' || 'beta' }}
          status: ${{ github.ref_type == 'tag' && 'inProgress' || 'completed' }}
          userFraction: ${{ github.ref_type == 'tag' && '0.2' || '' }}
          whatsNewDirectory: ${{ github.workspace }}/deploy/android/whatsnew

      - name: Debug failed runner
        if: ${{ failure() && !cancelled() && inputs.debug_runner && github.ref_type == 'branch' }}
        timeout-minutes: 15
        uses: ./.github/actions/debug-runner

  # The required status check. Matrix legs differ by event, and a skipped matrix job reports an
  # unexpanded name, so branch protection requires this stable name instead. always(): a skipped
  # gate would count as passing.
  android-ok:
    name: Android
    if: always()
    needs: [changes, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Require every leg to pass
        uses: re-actors/alls-green@v1.3.0
        with:
          allowed-skips: build
          jobs: ${{ toJSON(needs) }}
