name: Build Profile

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - RelWithDebInfo
          - Debug
      limit:
        description: 'Rows per section in summary (TU/header/template ranks)'
        required: false
        default: '50'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.build_type || 'default' }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  profile:
    name: Clang -ftime-trace + ClangBuildAnalyzer
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    defaults:
      run:
        shell: bash

    env:
      CC: clang
      CXX: clang++

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build Setup
        uses: ./.github/actions/build-setup
        with:
          qt-host: linux
          qt-arch: linux_gcc_64
          build-type: ${{ inputs.build_type }}
          save-cache: 'false'

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies
        with:
          extra-packages: clang

      # The SHA-256-verified release pinned in build-config.json's tools.clang_build_analyzer.
      - name: Install ClangBuildAnalyzer
        run: |
          python3 "${GITHUB_WORKSPACE}/tools/build_profile.py" \
            --install-clang-build-analyzer "${RUNNER_TEMP}/ClangBuildAnalyzer"

      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          preset: ${{ inputs.build_type == 'Debug' && 'Linux-debug' || inputs.build_type == 'RelWithDebInfo' && 'Linux-relwithdebinfo' || 'Linux' }}
          extra-args: -DQGC_TIME_TRACE=ON -DQGC_USE_CACHE=OFF

      - name: Start ClangBuildAnalyzer capture
        working-directory: ${{ runner.temp }}/build
        run: |
          "${RUNNER_TEMP}/ClangBuildAnalyzer" --start .

      - name: Build
        uses: ./.github/actions/cmake-build

      - name: Stop ClangBuildAnalyzer capture
        working-directory: ${{ runner.temp }}/build
        run: |
          "${RUNNER_TEMP}/ClangBuildAnalyzer" --stop . qgc-trace.bin

      - name: Analyze ClangBuildAnalyzer capture
        working-directory: ${{ runner.temp }}/build
        run: |
          "${RUNNER_TEMP}/ClangBuildAnalyzer" --analyze qgc-trace.bin > qgc-trace-report.txt

      # Also writes the job summary: build type, commit, compiler, and both reports collapsed.
      - name: Run tools/build_profile.py (ninja + per-TU)
        working-directory: ${{ runner.temp }}/build
        env:
          LIMIT: ${{ inputs.limit }}
        run: |
          [[ "$LIMIT" =~ ^[0-9]+$ ]] || { echo "::error::limit must be a positive integer (got: $LIMIT)"; exit 1; }
          python3 "${GITHUB_WORKSPACE}/tools/build_profile.py" \
            --build-dir . \
            --limit "$LIMIT" \
            --json-out qgc-tu-report.json \
            --step-summary \
            --extra-report "Headers, templates, and functions (ClangBuildAnalyzer)=qgc-trace-report.txt" \
            > qgc-tu-report.txt

      - name: Upload profile artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-profile-${{ inputs.build_type }}
          path: |
            ${{ runner.temp }}/build/qgc-trace.bin
            ${{ runner.temp }}/build/qgc-trace-report.txt
            ${{ runner.temp }}/build/qgc-tu-report.txt
            ${{ runner.temp }}/build/qgc-tu-report.json
            ${{ runner.temp }}/build/.ninja_log
          if-no-files-found: ignore
          retention-days: 90
