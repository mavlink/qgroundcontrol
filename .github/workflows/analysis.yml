name: Code Analysis

on:
  pull_request:
    paths:
      - 'src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'tools/analyzers/**'
      - 'tools/analyze.py'
      - '.qmllint.ini'
      - '.clang-tidy'
      - '.github/workflows/analysis.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      tool:
        description: 'Analysis tool to run'
        required: true
        default: 'clazy'
        type: choice
        options:
          - clazy
          - clang-tidy
          - iwyu
          - qmllint
          - asan
          - ubsan
          - tsan
      path:
        description: 'Path to analyze (compiler analysis only, e.g., src/Vehicle/)'
        required: false
        default: ''
        type: string
      analyze_all:
        description: 'Analyze all source files (compiler analysis only)'
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (inputs.tool || 'clazy') }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: ${{ (inputs.tool || 'clazy') }} Analysis
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (inputs.tool || 'clazy') == 'clazy' && 60 || 120 }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build Setup (clazy/iwyu)
        if: contains(fromJSON('["clazy", "clang-tidy", "iwyu", "qmllint"]'), (inputs.tool || 'clazy'))
        uses: ./.github/actions/build-setup
        with:
          qt-host: linux
          qt-arch: linux_gcc_64
          build-type: Debug
          cache-variant: ${{ (inputs.tool || 'clazy') }}
          save-cache: true

      - name: Install analysis dependencies
        if: contains(fromJSON('["clazy", "clang-tidy", "iwyu", "qmllint"]'), (inputs.tool || 'clazy'))
        uses: ./.github/actions/install-dependencies
        with:
          extra-packages: clazy clang clang-tidy iwyu ninja-build

      - name: Build Setup (sanitizers)
        if: contains(fromJSON('["asan", "ubsan", "tsan"]'), (inputs.tool || 'clazy'))
        uses: ./.github/actions/build-setup
        with:
          qt-host: linux
          qt-arch: linux_gcc_64
          build-type: Debug
          cache-variant: ${{ (inputs.tool || 'clazy') }}
          save-cache: true

      - name: Install Dependencies (sanitizers)
        if: contains(fromJSON('["asan", "ubsan", "tsan"]'), (inputs.tool || 'clazy'))
        uses: ./.github/actions/install-dependencies

      - name: Configure (clazy/iwyu)
        if: contains(fromJSON('["clazy", "clang-tidy", "iwyu", "qmllint"]'), (inputs.tool || 'clazy'))
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Debug
          preset: Linux-debug
          extra-args: >-
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON
            -DQGC_UNITY_BUILD=OFF

      - name: Configure (sanitizers)
        if: contains(fromJSON('["asan", "ubsan", "tsan"]'), (inputs.tool || 'clazy'))
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Debug
          preset: Linux-debug
          testing: 'true'
          extra-args: >-
            -DQGC_ENABLE_COVERAGE=OFF
            ${{ (inputs.tool || 'clazy') == 'asan' && '-DQGC_ENABLE_ASAN=ON' || '' }}
            ${{ (inputs.tool || 'clazy') == 'asan' && '-DQGC_TEST_DETECT_LEAKS=ON' || '' }}
            ${{ (inputs.tool || 'clazy') == 'ubsan' && '-DQGC_ENABLE_UBSAN=ON' || '' }}
            ${{ (inputs.tool || 'clazy') == 'tsan' && '-DQGC_ENABLE_TSAN=ON' || '' }}

      - name: Build analysis prerequisites
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Debug

      - name: Run QML analysis with generated types
        if: inputs.tool == 'qmllint'
        env:
          INPUT_PATH: ${{ inputs.path }}
          ANALYZE_ALL: ${{ inputs.analyze_all }}
        run: |
          args=(--build-dir "${RUNNER_TEMP}/build" --qml-build --advisory)
          if [[ "$ANALYZE_ALL" == 'true' ]]; then
            args+=(--all)
          elif [[ -n "$INPUT_PATH" ]]; then
            args+=("$INPUT_PATH")
          fi
          python3 tools/analyze.py --tool qmllint "${args[@]}" 2>&1 | tee "${RUNNER_TEMP}/build/analysis-output.txt"

      - name: Run compiler analysis
        if: contains(fromJSON('["clazy", "clang-tidy"]'), (inputs.tool || 'clazy'))
        env:
          INPUT_PATH: ${{ inputs.path }}
          ANALYZE_ALL: ${{ inputs.analyze_all || github.event_name == 'schedule' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ANALYSIS_TOOL: ${{ inputs.tool || 'clazy' }}
        run: |
          args=(--build-dir "${RUNNER_TEMP}/build" --advisory)
          if [[ "$ANALYZE_ALL" == 'true' ]]; then
            args+=(--all)
          elif [[ -n "$INPUT_PATH" ]]; then
            args+=("$INPUT_PATH")
          fi
          python3 tools/analyze.py --tool "$ANALYSIS_TOOL" "${args[@]}" 2>&1 | tee "${RUNNER_TEMP}/build/analysis-output.txt"
          if [[ "$GITHUB_EVENT_NAME" != 'workflow_dispatch' ]]; then
            python3 tools/analyze.py --tool clang-tidy "${args[@]}" 2>&1 | tee -a "${RUNNER_TEMP}/build/analysis-output.txt"
          fi

      - name: Run IWYU
        if: inputs.tool == 'iwyu'
        env:
          INPUT_PATH: ${{ inputs.path }}
          ANALYZE_ALL: ${{ inputs.analyze_all }}
        run: |
          args=(-p "${RUNNER_TEMP}/build" -j "$(nproc)")
          if [[ "$ANALYZE_ALL" != 'true' && -n "$INPUT_PATH" ]]; then
            if [[ "$INPUT_PATH" = /* || "$INPUT_PATH" == *..* ]]; then
              echo "::error::Analysis path must be relative without '..'"
              exit 1
            fi
            args+=("$GITHUB_WORKSPACE/$INPUT_PATH")
          else
            args+=("$GITHUB_WORKSPACE/src")
          fi
          iwyu_tool.py "${args[@]}" 2>&1 | tee "${RUNNER_TEMP}/build/iwyu-output.txt"

      - name: Run Sanitizer Tests
        if: contains(fromJSON('["asan", "ubsan", "tsan"]'), (inputs.tool || 'clazy'))
        uses: ./.github/actions/run-unit-tests
        env:
          ASAN_OPTIONS: ${{ (inputs.tool || 'clazy') == 'asan' && 'detect_leaks=1:halt_on_error=1:check_initialization_order=1' || '' }}
          LSAN_OPTIONS: ${{ (inputs.tool || 'clazy') == 'asan' && format('suppressions={0}/build/asan_suppressions.txt', runner.temp) || '' }}
          UBSAN_OPTIONS: ${{ (inputs.tool || 'clazy') == 'ubsan' && format('print_stacktrace=1:halt_on_error=1:suppressions={0}/build/ubsan_suppressions.txt', runner.temp) || '' }}
          TSAN_OPTIONS: ${{ (inputs.tool || 'clazy') == 'tsan' && format('second_deadlock_stack=1:halt_on_error=1:suppressions={0}/build/tsan_suppressions.txt', runner.temp) || '' }}
        with:
          build-dir: ${{ runner.temp }}/build
          junit-output: junit-results-analysis-${{ (inputs.tool || 'clazy') }}.xml
          ctest-output: sanitizer-output.txt
          include-labels: 'Unit|Integration'
          exclude-labels: 'Flaky|Network|NoSanitizer'
          parallel: '1'

      - name: Upload Output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ (inputs.tool || 'clazy') }}-output
          path: |
            ${{ runner.temp }}/build/analysis-output.txt
            ${{ runner.temp }}/build/iwyu-output.txt
            ${{ runner.temp }}/build/sanitizer-output.txt
            ${{ runner.temp }}/build/junit-results-analysis-${{ (inputs.tool || 'clazy') }}.xml
          if-no-files-found: ignore
          retention-days: 7
