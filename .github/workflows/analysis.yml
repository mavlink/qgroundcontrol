name: Code Analysis

on:
  # One path list: analysis_matrix.FULL_SCAN_INPUTS plus src/ files that can affect compilation.
  pull_request:
    paths: &analysis-paths
      - 'src/**'
      - '!src/**/*.qml'
      - '!src/**/*.js'
      - '!src/**/*.json'
      - '!src/**/*.md'
      - '!src/**/*.png'
      - '!src/**/*.svg'
      - '!src/**/*.mesh'
      - '!src/**/*.params'
      - '!src/**/*.xml'
      - '!src/**/*.xsd'
      - '!src/**/*.frag'
      - '!src/**/*.vert'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.clang-tidy'
      - '.github/build-config.json'
      - 'tools/ci/planning/analysis_matrix.py'
      - '.github/workflows/analysis.yml'
      - 'tools/analyze.py'
      - 'tools/analyzers/__init__.py'
      - 'tools/analyzers/base.py'
      - 'tools/analyzers/clang_tidy.py'
      - 'tools/analyzers/clazy.py'
      - 'tools/analyzers/compiler.py'
      - 'tools/analyzers/dependencies.py'
      - 'tools/analyzers/result_cache.py'
      - 'tools/setup/build_clazy.py'
      - 'tools/ci/runner/analysis_tools.py'
      - 'tools/common/io.py'
      - 'tools/common/xml.py'
      - 'tools/generators/mavlink_enums.py'
      - 'tools/generators/mavlink_instance_fields.py'
  # Master pushes seed the result cache that pull requests restore.
  push:
    branches: [master]
    paths: *analysis-paths
  workflow_dispatch:
    inputs:
      tool:
        description: 'Analysis tool to run'
        required: true
        default: 'clazy'
        type: choice
        options:
          - clazy
          - clang-tidy
          - iwyu
          - qmllint
          - tsan
      path:
        description: 'Path to analyze when analyze_all is off (not tsan; e.g., src/Vehicle/)'
        required: false
        default: ''
        type: string
      analyze_all:
        description: 'Analyze all source files (not tsan)'
        required: false
        default: true
        type: boolean
      profile_checks:
        description: 'Record clang-tidy per-check profiles (slower; select a narrow path)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (inputs.tool || 'compiler') }}
  # Master runs save the shared result cache, so let them finish instead of cancelling each other.
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read
  actions: read

jobs:
  # Each analysis job repeats the full setup, so PRs only get the shards their estimated units need.
  plan:
    name: Plan Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      include: ${{ steps.plan.outputs.include }}
      llvm_version: ${{ steps.plan.outputs.llvm_version }}
      clazy_sha256: ${{ steps.plan.outputs.clazy_sha256 }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      # A pull request's merge commit and its two parents hold the PR diff.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
          sparse-checkout: |
            /src/
            .github/build-config.json
            tools/ci/planning/analysis_matrix.py
            tools/_bootstrap.py
            tools/common
            tools/qgc_tools
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Validates the dispatch path and builds each job's tools/analyze.py arguments.
      - name: Plan analysis jobs
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TOOL: ${{ inputs.tool }}
          DISPATCH_PATH: ${{ inputs.path }}
          DISPATCH_ANALYZE_ALL: ${{ inputs.analyze_all }}
          DISPATCH_PROFILE_CHECKS: ${{ inputs.profile_checks }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/ci/planning/analysis_matrix.py

  analyze:
    name: ${{ join(matrix.tools, ' + ') }} Analysis${{ matrix.shard_count > 1 && format(' ({0}/{1})', matrix.shard, matrix.shard_count) || '' }}
    needs: plan
    if: needs.plan.outputs.include != '[]'
    runs-on: >-
      ${{
        github.repository_owner == 'mavlink' &&
        format('runs-on={0}-analyze-{1}-{2}/runner=linux-x64-analyzer',
          github.run_id, github.run_attempt, strategy.job-index) ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}

    steps:
      # The Harden-Runner community tier audits GitHub-hosted runners only, not RunsOn.
      - name: Harden Runner
        if: runner.environment == 'github-hosted'
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Enable RunsOn magic cache
        uses: runs-on/action@v2
        with:
          show_costs: summary

      # Pull requests need only the merge commit and its parents; a dispatched "changed" scan
      # diffs against the default branch.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          persist-credentials: false

      - name: Build Setup
        uses: ./.github/actions/build-setup
        with:
          qt-host: linux
          qt-arch: linux_gcc_64
          build-type: Debug
          cache-variant: ${{ matrix.tool }}
          save-cache: ${{ matrix.shard == 1 }}

      # The planner adds clang and clang-tools (clang-scan-deps) for the analysis LLVM, plus IWYU.
      # Clazy's LLVM development packages install only to rebuild it.
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          extra-packages: ${{ matrix.extra_packages }}

      # Ubuntu's Clazy links LLVM 15; build it against the configured compiler instead.
      - name: Cache matching Clazy
        id: clazy-cache
        if: contains(matrix.tools, 'clazy')
        uses: actions/cache@v6
        with:
          path: .cache/clazy
          key: clazy-ubuntu-24.04-${{ runner.arch }}-${{ needs.plan.outputs.llvm_version }}-${{ needs.plan.outputs.clazy_sha256 }}-${{ hashFiles('tools/setup/build_clazy.py') }}

      - name: Build matching Clazy
        if: contains(matrix.tools, 'clazy') && steps.clazy-cache.outputs.cache-hit != 'true'
        env:
          LLVM_VERSION: ${{ needs.plan.outputs.llvm_version }}
        run: |
          python3 tools/ci/runner/apt_install_retry.py --install-timeout 600 --label "Clazy build dependencies" \
            "llvm-$LLVM_VERSION-dev" "libclang-$LLVM_VERSION-dev" "libclang-cpp$LLVM_VERSION-dev"
          python3 tools/setup/build_clazy.py --prefix .cache/clazy --work-dir "$RUNNER_TEMP/clazy"

      # clang-tidy comes from the PyPI wheel hash-pinned in build-config.json, ahead of LLVM's own on
      # PATH; Clazy and clang-scan-deps stay on the compiler's LLVM.
      - name: Select analysis executables
        if: matrix.family != 'tsan'
        env:
          ANALYSIS_TOOLS: ${{ join(matrix.tools, ' ') }}
        run: python3 tools/ci/runner/analysis_tools.py

      # analysis_matrix.py plans each family's arguments: compiler analysis uses the pinned LLVM
      # without PCH or unity batches; ThreadSanitizer (manual only, as linux.yml runs ASan and
      # UBSan) keeps the default compiler.
      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          preset: Linux-debug
          extra-args: ${{ join(matrix.configure_args, ' ') }}

      - name: Generate protocol headers
        if: matrix.family == 'compiler' || matrix.family == 'iwyu'
        uses: ./.github/actions/cmake-build
        with:
          target: qgc-analysis-headers

      # Analyzed sources include only protocol headers and configure outputs, never moc or uic
      # results, so clang-tidy and Clazy skip Qt's autogen target.
      - name: Generate Qt analysis prerequisites
        if: matrix.family == 'iwyu'
        uses: ./.github/actions/cmake-build
        with:
          target: autogen

      - name: Build runtime analysis prerequisites
        if: matrix.family == 'qml' || matrix.family == 'tsan'
        uses: ./.github/actions/cmake-build

      # Only master pushes save results, as one job; every other run restores the newest copy.
      - name: Restore analysis results
        if: matrix.family == 'compiler'
        uses: actions/cache/restore@v6
        with:
          path: .cache/analysis-results
          key: analysis-results-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: analysis-results-v1-${{ runner.os }}-${{ runner.arch }}-

      # analysis_matrix.py builds the arguments; a "changed" scan diffs a PR's merge checkout
      # against its first parent. `shell: bash` adds pipefail, so analyze.py's status survives tee.
      - name: Run analysis
        id: analysis
        if: matrix.family == 'compiler' || matrix.family == 'qml'
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ANALYZE_ARGS: ${{ toJSON(matrix.analyze_args) }}
        run: |
          arg_lines=$(jq -r '.[]' <<< "$ANALYZE_ARGS")
          mapfile -t args <<< "$arg_lines"
          python3 tools/analyze.py --build-dir "${RUNNER_TEMP}/build" --step-summary "${args[@]}" 2>&1 | tee "${RUNNER_TEMP}/build/analysis-output.txt"

      # Stored results are complete analyses only, so findings do not prevent saving.
      - name: Save analysis results
        if: >-
          !cancelled() && steps.analysis.outcome != 'skipped' && github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: .cache/analysis-results
          key: analysis-results-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}

      # IWYU is advisory: its uploaded report is the result, even when iwyu_tool exits non-zero
      # because some units failed to compile.
      - name: Run IWYU
        if: matrix.family == 'iwyu'
        continue-on-error: true
        shell: bash
        env:
          ANALYSIS_PATH: ${{ matrix.path }}
        run: |
          iwyu_tool.py -p "${RUNNER_TEMP}/build" -j "$(nproc)" "${GITHUB_WORKSPACE}/${ANALYSIS_PATH}" 2>&1 | tee "${RUNNER_TEMP}/build/iwyu-output.txt"

      - name: Run Sanitizer Tests
        if: matrix.family == 'tsan'
        uses: ./.github/actions/run-unit-tests
        with:
          junit-output: junit-results-analysis-${{ matrix.tool }}.xml
          ctest-output: sanitizer-output.txt
          include-labels: 'Unit|Integration'
          exclude-labels: 'Flaky|Network|NoSanitizer'
          parallel: '1'

      - name: Upload Output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ join(matrix.tools, '-') }}-output${{ matrix.shard_count > 1 && format('-{0}', matrix.shard) || '' }}
          path: |
            ${{ runner.temp }}/build/analysis-output.txt
            ${{ runner.temp }}/build/*-timings.json
            ${{ runner.temp }}/build/*-diagnostics.json
            ${{ runner.temp }}/build/*-progress.jsonl
            ${{ runner.temp }}/build/*-raw.txt
            ${{ runner.temp }}/build/clang-tidy-profiles/
            ${{ runner.temp }}/build/iwyu-output.txt
            ${{ runner.temp }}/build/sanitizer-output.txt
            ${{ runner.temp }}/build/junit-results-analysis-${{ matrix.tool }}.xml
          if-no-files-found: ignore
          retention-days: 7
