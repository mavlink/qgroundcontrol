name: Docs Lint

on:
  pull_request:
    paths:
      - 'docs/en/**'
      - '.pre-commit-config.yaml'
      - '.vale.ini'
      - '.markdownlint*'
      - '.typos.toml'
      - '.github/workflows/docs-lint.yml'
      - 'tools/pre_commit.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        uses: $/.github/actions/setup-python
        with:
          groups: precommit
      # Manual runs have no base revision and check every English page.
      - name: Lint English documentation
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 ./tools/pre_commit.py --ci --docs ${PR_BASE_SHA:+--changed}
