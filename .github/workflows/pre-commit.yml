name: pre-commit

on:
  push:
    branches:
      - master
      - 'Stable*'
    paths-ignore:
      - 'docs/**'
      - 'translations/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'translations/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get build config
        id: config
        uses: $/.github/actions/build-config

      - name: Setup Python
        uses: $/.github/actions/setup-python
        with:
          groups: dev
          python-version: '3.12'

      - name: Install Qt (for qmllint)
        uses: $/.github/actions/qt-install
        with:
          version: ${{ steps.config.outputs.qt_version }}
          host: linux
          arch: linux_gcc_64
          archives: qtbase qtdeclarative icu

      # Hook environments are reused across config changes; prek reinstalls unhealthy ones. Its
      # download and build caches (Go modules, uv, npm) are only needed while installing hooks.
      - name: Restore prek environments
        id: pre-commit-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/prek
            !~/.cache/prek/cache
          key: prek-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            prek-v1-${{ runner.os }}-${{ runner.arch }}-

      # Later steps run after hook failures through their !cancelled()/always() conditions.
      - name: Run pre-commit
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # TruffleHog runs only as a local commit hook.
          SKIP: trufflehog
        run: python3 ./tools/pre_commit.py --ci --changed --results-dir pre-commit-results

      # Pull requests restore the base branch's environments without adding cache entries.
      - name: Prune unused prek environments
        if: >-
          !cancelled() && github.event_name == 'push' &&
          steps.pre-commit-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: prek cache gc

      - name: Save prek environments
        if: >-
          !cancelled() && github.event_name == 'push' &&
          steps.pre-commit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/prek
            !~/.cache/prek/cache
          key: ${{ steps.pre-commit-cache.outputs.cache-primary-key }}

      - name: Upload pre-commit results artifact
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@v7
        with:
          name: pre-commit-results
          path: pre-commit-results
          retention-days: 7
