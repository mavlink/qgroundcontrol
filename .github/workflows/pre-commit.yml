name: pre-commit

# Every path, including docs and translations: the hooks select their own files, and a changed docs lint
# configuration also rechecks every English page.
on:
  push:
    branches:
      - master
      - 'Stable*'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      # A pull request's merge commit and its two parents hold the PR diff; pushes diff `before`.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          persist-credentials: false

      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          groups: dev
          python-version: '3.12'

      - name: Check for QML changes
        id: qml
        run: python3 ./tools/pre_commit.py --changed --needs-qt

      - name: Install Qt (for qmllint)
        if: steps.qml.outputs.needs-qt == 'true'
        uses: ./.github/actions/qt-install
        with:
          host: linux
          arch: linux_gcc_64
          archives: qtbase qtdeclarative icu

      # Hook environments are reused across config changes; prek reinstalls unhealthy ones. Its
      # download and build caches (Go modules, uv, npm) are only needed while installing hooks.
      - name: Restore prek environments
        id: pre-commit-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/prek
            !~/.cache/prek/cache
          key: prek-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            prek-v1-${{ runner.os }}-${{ runner.arch }}-

      # Later steps run after hook failures through their !cancelled()/always() conditions.
      - name: Run pre-commit
        run: python3 ./tools/pre_commit.py --ci --changed --results-dir pre-commit-results

      # Pull requests restore the base branch's environments without adding cache entries. prek
      # installs only the environments of hooks that run, so a push that misses the cache prepares
      # every hook first, including the manual-stage ones, and prunes unused environments.
      - name: Prepare and prune prek environments
        id: prepare-hooks
        if: >-
          !cancelled() && github.event_name == 'push' &&
          steps.pre-commit-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: python3 ./tools/pre_commit.py --prepare-cache

      # A partial set would be frozen under this configuration's key; the next push retries.
      - name: Save prek environments
        if: >-
          !cancelled() && github.event_name == 'push' &&
          steps.pre-commit-cache.outputs.cache-hit != 'true' &&
          steps.prepare-hooks.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/prek
            !~/.cache/prek/cache
          key: ${{ steps.pre-commit-cache.outputs.cache-primary-key }}

      - name: Upload pre-commit results artifact
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@v7
        with:
          name: pre-commit-results
          path: pre-commit-results
          retention-days: 7
