name: Custom Build

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      debug_runner:
        description: 'Open an actor-only SSH session after a failure (up to 15 minutes, branches only)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  changes:
    uses: ./.github/workflows/_detect-changes.yml
    with:
      platform: custom-build

  build:
    name: ${{ matrix.build-type == 'Debug' && 'Custom Plugin Test Debug' || 'Custom Plugin Build' }}
    needs: changes
    if: needs.changes.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        build-type: ${{ fromJSON(github.event_name == 'pull_request' && '["Debug"]' || '["Debug", "Release"]') }}
    runs-on: >-
      ${{
        github.repository_owner == 'mavlink' &&
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
        format('runs-on={0}/runner={1}', github.run_id,
          matrix.build-type == 'Debug' && 'linux-x64-tester' ||
          vars.RUNS_ON_LINUX_BUILDER || 'linux-x64-builder-60gb') ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 120

    permissions:
      actions: read
      contents: read
      id-token: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Record build timeline
        uses: Kesin11/actions-timeline@v3
        continue-on-error: true
        with:
          show-waiting-runner: true

      - name: Enable RunsOn magic cache
        if: github.repository_owner == 'mavlink' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: runs-on/action@v2
        with:
          metrics: cpu,network,memory,disk,io
          show_costs: summary

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Build Environment
        uses: ./.github/actions/build-setup
        with:
          qt-host: linux
          qt-arch: linux_gcc_64
          build-type: ${{ matrix.build-type }}
          cache-variant: custom
          cache-key-suffix: ${{ matrix.build-type == 'Debug' && 'custom-debug' || 'custom-release' }}

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: ${{ matrix.build-type }}
          preset: ${{ matrix.build-type == 'Debug' && 'Linux-debug' || 'Linux' }}
          testing: ${{ matrix.build-type == 'Debug' }}
          extra-args: -DQGC_CUSTOM_DIR=custom-example

      - name: Build
        id: build
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: ${{ matrix.build-type }}

      - name: Create AppImage
        if: matrix.build-type == 'Release'
        uses: ./.github/actions/cmake-install
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: ${{ matrix.build-type }}

      - name: Verify Custom AppImage
        if: matrix.build-type == 'Release'
        uses: ./.github/actions/verify-executable
        with:
          binary-path: Custom-QGroundControl-x86_64.AppImage
          type: appimage
          working-dir: ${{ runner.temp }}/build

      - name: Run and report tests
        if: ${{ !cancelled() && matrix.build-type == 'Debug' && steps.build.outcome == 'success' }}
        uses: ./.github/actions/test-phase
        with:
          build-dir: ${{ runner.temp }}/build
          suite: custom
          integration-exclude-labels: 'Flaky|Network|StockUI'
          upload-codecov: ${{ vars.CODECOV_TEST_ANALYTICS == 'true' }}

      - name: Debug failed runner
        if: ${{ failure() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.debug_runner && github.ref_type == 'branch' }}
        timeout-minutes: 15
        uses: ./.github/actions/debug-runner
