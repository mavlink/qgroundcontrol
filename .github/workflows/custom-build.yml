name: Custom Build

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  changes:
    uses: ./.github/workflows/_detect-changes.yml
    with:
      platform: custom-build

  build:
    name: Custom Plugin Build
    needs: changes
    if: needs.changes.outputs.should_build == 'true'
    runs-on: ${{ github.repository_owner == 'mavlink' && format('runs-on={0}/runner=linux-x64-builder-60gb', github.run_id) || 'ubuntu-24.04' }}
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    steps:
      - name: Enable RunsOn magic cache
        if: github.repository_owner == 'mavlink'
        uses: runs-on/action@v2
        with:
          metrics: cpu,network,memory,disk,io
          show_costs: summary

      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Build Environment
        uses: ./.github/actions/build-setup
        with:
          qt-host: linux
          qt-arch: linux_gcc_64
          build-type: Release
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release
          extra-args: -DQGC_CUSTOM_DIR=custom-example

      - name: Build
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release

      - name: Create AppImage
        uses: ./.github/actions/cmake-install
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release

      - name: Verify Custom AppImage
        uses: ./.github/actions/verify-executable
        with:
          binary-path: Custom-QGroundControl-x86_64.AppImage
          type: appimage
          working-dir: ${{ runner.temp }}/build

  # Debug build with unit/integration tests: the custom plugin overlay changes real code paths
  # (QGCCorePlugin overrides, disabled APM plugin), so the test suite must pass against it too.
  test:
    name: Custom Plugin Test Debug
    needs: changes
    if: needs.changes.outputs.should_build == 'true'
    runs-on: ${{ github.repository_owner == 'mavlink' && format('runs-on={0}/runner=linux-x64-tester', github.run_id) || 'ubuntu-24.04' }}
    timeout-minutes: 90

    # checks: write scoped here: only this job reports test results (dorny/test-reporter).
    permissions:
      contents: read
      checks: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Enable RunsOn magic cache
        if: github.repository_owner == 'mavlink'
        uses: runs-on/action@v2
        with:
          metrics: cpu,network,memory,disk,io
          show_costs: summary

      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Build Environment
        uses: ./.github/actions/build-setup
        with:
          qt-host: linux
          qt-arch: linux_gcc_64
          build-type: Debug
          cache-variant: custom
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Debug
          testing: 'true'
          extra-args: -DQGC_CUSTOM_DIR=custom-example

      - name: Build
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Debug

      # Split by label so Unit parallelizes; Integration serializes on shared MockLink/LinkManager state.
      - name: Run Unit Tests (parallel)
        id: unit_tests
        uses: ./.github/actions/run-unit-tests
        with:
          build-dir: ${{ runner.temp }}/build
          junit-output: junit-results-custom-unit.xml
          ctest-output: test-output-custom-unit.txt
          include-labels: 'Unit'
          exclude-labels: 'Flaky|Network'
          parallel: 'auto'

      - name: Run Integration Tests (serial)
        id: integration_tests
        if: always() && !cancelled() && steps.unit_tests.conclusion != 'cancelled'
        uses: ./.github/actions/run-unit-tests
        with:
          build-dir: ${{ runner.temp }}/build
          junit-output: junit-results-custom-integration.xml
          ctest-output: test-output-custom-integration.txt
          include-labels: 'Integration'
          # StockUI tests assert stock UI elements the custom overlay intentionally replaces
          exclude-labels: 'Flaky|Network|StockUI'
          parallel: '1'

      - name: Report Test Results (unit)
        if: always() && !cancelled() && steps.unit_tests.conclusion != 'skipped'
        uses: ./.github/actions/test-report
        with:
          name: Custom Unit Tests
          build-dir: ${{ runner.temp }}/build
          junit-file: junit-results-custom-unit.xml
          output-file: test-output-custom-unit.txt
          artifact-name: test-results-custom-unit
          retention-days: 7

      - name: Report Test Results (integration)
        if: always() && !cancelled() && steps.integration_tests.conclusion != 'skipped'
        uses: ./.github/actions/test-report
        with:
          name: Custom Integration Tests
          build-dir: ${{ runner.temp }}/build
          junit-file: junit-results-custom-integration.xml
          output-file: test-output-custom-integration.txt
          artifact-name: test-results-custom-integration
          retention-days: 7
