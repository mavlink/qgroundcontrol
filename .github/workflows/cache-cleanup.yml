name: Cache Cleanup

on:
  # Periodic GC leaves room for fresh rolling build caches, and deletes the compiler-cache
  # snapshot artifacts that newer snapshots superseded.
  schedule:
    - cron: '17 */6 * * *'
  # Deletes the closed PR's merge-ref caches.
  pull_request_target:  # zizmor: ignore[dangerous-triggers] deletes the PR merge-ref cache via trusted base script; no PR code checkout/execution
    types: [closed]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to clean (leave empty for all branches)'
        required: false
        type: string
      dry-run:
        description: 'List caches and superseded snapshots without deleting'
        required: false
        type: boolean
        default: true
      mode:
        description: 'prune = keep newest build/dependency cache generations and compiler-cache snapshots; wipe = delete all listed caches'
        required: false
        type: choice
        options:
          - prune
          - wipe
        default: prune

permissions:
  contents: read

jobs:
  cleanup:
    name: Cleanup Caches
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request_target' && 5 || 30 }}
    permissions:
      contents: read
      # Required to delete cache entries and superseded compiler-cache snapshot artifacts.
      actions: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            tools/_bootstrap.py
            tools/ci
            tools/common
            tools/qgc_tools
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      # The script takes the branch, deletion, summary, and prune mode from the triggering event.
      # A prune also deletes superseded compiler-cache snapshots; it fails, deleting none, when
      # it cannot list the artifacts completely.
      - name: List and clean caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 tools/ci/cache/gh_cache_cleanup.py
