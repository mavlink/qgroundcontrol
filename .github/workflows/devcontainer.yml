name: Dev Container

# Publishes the Dockerfile's devcontainer target as ghcr.io/mavlink/qgc-dev, one image for
# linux/amd64 and linux/arm64, each built natively. Upstream master pushes that change the image's
# inputs publish `latest`; release tags on a Stable* branch publish their version. Pull requests,
# forks, and manual runs only build. .devcontainer/devcontainer.json reuses the published layers as
# a build cache.
on:
  push:
    branches: [master]
    # GitHub skips path filters for tag pushes, so every release tag starts a run.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
    # Every file the Dockerfile copies into the base, linux, and devcontainer* stages;
    # tools/tests/ci/contracts/test_devcontainer_workflow.py keeps the list complete.
    paths:
      - '.devcontainer/**'
      - '.dockerignore'
      - '.github/build-config.json'
      - '.github/workflows/devcontainer.yml'
      - 'deploy/docker/Dockerfile'
      - 'deploy/docker/entrypoint.py'
      - 'deploy/docker/entrypoint.sh'
      - 'deploy/docker/install_android_sdk.sh'
      - 'deploy/docker/lib/**'
      - 'deploy/docker/qgc-android.sh'
      - 'deploy/docker/smoke_devcontainer.py'
      - 'tools/.python-version'
      - 'tools/_bootstrap.py'
      - 'tools/common/**'
      - 'tools/pyproject.toml'
      - 'tools/qgc_tools/**'
      - 'tools/setup/build_clazy.py'
      - 'tools/setup/install_analysis_tools.py'
      - 'tools/setup/install_ccache.py'
      - 'tools/setup/install_dependencies/**'
      - 'tools/setup/install_qt.py'
      - 'tools/setup/qt_installer/**'
      - 'tools/setup/read_config.py'
      - 'tools/uv.lock'
  # The image inputs without the locked Python environment (tools/pyproject.toml and tools/uv.lock):
  # a pull request that changes only those, such as Renovate's lock updates, builds Linux alone
  # (PYTHON_ENVIRONMENT_FILES in detect_changes.py). The contract test compares the two lists.
  pull_request:
    paths:
      - '.devcontainer/**'
      - '.dockerignore'
      - '.github/build-config.json'
      - '.github/workflows/devcontainer.yml'
      - 'deploy/docker/Dockerfile'
      - 'deploy/docker/entrypoint.py'
      - 'deploy/docker/entrypoint.sh'
      - 'deploy/docker/install_android_sdk.sh'
      - 'deploy/docker/lib/**'
      - 'deploy/docker/qgc-android.sh'
      - 'deploy/docker/smoke_devcontainer.py'
      - 'tools/.python-version'
      - 'tools/_bootstrap.py'
      - 'tools/common/**'
      - 'tools/qgc_tools/**'
      - 'tools/setup/build_clazy.py'
      - 'tools/setup/install_analysis_tools.py'
      - 'tools/setup/install_ccache.py'
      - 'tools/setup/install_dependencies/**'
      - 'tools/setup/install_qt.py'
      - 'tools/setup/qt_installer/**'
      - 'tools/setup/read_config.py'
  workflow_dispatch:

# Only a pull request's superseded runs are cancelled. The pushes to one branch or tag take turns
# and are never cancelled mid-run: each publishes that ref's images, and the newest must publish
# last. A push run still waiting for its turn gives way to a newer push. A run started by hand
# has a group of its own: in the ref's group it would replace the waiting push run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/mavlink/qgc-dev
  # metadata-action would otherwise describe the image with the repository's description.
  IMAGE_DESCRIPTION: >-
    QGroundControl development container: Qt, the build dependencies, CI's analysis tools, and on
    amd64 the Android SDK

jobs:
  # Release tags are cut on Stable* branches. Like release.yml, this stops a pushed vX.Y.Z tag that
  # no Stable* branch contains, before anything is built or published. The job itself runs on every
  # event: a skipped job would also skip the jobs that need it.
  release-tag:
    name: Check Release Tag
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      # fetch-depth 0 fetches every tag and every branch as origin/*, which the check reads.
      - name: Checkout release tag check
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: |
            tools/_bootstrap.py
            tools/ci
            tools/common
            tools/qgc_tools
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Require a Stable branch tag
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: python3 tools/ci/publish/release_branch_check.py --ref "${GITHUB_REF}"

  build:
    name: Dev Container ${{ matrix.arch }}
    runs-on: >-
      ${{
        github.repository_owner == 'mavlink' &&
        format('runs-on={0}-devcontainer-{1}-{2}/runner={3}',
          github.run_id, github.run_attempt, strategy.job-index, matrix.runson_runner) ||
        matrix.hosted_runner
      }}
    needs: release-tag
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      publish: ${{ steps.policy.outputs.publish }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runson_runner: linux-x64-builder
            hosted_runner: ubuntu-24.04
          - arch: arm64
            runson_runner: linux-arm64-builder
            hosted_runner: ubuntu-24.04-arm

    steps:
      # The Harden-Runner community tier audits GitHub-hosted runners only, not RunsOn.
      - name: Harden Runner
        if: runner.environment == 'github-hosted'
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      # On RunsOn, the type=gha Buildx cache goes to S3.
      - name: Enable RunsOn magic cache
        uses: runs-on/action@13fbb6a39310a0dac9ab4716da2c4e74a3326dfc # v2.7.0
        with:
          show_costs: summary

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Free Disk Space
        if: runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk-space

      - name: Decide publishing
        id: policy
        env:
          PUBLISH: >-
            ${{ github.event_name == 'push' && github.repository == 'mavlink/qgroundcontrol' &&
            (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
        run: echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=qgc-dev
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./deploy/docker/Dockerfile
          target: devcontainer
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: qgc-dev:ci
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,version=2,scope=qgc-devcontainer-${{ matrix.arch }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,version=2,scope=qgc-devcontainer-{0},mode=max', matrix.arch) || '' }}

      # Builds and analyzes a small Qt program, and on amd64 compiles it for Android.
      - name: Smoke test image
        run: >-
          docker run --rm -v "${GITHUB_WORKSPACE}:/workspaces/qgroundcontrol:ro" qgc-dev:ci
          bash -lc 'python3 deploy/docker/smoke_devcontainer.py'

      # Builds the image as VS Code does, adding devcontainer.json's features on the cached layers
      # above, then runs its postCreateCommand and checks the login environment it creates.
      - name: Test devcontainer.json
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          runCmd: qtpaths --qt-version && test -f .vscode/settings.json

      # Pushes and manual runs inventory and scan the image; pull requests skip it.
      - name: Generate image SBOM
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: qgc-dev:ci
          format: cyclonedx-json
          output-file: image-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Install Grype
        if: github.event_name != 'pull_request'
        id: install-grype
        timeout-minutes: 5
        run: python3 tools/ci/security/install_grype.py

      - name: Scan image
        if: github.event_name != 'pull_request'
        id: grype
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          grype-version: ${{ steps.install-grype.outputs.version }}
          sbom: image-sbom.cdx.json
          fail-build: false
          severity-cutoff: high
          only-fixed: true
          output-format: sarif

      - name: Upload image scan to GitHub Security
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-image-devcontainer-${{ matrix.arch }}

      - name: Login to GHCR
        if: steps.policy.outputs.publish == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Reuses the build above from the builder's cache; the publish job tags the digests. Inline
      # cache metadata lets devcontainer.json's cacheFrom reuse the published layers.
      - name: Push image by digest
        id: push
        if: steps.policy.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./deploy/docker/Dockerfile
          target: devcontainer
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false
          cache-from: type=gha,version=2,scope=qgc-devcontainer-${{ matrix.arch }}
          cache-to: type=inline

      - name: Save image digest
        if: steps.policy.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
          printf '%s\n' "${DIGEST}" > image-digest.txt

      - name: Upload image digest
        if: steps.policy.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: devcontainer-digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload image SBOM
        if: steps.policy.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: devcontainer-sbom-${{ matrix.arch }}
          path: |
            image-digest.txt
            image-sbom.cdx.json
          if-no-files-found: error
          retention-days: 1

  # Each platform image carries its own SBOM; the publish job attests the multi-platform index.
  attest-sboms:
    name: Attest ${{ matrix.arch }} Dev Container SBOM
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write

    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Download image SBOM
        uses: actions/download-artifact@v8
        with:
          name: devcontainer-sbom-${{ matrix.arch }}

      - name: Read image digest
        id: image
        run: |
          digest=$(< image-digest.txt)
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Attest image SBOM
        uses: actions/attest@v4
        env:
          NODE_OPTIONS: --max-http-header-size=32768
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: image-sbom.cdx.json
          push-to-registry: true

  publish:
    name: Publish Dev Container
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Download image digests
        uses: actions/download-artifact@v8
        with:
          pattern: devcontainer-digest-*
          path: digests
          merge-multiple: true

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=tag

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create multi-platform image
        id: manifest
        working-directory: digests
        run: |
          mapfile -t digests < <(ls)
          [[ "${#digests[@]}" -eq 2 ]]
          mapfile -t tags < <(jq -r '.tags[]' <<< "${DOCKER_METADATA_OUTPUT_JSON}")
          # GHCR shows a multi-platform image's description only from its index annotation.
          docker buildx imagetools create "${tags[@]/#/--tag=}" \
            --annotation "index:org.opencontainers.image.description=${IMAGE_DESCRIPTION}" \
            "${digests[@]/#/${IMAGE}@sha256:}"
          digest=$(docker buildx imagetools inspect "${tags[0]}" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Attest image provenance
        uses: actions/attest@v4
        env:
          NODE_OPTIONS: --max-http-header-size=32768
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
