name: VM Builds

# Full QGC builds inside the developer VM provisioners (deploy/multipass, deploy/vagrant)
# to keep them from bit-rotting. Heavy nested-VM builds: scoped to their inputs + manual dispatch.
# RunsOn reads .github/runs-on.yml from the default branch only, so a pull request changing it
# would still build on the old pool; it triggers pushes alone.
on:
  push:
    branches:
      - master
      - 'Stable*'
    paths:
      - '.github/runs-on.yml'
      - 'tools/ci/runner/apt_install_retry.py'
      - 'tools/ci/runner/enable_kvm.py'
      - 'tools/ci/runner/install_multipass.py'
      - 'tools/setup/install_uv.py'
      - 'tools/setup/install_python.py'
      - 'tools/setup/install_qt.py'
      - 'tools/setup/qt_installer/**'
      - 'tools/setup/install_dependencies/**'
      - 'deploy/multipass/**'
      - 'deploy/vagrant/**'
      - '.github/build-config.json'
      - '.github/workflows/vm-builds.yml'
      - 'CMakePresets.json'
      - 'cmake/presets/**'
  pull_request:
    paths:
      - 'tools/ci/runner/apt_install_retry.py'
      - 'tools/ci/runner/enable_kvm.py'
      - 'tools/ci/runner/install_multipass.py'
      - 'tools/setup/install_uv.py'
      - 'tools/setup/install_python.py'
      - 'tools/setup/install_qt.py'
      - 'tools/setup/qt_installer/**'
      - 'tools/setup/install_dependencies/**'
      - 'deploy/multipass/**'
      - 'deploy/vagrant/**'
      - '.github/build-config.json'
      - '.github/workflows/vm-builds.yml'
      - 'CMakePresets.json'
      - 'cmake/presets/**'
  workflow_dispatch:

# Only a pull request's superseded runs are cancelled. Every other run has its own group, so a newer
# push neither cancels it nor replaces it while it waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  multipass-build:
    name: Multipass Build
    # Heavy nested-VM build that depends on fragile external resources (snap
    # store, image mirrors); informational only, never gate the PR on it.
    continue-on-error: true
    # Keep 16 GiB for the 12 GiB guest plus host overhead, with nested-virt (/dev/kvm).
    runs-on: >-
      ${{ github.repository_owner == 'mavlink' &&
          format('runs-on={0}-multipass-build-{1}-{2}/runner=linux-x64-vm-builder',
            github.run_id, github.run_attempt, strategy.job-index) || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      # The Harden-Runner community tier audits GitHub-hosted runners only, not RunsOn.
      - name: Harden Runner
        if: runner.environment == 'github-hosted'
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Enable RunsOn magic cache
        uses: runs-on/action@13fbb6a39310a0dac9ab4716da2c4e74a3326dfc # v2.7.0
        with:
          show_costs: summary

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Enable KVM
        run: python3 tools/ci/runner/enable_kvm.py

      # An unreachable snap store says nothing about the build: the job then warns and skips the
      # steps below instead of showing a failure.
      - name: Install Multipass and allow VM bridge networking
        id: multipass
        run: python3 tools/ci/runner/install_multipass.py --allow-bridge-forwarding --allow-store-outage

      - name: Build QGC in Multipass VM
        if: steps.multipass.outputs.installed == 'true'
        env:
          QGC_SOURCE_DIR: ${{ github.workspace }}
          # Pin the LTS via the `release:` remote: the bare-launch `lts` alias only promotes at
          # the .1 point release (~Aug), and `release:` scopes resolution away from the Ubuntu-Core
          # catalog whose retired core16 blob 403s and aborts the op (canonical/multipass#2794).
          MP_IMAGE: 'release:26.04'
          MP_CPUS: '4'
          MP_MEM: '12G'
          MP_DISK: '30G'
          OUTPUT_DIR: ${{ github.workspace }}/artifacts
        # As root, like every Multipass client call in CI (see install_multipass.py).
        run: |
          mkdir -p "${OUTPUT_DIR}"
          sudo --preserve-env=QGC_SOURCE_DIR,MP_IMAGE,MP_CPUS,MP_MEM,MP_DISK,OUTPUT_DIR \
            python3 deploy/multipass/run_multipass.py

      - name: Upload AppImage
        if: steps.multipass.outputs.installed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: qgc-multipass-appimage
          path: artifacts/*.AppImage
          if-no-files-found: error

  vagrant-build:
    name: Vagrant (libvirt) Build
    runs-on: >-
      ${{ github.repository_owner == 'mavlink' &&
          format('runs-on={0}-vagrant-build-{1}-{2}/runner=linux-x64-vm-builder',
            github.run_id, github.run_attempt, strategy.job-index) || 'ubuntu-latest' }}
    timeout-minutes: 180
    steps:
      # The Harden-Runner community tier audits GitHub-hosted runners only, not RunsOn.
      - name: Harden Runner
        if: runner.environment == 'github-hosted'
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Enable RunsOn magic cache
        uses: runs-on/action@13fbb6a39310a0dac9ab4716da2c4e74a3326dfc # v2.7.0
        with:
          show_costs: summary

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Enable KVM
        run: python3 tools/ci/runner/enable_kvm.py

      - name: Install Vagrant + libvirt
        run: python3 deploy/vagrant/run_vagrant.py install

      - name: Build QGC in Vagrant VM
        env:
          QGC_VM_CPUS: '4'
          QGC_VM_MEM_MB: '12288'
          OUTPUT_DIR: ${{ github.workspace }}/artifacts
        # Validates the Vagrantfile, builds, copies the AppImage out, and destroys the VM it started.
        run: python3 deploy/vagrant/run_vagrant.py build

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: qgc-vagrant-appimage
          path: artifacts/*.AppImage
          if-no-files-found: error
