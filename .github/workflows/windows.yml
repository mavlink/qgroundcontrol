name: Windows

on:
  push:
    branches:
      - master
      - 'Stable*'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    paths-ignore:
      - 'docs/**'
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      debug_runner:
        description: 'Open an actor-only SSH session after a failure (up to 15 minutes, branches only)'
        type: boolean
        default: false
      build_type:
        description: 'Build type'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

# Only a pull request's superseded runs are cancelled. The pushes to one branch or tag take turns
# and are never cancelled mid-run: Publish Builds publishes a commit from its push runs, once
# every platform has one. A push run still waiting for its turn gives way to a newer push. A run
# started by hand has a group of its own: in the ref's group it would replace the waiting push run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  changes:
    uses: ./.github/workflows/_detect-changes.yml
    with:
      platform: windows

  build:
    name: Build ${{ matrix.arch }} ${{ matrix.build_type }}
    needs: changes
    if: needs.changes.outputs.should_build == 'true'
    # Native arm64 stays on GitHub's windows-11-arm. The volume label repeats .github/runs-on.yml's
    # windows-x64-builder volume: RunsOn reads that file from master only, so a PR changing it would
    # otherwise build on the old disk. Pools ignore the label.
    runs-on: >-
      ${{
        github.repository_owner == 'mavlink' && matrix.variant != 'arm64' &&
        format('runs-on={0}-build-{1}-{2}/{3}',
          github.run_id, github.run_attempt, strategy.job-index,
          vars.RUNS_ON_WINDOWS_POOL != '' && format('pool={0}', vars.RUNS_ON_WINDOWS_POOL) ||
          'runner=windows-x64-builder/volume=130gb') ||
        matrix.hosted_runner
      }}
    timeout-minutes: 120

    # id-token/attestations scoped here: only the attestation upload step needs them.
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      matrix:
        build_type: ['${{ inputs.build_type || ''Release'' }}']
        variant: [amd64, arm64, arm64-cross]
        include:
          - variant: amd64
            hosted_runner: windows-2022
            host: windows
            arch: win64_msvc2022_64
            preset: Windows
            package: QGroundControl-installer-AMD64
            gstreamer: true

          - variant: arm64
            hosted_runner: windows-11-arm
            host: windows_arm64
            arch: win64_msvc2022_arm64
            preset: Windows-arm64
            package: QGroundControl-installer-ARM64
            gstreamer: true

          - variant: arm64-cross
            hosted_runner: windows-2022
            host: windows
            arch: win64_msvc2022_arm64_cross_compiled
            preset: Windows-arm64
            package: QGroundControl-installer-AMD64-ARM64
            gstreamer: false

    defaults:
      run:
        shell: cmd

    steps:
      # The Harden-Runner community tier audits GitHub-hosted runners only, not RunsOn.
      - name: Harden Runner
        if: runner.environment == 'github-hosted'
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Record build timeline
        uses: Kesin11/actions-timeline@460b1f8a750077029ad3589824d371b200e91dcf # v3.2.1
        continue-on-error: true
        with:
          show-waiting-runner: true

      - name: Enable RunsOn magic cache
        uses: runs-on/action@13fbb6a39310a0dac9ab4716da2c4e74a3326dfc # v2.7.0
        with:
          show_costs: summary

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          # Native package versions come from git describe and require reachable tags.
          fetch-depth: 0
          persist-credentials: false

      - name: Install Visual Studio Build Tools
        if: runner.environment != 'github-hosted'
        uses: ./.github/actions/install-dependencies
        with:
          msvc-arm64: ${{ matrix.variant == 'arm64-cross' }}

      - name: Build Setup
        id: build-setup
        uses: ./.github/actions/build-setup
        with:
          qt-host: ${{ matrix.host }}
          qt-arch: ${{ matrix.arch }}
          build-type: ${{ matrix.build_type }}

      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          preset: ${{ matrix.build_type == 'Debug' && format('{0}-debug', matrix.preset) || matrix.preset }}
          extra-args: >-
            -DQGC_BUILD_PORTABLE_TESTS=${{ matrix.variant == 'amd64' && 'ON' || 'OFF' }}
            -DQGC_ENABLE_GST_VIDEOSTREAMING=${{ matrix.gstreamer && 'ON' || 'OFF' }}
            -DQGC_CPACK_GENERATOR=NSIS
            -DQGC_USE_LLD_LINK=${{ matrix.build_type == 'Debug' && 'ON' || 'OFF' }}
            ${{ matrix.variant == 'arm64-cross' && format('-DQT_HOST_PATH={0}', steps.build-setup.outputs.host_qt_root_dir) || '' }}

      - name: Build
        id: build
        uses: ./.github/actions/cmake-build

      - name: Run portable tests
        id: portable
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.variant == 'amd64' }}
        uses: ./.github/actions/run-unit-tests
        with:
          include-labels: Portable
          junit-output: junit-portable.xml
          ctest-output: portable-output.txt
          report-name: Portable tests (windows)
          artifact-name: test-results-portable-windows

      - name: Verify Executable
        if: matrix.build_type == 'Release' && matrix.variant != 'arm64-cross'
        uses: ./.github/actions/verify-executable
        with:
          binary-path: ${{ runner.temp }}/build/${{ matrix.build_type }}/QGroundControl.exe
          type: exe
          build-dir: ${{ runner.temp }}/build

      - name: Create Installer
        uses: ./.github/actions/cmake-build
        with:
          target: qgc-package
          parallel: 'false'

      - name: Report installer contents
        if: matrix.build_type == 'Release'
        uses: ./.github/actions/artifact-report
        with:
          package: ${{ runner.temp }}/build/${{ matrix.package }}.exe
          artifact-name: ${{ matrix.package }}

      - name: Install, upgrade, and verify installer
        if: matrix.build_type == 'Release' && matrix.variant != 'arm64-cross'
        shell: pwsh
        env:
          INSTALLER_PATH: ${{ runner.temp }}\build\${{ matrix.package }}.exe
          OLD_INSTALL_DIR: ${{ runner.temp }}\qgc-install-old
          INSTALL_DIR: ${{ runner.temp }}\qgc-install-test
          EXPECT_GSTREAMER: ${{ matrix.gstreamer }}
        run: ./deploy/windows/verify-installer.ps1 -Phase Install

      # Names each DLL an installed file imports that neither ships nor comes with Windows, which the
      # boot test below would only report as a failed start.
      - name: Audit installed DLL dependencies
        if: matrix.build_type == 'Release' && matrix.variant != 'arm64-cross'
        shell: bash
        run: >-
          python3 "${GITHUB_WORKSPACE}/tools/ci/packaging/pe_dependency_audit.py"
          --install-dir "${QGC_INSTALL_TEST_DIR}"

      - name: Verify installed executable
        if: matrix.build_type == 'Release' && matrix.variant != 'arm64-cross'
        uses: ./.github/actions/verify-executable
        with:
          binary-path: ${{ env.QGC_INSTALL_TEST_BINARY }}
          type: exe

      - name: Uninstall and verify cleanup
        if: matrix.build_type == 'Release' && matrix.variant != 'arm64-cross'
        shell: pwsh
        run: ./deploy/windows/verify-installer.ps1 -Phase Uninstall

      - name: Attest and Upload
        if: matrix.build_type == 'Release'
        uses: ./.github/actions/attest-and-upload
        with:
          artifact-name: ${{ matrix.package }}.exe
          package-name: ${{ matrix.package }}
          subject-name: ${{ matrix.package }}-windows
          publish: ${{ matrix.variant != 'arm64-cross' }}
          job-id: ${{ job.check_run_id }}

      - name: Debug failed runner
        if: ${{ failure() && !cancelled() && inputs.debug_runner && github.ref_type == 'branch' }}
        timeout-minutes: 15
        uses: ./.github/actions/debug-runner

  # The only Windows run of the GStreamer and video test classes: a Debug build with tests, which
  # packages nothing.
  gstreamer-tests:
    name: GStreamer tests win64_msvc2022_64 Debug
    needs: changes
    if: needs.changes.outputs.should_build == 'true'
    runs-on: >-
      ${{
        github.repository_owner == 'mavlink' &&
        format('runs-on={0}-gstreamer-tests-{1}-{2}/{3}',
          github.run_id, github.run_attempt, strategy.job-index,
          vars.RUNS_ON_WINDOWS_POOL != '' && format('pool={0}', vars.RUNS_ON_WINDOWS_POOL) ||
          'runner=windows-x64-builder/volume=130gb') ||
        'windows-2022'
      }}
    timeout-minutes: 120

    permissions:
      contents: read
      actions: read

    defaults:
      run:
        shell: cmd

    steps:
      # The Harden-Runner community tier audits GitHub-hosted runners only, not RunsOn.
      - name: Harden Runner
        if: runner.environment == 'github-hosted'
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Enable RunsOn magic cache
        uses: runs-on/action@13fbb6a39310a0dac9ab4716da2c4e74a3326dfc # v2.7.0
        with:
          show_costs: summary

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Visual Studio Build Tools
        if: runner.environment != 'github-hosted'
        uses: ./.github/actions/install-dependencies

      - name: Build Setup
        uses: ./.github/actions/build-setup
        with:
          qt-host: windows
          qt-arch: win64_msvc2022_64
          build-type: Debug

      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          preset: Windows-debug
          extra-args: -DQGC_ENABLE_GST_VIDEOSTREAMING=ON -DQGC_USE_LLD_LINK=ON

      - name: Build
        id: build
        uses: ./.github/actions/cmake-build

      # CTest runs the build tree, which finds the SDK's DLLs, and the shipped plugins plus the test
      # sources and encoders, only through this environment.
      - name: Point CTest at the GStreamer SDK
        id: gst-env
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: >-
          python3 "${GITHUB_WORKSPACE}/tools/ci/packaging/verify_executable.py"
          --build-dir "${RUNNER_TEMP}/build" --export-gstreamer-env

      # QSG_RHI_PREFER_SOFTWARE_RENDERER makes the D3D11/D3D12 pixel tests' QRhi use WARP, as runners
      # have no GPU. GStreamer.* are cmake/GStreamer's script tests, whose Windows-only branches only
      # run here. The Qt Multimedia receiver, its recorder, the USB camera classes and the reconnect and recording-part
      # policies both receivers share run here too.
      - name: Run GStreamer tests
        if: ${{ !cancelled() && steps.gst-env.outcome == 'success' }}
        uses: ./.github/actions/run-unit-tests
        env:
          QSG_RHI_PREFER_SOFTWARE_RENDERER: '1'
        with:
          include-labels: 'Unit|Integration'
          tests-regex: '^(Gst|GStreamer[A-Z.]|Video|Subtitle|QGCVideo|QtMultimedia|QtVideo|UVC|StreamSupervisor|RecordingPlan)'
          junit-output: junit-gstreamer.xml
          ctest-output: gstreamer-output.txt
          report-name: GStreamer tests (windows)
          artifact-name: test-results-gstreamer-windows

      - name: Debug failed runner
        if: ${{ failure() && !cancelled() && inputs.debug_runner && github.ref_type == 'branch' }}
        timeout-minutes: 15
        uses: ./.github/actions/debug-runner

  # The check a ruleset should require (none does today): a skipped matrix job reports an
  # unexpanded name, so this job has the stable one. always(): a skipped gate would count as passing.
  windows-ok:
    name: Windows
    if: always()
    needs: [changes, build, gstreamer-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Require every leg to pass
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: build, gstreamer-tests
          jobs: ${{ toJSON(needs) }}
