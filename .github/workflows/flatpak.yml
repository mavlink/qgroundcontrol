name: Flatpak

on:
  workflow_dispatch:

concurrency:
  # flatpak-builder with the same cache key concurrently is undefined behavior.
  group: flatpak-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-47
      # flatpak-builder requires namespace operations not available in an unprivileged container.
      # This workflow is manual-trigger only and runner egress is audited as mitigation.
      options: --privileged

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build Flatpak
        uses: bilelmoussaoui/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: QGroundControl.flatpak
          manifest-path: deploy/linux/org.mavlink.qgroundcontrol.flatpak.yml
          cache: false

      - name: Upload Flatpak
        uses: actions/upload-artifact@v7
        with:
          name: QGroundControl-flatpak
          path: QGroundControl.flatpak
          retention-days: 14
          compression-level: 0
