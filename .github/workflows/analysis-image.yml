name: Analysis Image

on:
  push:
    tags:
      - 'analysis-image-v*'
  pull_request:
    paths:
      - '.github/workflows/analysis-image.yml'
      - '.github/build-config.json'
      - '.github/scripts/ccache_helper.py'
      - '.github/scripts/ci_bootstrap.py'
      - '.devcontainer/**'
      - '.dockerignore'
      - 'deploy/docker/**'
      - 'tools/setup/**'
      - 'tools/common/**'
      - 'tools/qgc_tools/**'
      - 'tools/_bootstrap.py'
      - 'tools/pyproject.toml'
      - 'tools/uv.lock'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  image:
    name: Build Analysis Image
    runs-on: >-
      ${{
        github.repository_owner == 'mavlink' &&
        format('runs-on={0}/runner={1}', github.run_id,
          vars.RUNS_ON_LINUX_BUILDER || 'linux-x64-builder') ||
        'ubuntu-latest'
      }}
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      PUBLISH_IMAGE: ${{ github.repository == 'mavlink/qgroundcontrol' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/analysis-image-v') }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Enable RunsOn magic cache
        if: github.repository_owner == 'mavlink'
        uses: runs-on/action@v2
        with:
          metrics: cpu,network,memory,disk,io
          show_costs: summary

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve image version
        id: version
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$PUBLISH_IMAGE" == 'true' ]]; then
            if [[ ! "$REF_NAME" =~ ^analysis-image-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "::error::Expected an analysis-image-vMAJOR.MINOR.PATCH tag"
              exit 1
            fi
            version="${BASH_REMATCH[1]}"
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
              echo "::error::Image release tags must point to a commit already on master"
              exit 1
            fi
          else
            version=validation
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: env.PUBLISH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/mavlink/qgroundcontrol-analysis
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,prefix=sha-,format=long,enable=${{ env.PUBLISH_IMAGE == 'true' }}

      - name: Build analysis image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./deploy/docker/Dockerfile
          target: devcontainer
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          push: ${{ env.PUBLISH_IMAGE == 'true' }}
          provenance: false
          sbom: false
          cache-from: type=gha,version=2,scope=qgc-docker-devcontainer-devcontainer
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,version=2,scope=qgc-docker-devcontainer-devcontainer,mode=max' || '' }}

      - name: Record published image
        if: env.PUBLISH_IMAGE == 'true'
        shell: bash
        env:
          IMAGE_VERSION: ${{ steps.version.outputs.version }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'Image: ghcr.io/mavlink/qgroundcontrol-analysis:%s\n\nDigest pin: ghcr.io/mavlink/qgroundcontrol-analysis@%s\n' \
            "$IMAGE_VERSION" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
