name: CI Scripts

on:
  pull_request:
    paths: &tooling-paths
      - '.github/**'
      - '.clusterfuzzlite/**'
      - '.vscode/**'
      - '.devcontainer/**'
      - '.clang*'
      - '.gitattributes'
      - '.editorconfig'
      - '.pre-commit-config.yaml'
      - '.qmllint.ini'
      - '.vale.ini'
      - 'ruff.toml'
      - 'pyrightconfig.json'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'justfile'
      - 'tools/**'
      - 'deploy/**'
      - 'src/Settings/**'
      - 'src/AppSettings/pages/**'
      - 'src/**/*.VehicleConfig.json'
      - 'src/Vehicle/FactGroups/VehicleGPSFactGroup.h'
      - 'docs/.vitepress/config.mjs'
  push:
    branches:
      - master
      - 'Stable*'
    paths: *tooling-paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  validate-runner-images:
    name: Validate Runner Images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: .github/runner-images
          persist-credentials: false

      - name: Setup Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: '1.16.0'

      - name: Validate Packer template
        working-directory: .github/runner-images
        env:
          PKR_VAR_aws_region: us-west-2
          PKR_VAR_subnet_id: subnet-00000000000000000
          PKR_VAR_source_repository: https://github.com/mavlink/qgroundcontrol.git
          PKR_VAR_source_ref: '0000000000000000000000000000000000000000'
          PKR_VAR_qt_version: 0.0.0
          PKR_VAR_qt_modules: ''
        run: |
          packer fmt -check qgc-ubuntu24-x64.pkr.hcl
          packer init qgc-ubuntu24-x64.pkr.hcl
          packer validate qgc-ubuntu24-x64.pkr.hcl

  validate-runson-config:
    name: Validate RunsOn Config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/runs-on.yml
            .github/runner-images/windows-warm-pool.example.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # runs-on/cli's setup action has no checksum check and runs the binary before any verification.
      - name: Install RunsOn CLI
        env:
          ROC_VERSION: v3.5.0
          ROC_SHA256: c3bffa3ab059464c757e40ceec04550628e42b46d12ee4ce873742c4022bfdc5
        run: |
          curl --fail --silent --show-error --location --retry 3 --output "${RUNNER_TEMP}/roc" \
            "https://github.com/runs-on/cli/releases/download/${ROC_VERSION}/roc_${ROC_VERSION}_linux_amd64"
          echo "${ROC_SHA256}  ${RUNNER_TEMP}/roc" | sha256sum --check --strict
          chmod +x "${RUNNER_TEMP}/roc"

      - name: Lint RunsOn config
        run: |
          "${RUNNER_TEMP}/roc" lint .github/runs-on.yml
          "${RUNNER_TEMP}/roc" lint .github/runner-images/windows-warm-pool.example.yml

  validate-renovate-config:
    name: Validate Renovate Config
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/actions/setup-python
            .github/renovate.json
            .pre-commit-config.yaml
            tools
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Renovate's validator installs Renovate from npm, so it runs only when its config or hook pin
      # changes. Without a base commit (manual runs, new branches) it always runs.
      - name: Detect Renovate config changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          changed=true
          if [[ -n "${BASE_SHA}" && "${BASE_SHA}" != 0000000000000000000000000000000000000000 ]] &&
            git fetch --no-tags --depth=1 origin "${BASE_SHA}" &&
            git diff --quiet "${BASE_SHA}" HEAD -- .github/renovate.json .pre-commit-config.yaml; then
            changed=false
          fi
          echo "changed=${changed}" >> "${GITHUB_OUTPUT}"

      - name: Setup Python
        if: steps.changes.outputs.changed == 'true'
        uses: ./.github/actions/setup-python
        with:
          groups: precommit

      - name: Restore prek environment
        if: steps.changes.outputs.changed == 'true'
        id: pre-commit-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/prek
            !~/.cache/prek/cache
          key: prek-renovate-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            prek-renovate-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Validate Renovate config
        if: steps.changes.outputs.changed == 'true'
        run: prek run renovate-config-validator --hook-stage manual --files .github/renovate.json

      # Drops environments for older Renovate pins restored through restore-keys.
      - name: Prune unused prek environments
        if: >-
          steps.changes.outputs.changed == 'true' && github.event_name == 'push' &&
          steps.pre-commit-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: prek cache gc

      - name: Save prek environment
        if: >-
          steps.changes.outputs.changed == 'true' && github.event_name == 'push' &&
          steps.pre-commit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/prek
            !~/.cache/prek/cache
          key: ${{ steps.pre-commit-cache.outputs.cache-primary-key }}

  test-ci-scripts:
    name: Test CI Scripts (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # release provides git-cliff for test_release_notes.py.
          - python-version: '3.10'
            groups: test,release
          # One leg installs numpy and rasterio (terrain) and pymavlink (simulation) so
          # test_terrain_pipeline.py and test_mock_vehicle.py run instead of skipping.
          - python-version: '3.12'
            groups: test,terrain,simulation,release
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            .clusterfuzzlite
            .clang-tidy
            .github
            .vscode
            .gitattributes
            .pre-commit-config.yaml
            CMakeLists.txt
            CMakePresets.json
            cmake
            docs/.vitepress/config.mjs
            justfile
            src/AppSettings/pages
            src/Settings
            src/**/*.VehicleConfig.json
            src/Vehicle/FactGroups/VehicleGPSFactGroup.h
            tools
            deploy
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          groups: ${{ matrix.groups }}
          python-version: ${{ matrix.python-version }}

      - name: Python syntax smoke test
        run: python3 -m compileall tools/*.py tools/ci tools/setup tools/common tools/qgc_tools tools/generators tools/analyzers tools/debuggers tools/simulation tools/terrain tools/translations

      - name: Run CI script tests
        run: pytest -q -n auto tools/tests

  test-tools-windows:
    name: Test Python Tools (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github
            cmake/Helpers.cmake
            cmake/ccache-launcher.cmd.in
            deploy/docker/Dockerfile
            src/**/*.VehicleConfig.json
            tools
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          groups: test
          python-version: '3.12'

      # Collection imports every test module and expands every parametrization, so the checkout
      # needs .github and the VehicleConfig pages test_config_qml_generator.py enumerates;
      # test_read_config.py reads the Dockerfile.
      - name: Run Windows-marked tests
        run: pytest -q -n 2 --durations=15 -m windows tools/tests
