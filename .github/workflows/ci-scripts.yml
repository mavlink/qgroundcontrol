name: CI Scripts

on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/actions/**'
      - '.github/workflows/**'
      - '.github/build-config.json'
      - '.vscode/*.default.json'
      - 'CMakePresets.json'
      - 'cmake/Helpers.cmake'
      - 'cmake/modules/CPMPatchCache.cmake'
      - 'cmake/install/**'
      - 'cmake/presets/**'
      - 'justfile'
      - 'tools/setup/**'
      - 'tools/*.py'
      - 'tools/uv.lock'
      - 'tools/tests/**'
      - 'tools/common/**'
      - 'tools/generators/**'
      - 'tools/analyzers/**'
      - 'tools/simulation/**'
      - 'tools/translations/**'
      - 'deploy/docker/**'
      - 'deploy/linux/PKGBUILD.in'
  push:
    branches:
      - master
      - 'Stable*'
    paths:
      - '.github/scripts/**'
      - '.github/actions/**'
      - '.github/workflows/**'
      - '.github/build-config.json'
      - '.vscode/*.default.json'
      - 'CMakePresets.json'
      - 'cmake/Helpers.cmake'
      - 'cmake/modules/CPMPatchCache.cmake'
      - 'cmake/install/**'
      - 'cmake/presets/**'
      - 'justfile'
      - 'tools/setup/**'
      - 'tools/*.py'
      - 'tools/uv.lock'
      - 'tools/tests/**'
      - 'tools/common/**'
      - 'tools/generators/**'
      - 'tools/analyzers/**'
      - 'tools/simulation/**'
      - 'tools/translations/**'
      - 'deploy/docker/**'
      - 'deploy/linux/PKGBUILD.in'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  lint-workflows:
    name: Lint Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # checks: write scoped here: only actionlint reports via github-pr-check.
    permissions:
      contents: read
      checks: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/.actionlint.yml
            .github/workflows
            .github/actions
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          actionlint_flags: -config-file .github/.actionlint.yml
          reporter: github-pr-check
          filter_mode: added
          fail_level: error
          level: warning

  test-ci-scripts:
    name: Test CI Scripts (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/actions/setup-python
            .github/actions/cmake-build
            .github/actions/cmake-configure
            .github/actions/build-prerequisites
            .github/actions/attest-and-upload
            .github/actions/attest-sbom
            .github/actions/cache
            .github/actions/docker
            .github/actions/free-disk-space
            .github/actions/qt-android
            .github/actions/qt-ios
            .github/actions/qt-install
            .github/actions/verify-executable
            .github/build-config.json
            .github/scripts
            .github/workflows
            .vscode
            CMakeLists.txt
            CMakePresets.json
            cmake/BuildConfig.cmake
            cmake/CustomOptions.cmake
            cmake/install
            cmake/modules/AppleXCFramework.cmake
            cmake/modules/Hardening.cmake
            cmake/modules/LinuxDistro.cmake
            cmake/modules/CPMPatchCache.cmake
            cmake/modules/PythonVenv.cmake
            cmake/Helpers.cmake
            cmake/Toolchain.cmake
            cmake/platform/Apple.cmake
            cmake/presets
            justfile
            src/AppSettings/pages
            src/Settings
            src/Vehicle/FactGroups/VehicleGPSFactGroup.h
            tools/pyproject.toml
            tools/uv.lock
            tools/*.py
            tools/setup
            tools/tests
            tools/common
            tools/generators
            tools/analyzers
            tools/simulation
            tools/translations
            deploy/docker
            deploy/ios
            deploy/linux/PKGBUILD.in
            deploy/multipass/build-in-vm.sh
            deploy/vagrant/Vagrantfile
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          groups: scripts,test
          python-version: ${{ matrix.python-version }}

      - name: Python syntax smoke test
        run: python3 -m compileall .github/scripts tools/*.py tools/setup tools/common tools/generators tools/analyzers tools/simulation tools/translations

      - name: Run CI script tests
        run: pytest -q tools/tests .github/scripts/tests

  test-moccache-windows:
    name: Test moccache (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/actions/setup-python
            tools/_bootstrap.py
            tools/common
            tools/moccache.py
            tools/pyproject.toml
            tools/setup
            tools/tests/test_moccache.py
            tools/uv.lock
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          groups: test
          python-version: '3.12'

      - name: Run moccache tests
        run: pytest -q tools/tests/test_moccache.py
