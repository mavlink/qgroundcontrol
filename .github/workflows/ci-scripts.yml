name: CI Scripts

on:
  pull_request:
    paths: &tooling-paths
      - '.github/**'
      - '.clusterfuzzlite/**'
      - '.vscode/**'
      - '.devcontainer/**'
      - '.clang*'
      - '.gitattributes'
      - '.editorconfig'
      - '.pre-commit-config.yaml'
      - '.qmllint.ini'
      - '.vale.ini'
      - 'ruff.toml'
      - 'pyrightconfig.json'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'justfile'
      - 'tools/**'
      - 'deploy/**'
      - 'src/Settings/**'
      - 'src/AppSettings/pages/**'
      - 'src/**/*.VehicleConfig.json'
      - 'src/Vehicle/FactGroups/VehicleGPSFactGroup.h'
      - 'src/FactSystem/factmetadata.schema.json'
      - 'docs/.vitepress/config.mjs'
      - 'docs/en/qgc-user-guide/getting_started/download_and_install.md'
  push:
    branches:
      - master
      - 'Stable*'
    paths: *tooling-paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  test-ci-scripts:
    name: Test CI Scripts (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # release provides git-cliff for test_release_notes.py.
          - python-version: '3.10'
            groups: test,release
          # One leg installs numpy and rasterio (terrain) and pymavlink (simulation) so
          # test_terrain_pipeline.py and test_mock_vehicle.py run instead of skipping.
          - python-version: '3.12'
            groups: test,terrain,simulation,release
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            .clusterfuzzlite
            .clang-tidy
            .github
            .vscode
            .gitattributes
            .pre-commit-config.yaml
            CMakeLists.txt
            CMakePresets.json
            cmake
            docs/.vitepress/config.mjs
            docs/en/qgc-user-guide/getting_started/download_and_install.md
            justfile
            src/AppSettings/pages
            src/Settings
            src/**/*.VehicleConfig.json
            src/Vehicle/FactGroups/VehicleGPSFactGroup.h
            src/FactSystem/factmetadata.schema.json
            tools
            deploy
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          groups: ${{ matrix.groups }}
          python-version: ${{ matrix.python-version }}

      - name: Run CI script tests
        run: pytest -q -n auto tools/tests

  test-tools-windows:
    name: Test Python Tools (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github
            cmake/Helpers.cmake
            cmake/ccache-launcher.cmd.in
            deploy/docker/Dockerfile
            src/**/*.VehicleConfig.json
            tools
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          groups: test
          python-version: '3.12'

      # Collection imports every test module and expands every parametrization, so the checkout
      # needs .github and the VehicleConfig pages test_config_qml_generator.py enumerates;
      # test_read_config.py reads the Dockerfile.
      - name: Run Windows-marked tests
        run: pytest -q -n 2 --durations=15 -m windows tools/tests
