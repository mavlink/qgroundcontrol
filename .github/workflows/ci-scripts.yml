name: CI Scripts

on:
  pull_request:
    paths: &tooling-paths
      - '.github/**'
      - '.clusterfuzzlite/**'
      - '.vscode/**'
      - '.devcontainer/**'
      - '.clang*'
      - '.gitattributes'
      - '.editorconfig'
      - '.pre-commit-config.yaml'
      - '.qmllint.ini'
      - '.vale.ini'
      - 'ruff.toml'
      - 'pyrightconfig.json'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'justfile'
      - 'tools/**'
      - 'deploy/**'
      - 'android/build.gradle'
      - 'src/Settings/**'
      - 'src/AppSettings/pages/**'
      - 'src/**/*.VehicleConfig.json'
      - 'src/**/CMakeLists.txt'
      - 'src/**/*.cmake'
      - 'src/Vehicle/FactGroups/VehicleGPSFactGroup.h'
      - 'src/FactSystem/factmetadata.schema.json'
      - 'src/VideoManager/GStreamer/README.md'
      - 'docs/.vitepress/config.mjs'
      - 'docs/en/qgc-user-guide/getting_started/download_and_install.md'
  push:
    branches:
      - master
      - 'Stable*'
    paths: *tooling-paths
  workflow_dispatch:

# Only a pull request's superseded runs are cancelled. Every other run has its own group, so a newer
# push neither cancels it nor replaces it while it waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-ci-scripts:
    name: Test CI Scripts (py3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            .clusterfuzzlite
            .clang-tidy
            .devcontainer
            .github
            .vscode
            .gitattributes
            .pre-commit-config.yaml
            CMakeLists.txt
            CMakePresets.json
            cmake
            docs/.vitepress/config.mjs
            docs/en/qgc-user-guide/getting_started/download_and_install.md
            justfile
            pyrightconfig.json
            ruff.toml
            src/AppSettings/pages
            src/Settings
            src/**/*.VehicleConfig.json
            src/**/CMakeLists.txt
            src/**/*.cmake
            src/Vehicle/FactGroups/VehicleGPSFactGroup.h
            src/FactSystem/factmetadata.schema.json
            src/VideoManager/GStreamer/README.md
            tools
            deploy
            android/build.gradle
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # release provides git-cliff for test_release_notes.py; numpy and rasterio (terrain) and
      # pymavlink (simulation) let test_terrain_pipeline.py and test_mock_vehicle.py run instead
      # of skipping. test itself carries the cmake package, whose presets schema
      # test_validate_cmake_presets.py checks the presets against.
      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          groups: test,terrain,simulation,release

      # -rs prints why each skipped test was skipped, such as a tool the runner lacks.
      - name: Run CI script tests
        run: pytest -q -rs -n auto tools/tests

  test-tools-windows:
    name: Test Python Tools (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github
            cmake/GStreamer/PluginPolicy.cmake
            cmake/Helpers.cmake
            cmake/ccache-launcher.cmd.in
            deploy/docker/Dockerfile
            src/**/*.VehicleConfig.json
            tools
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          groups: test

      # Collection imports every test module and expands every parametrization, so the checkout
      # needs .github and the VehicleConfig pages test_config_qml_generator.py enumerates;
      # test_read_config.py reads the Dockerfile and test_artifact_report.py the GPL denylist in
      # PluginPolicy.cmake.
      - name: Run Windows-marked tests
        run: pytest -q -rs -n 2 --durations=15 -m windows tools/tests
