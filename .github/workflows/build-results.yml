name: Build Results

on:
  workflow_run:  # zizmor: ignore[dangerous-triggers] consumes completed-build artifacts + PR metadata; never checks out or runs PR head code
    # GitHub requires literal workflow names here (no expressions). The list is every workflow
    # with a pull_request trigger, so the last check to finish renders the final comment, except
    # Dependency Review, Check Links, and Docs: each ends within about a minute, before CodeQL,
    # which runs on every pull request and refreshes their rows. REFRESHED_BY in
    # tools/tests/ci/contracts/test_platform_workflow_names.py holds those exceptions and
    # enforces the rest.
    workflows:
      - Linux
      - Windows
      - MacOS
      - Android
      - iOS
      - pre-commit
      - Code Analysis
      - CI Scripts
      - ClusterFuzzLite
      - CodeQL
      - Dev Container
      - Docker
      - Doxygen API Docs
      - VM Builds
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  report-context:
    name: Resolve Report Context
    # Only pull request builds have a comment to update. The other jobs need this one, so a
    # push, schedule, dispatch, or merge-queue build ends with every job skipped and no runner.
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      pr: ${{ steps.context.outputs.pr }}
      base_sha: ${{ steps.context.outputs.base_sha }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            tools/_bootstrap.py
            tools/ci
            tools/common
            tools/qgc_tools
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve report context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/reporting/report_context.py

  post-pr-comment:
    name: Post Build Results
    needs: report-context
    runs-on: ubuntu-latest
    # report_context.py sets `pr` only while the build's commit is an open PR's head.
    if: needs.report-context.outputs.pr != ''
    concurrency:
      group: build-results-pr-${{ needs.report-context.outputs.pr }}
      cancel-in-progress: false
    timeout-minutes: 10

    # pull-requests/issues write used only by this results-posting job.
    permissions:
      contents: read
      actions: read
      pull-requests: write
      issues: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      # The job's only checkout. collect_build_status.py needs only the standard library, so it
      # runs before Python dependencies are installed. The scripts take the commit and event from
      # the workflow_run payload and the platform workflows from build-config.json, and share one
      # snapshot of the runs in $RUNNER_TEMP.
      - name: Checkout build-results scripts
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions
            .github/build-config.json
            tools/.python-version
            tools/_bootstrap.py
            tools/ci
            tools/common
            tools/pyproject.toml
            tools/qgc_tools
            tools/setup
            tools/uv.lock
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      # Every completed trigger updates the comment, so it shows finished workflows (and their
      # failures) while others still run; the last one to complete renders the final state.
      - name: Collect build status
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/reporting/collect_build_status.py --status-out build-status.json

      - name: Install Python dependencies
        uses: ./.github/actions/setup-python
        with:
          groups: scripts

      # Every download is optional: download_artifacts.py records the artifacts that failed to
      # download, and the comment names them instead of going stale. Runs still in progress are
      # skipped until a later trigger.
      - name: Download artifacts from all platform workflows
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/ci/reporting/download_artifacts.py --include-failed --allow-missing \
            --artifact-prefixes coverage-report,test-results- --sizes-out pr-sizes.json

      - name: Download pre-commit results
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/ci/reporting/download_artifacts.py --include-failed --allow-missing \
            --workflows pre-commit --artifact-prefixes pre-commit-results

      - name: Download Code Analysis results
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/ci/reporting/download_artifacts.py --include-failed --allow-missing \
            --workflows "Code Analysis" --artifact-prefixes clang-tidy-clazy-output \
            --output-dir analysis-artifacts

      # The base commit's own push builds supply the sizes, coverage, and test names the comment
      # compares with; each platform falls back to "no base" on its own. report_context.py takes
      # the base branch's tip when the PR build's run was created, which the build merged into.
      # An empty --runs-cache queries the base commit instead of reusing the PR's run snapshot.
      - name: Download the PR base commit's build artifacts
        continue-on-error: true
        env:
          BASE_SHA: ${{ needs.report-context.outputs.base_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/ci/reporting/download_artifacts.py --head-sha "$BASE_SHA" --event push \
            --runs-cache '' --include-failed --allow-missing \
            --artifact-prefixes coverage-report,test-results- \
            --output-dir base-artifacts --sizes-out base-sizes.json

      # Reads the files above from its default paths (INPUT_PATHS) and writes comment.md, also
      # to this job's summary so the report is readable even if posting fails.
      - name: Generate combined report
        env:
          BASE_SHA: ${{ needs.report-context.outputs.base_sha }}
          PR_NUMBER: ${{ needs.report-context.outputs.pr }}
        run: python3 tools/ci/reporting/generate_build_results_comment.py

      # Rechecks that the PR head is still this build's commit, then creates or updates the PR's
      # build-results comment.
      - name: Publish comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/reporting/report_context.py --comment comment.md

  analysis-review:
    name: Post Analysis Review
    needs: report-context
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.path == '.github/workflows/analysis.yml' &&
      needs.report-context.outputs.pr != ''
    # Not the comment's group: a newer trigger queueing there would cancel this job while it waits,
    # and with it the only review of this analysis run.
    concurrency:
      group: analysis-review-pr-${{ needs.report-context.outputs.pr }}
      cancel-in-progress: false
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      # The scripts below need only the standard library, so no Python dependencies are installed.
      - name: Checkout analysis review scripts
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            tools/_bootstrap.py
            tools/ci
            tools/common
            tools/qgc_tools
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      # The comment's download, limited to the Code Analysis run that triggered this one, so the
      # review's run link and conclusion describe the reports it posts.
      - name: Download Code Analysis results
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/ci/reporting/download_artifacts.py --include-failed --allow-missing \
            --workflows "Code Analysis" --artifact-prefixes clang-tidy-clazy-output \
            --output-dir analysis-artifacts --only-triggering-run

      # Code Analysis's bug-class findings on changed lines become one inline review, up to a cap
      # per pull request; the step only warns on failure.
      - name: Post inline analysis review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.report-context.outputs.pr }}
        run: python3 tools/ci/reporting/analysis_review.py
