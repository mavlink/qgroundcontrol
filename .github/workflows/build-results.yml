name: Build Results

on:
  workflow_run:  # zizmor: ignore[dangerous-triggers] consumes completed-build artifacts + PR metadata; never checks out or runs PR head code
    # GitHub requires literal workflow names here (no expressions). Keep this
    # list in sync with build-config.json's `platform_workflows` plus any
    # non-platform triggers (pre-commit). Drift is enforced by
    # tools/tests/ci/contracts/test_platform_workflow_names.py.
    workflows: [Linux, Windows, MacOS, Android, pre-commit]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  load-config:
    name: Load Build Config
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      platform_workflows: ${{ steps.read.outputs.platform_workflows }}
      pr: ${{ steps.context.outputs.pr }}
      base_sha: ${{ steps.context.outputs.base_sha }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/build-config.json
            tools/ci/reporting/report_context.py
            tools/_bootstrap.py
            tools/setup/read_config.py
            tools/common
            tools/qgc_tools
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false
      - name: Read platform_workflows
        id: read
        run: |
          value=$(python3 tools/setup/read_config.py --get build.platform_workflows)
          echo "platform_workflows=${value:?platform_workflows is empty in build-config.json}" >> "$GITHUB_OUTPUT"

      - name: Resolve report context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/reporting/report_context.py

  post-pr-comment:
    name: Post Build Results
    needs: load-config
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' && needs.load-config.outputs.pr != ''
    concurrency:
      group: build-results-pr-${{ needs.load-config.outputs.pr }}
      cancel-in-progress: false
    timeout-minutes: 10

    # pull-requests/issues write used only by this results-posting job.
    permissions:
      contents: read
      actions: read
      pull-requests: write
      issues: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      # The job's only checkout. collect_build_status.py needs only the standard library, so it
      # gates the job before Python dependencies are installed.
      - &checkout-build-results
        name: Checkout build-results scripts
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions/download-all-artifacts
            .github/actions/setup-python
            tools/ci/__init__.py
            tools/ci/reporting/__init__.py
            tools/ci/reporting/collect_build_status.py
            tools/ci/reporting/download_artifacts.py
            tools/ci/reporting/generate_build_results_comment.py
            tools/ci/reporting/report_context.py
            tools/ci/reporting/templates/build_results.md.j2
            tools/ci/reporting/workflow_runs.py
            tools/_bootstrap.py
            tools/common
            tools/qgc_tools
            tools/pyproject.toml
            tools/uv.lock
            tools/setup/install_python.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      - name: Collect build status
        id: builds
        env:
          PLATFORM_WORKFLOWS: ${{ needs.load-config.outputs.platform_workflows }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUNS_CACHE: ${{ runner.temp }}/workflow-runs-cache.json
        run: |
          python3 "${GITHUB_WORKSPACE}/tools/ci/reporting/collect_build_status.py" \
            --repo "$REPO" \
            --head-sha "$HEAD_SHA" \
            --platform-workflows "${PLATFORM_WORKFLOWS}" \
            --event pull_request \
            --runs-cache "$RUNS_CACHE"

      - name: Install Python dependencies
        if: steps.builds.outputs.ready == 'true'
        uses: ./.github/actions/setup-python
        with:
          groups: scripts

      - name: Download artifacts from all platform workflows
        if: steps.builds.outputs.ready == 'true'
        uses: ./.github/actions/download-all-artifacts
        with:
          include-failed: 'true'
          allow-missing: 'true'
          head-sha: ${{ github.event.workflow_run.head_sha }}
          workflows: ${{ needs.load-config.outputs.platform_workflows }}
          event: pull_request
          runs-file: ${{ runner.temp }}/workflow-runs-cache.json
          artifact-prefixes: coverage-report,test-results-
          sizes-file: pr-sizes.json

      - name: Download pre-commit results artifact
        if: >-
          steps.builds.outputs.ready == 'true' &&
          steps.builds.outputs.precommit_run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ steps.builds.outputs.precommit_run_id }}
          github-token: ${{ github.token }}
          name: pre-commit-results
          path: artifacts/pre-commit-results

      - name: Restore baseline snapshot
        if: steps.builds.outputs.ready == 'true'
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: |
            baseline-sizes.json
            baseline-coverage-summary.json
          key: build-baseline-v2-${{ needs.load-config.outputs.base_sha }}
          restore-keys: |
            build-baseline-v2-${{ needs.load-config.outputs.base_sha }}-
            build-baseline-v2-

      - name: Generate combined report
        if: steps.builds.outputs.ready == 'true'
        env:
          BUILD_TABLE: ${{ steps.builds.outputs.table }}
          BUILD_SUMMARY: ${{ steps.builds.outputs.summary }}
          PRECOMMIT_STATUS: ${{ steps.builds.outputs.precommit_status }}
          PRECOMMIT_URL: ${{ steps.builds.outputs.precommit_url }}
          PRECOMMIT_RESULTS_PATH: artifacts/pre-commit-results/pre-commit-results.json
          COVERAGE_SUMMARY: artifacts/coverage-report/coverage-summary.json
          BASELINE_COVERAGE_SUMMARY: baseline-coverage-summary.json
          PR_SIZES_JSON: pr-sizes.json
          BASELINE_SIZES_JSON: baseline-sizes.json
          BASELINE_SHA: ${{ needs.load-config.outputs.base_sha }}
          TRIGGERED_BY: ${{ github.event.workflow_run.name }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 "${GITHUB_WORKSPACE}/tools/ci/reporting/generate_build_results_comment.py" \
            --base-dir "${GITHUB_WORKSPACE}" \
            --output comment.md
          cat comment.md

      - name: Recheck PR head before publishing
        id: current
        if: steps.builds.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/reporting/report_context.py

      - name: Post combined comment
        if: steps.current.outputs.current == 'true'
        uses: thollander/actions-comment-pull-request@v3
        with:
          pr-number: ${{ needs.load-config.outputs.pr }}
          comment-tag: build-results
          mode: upsert
          file-path: comment.md

  save-baselines:
    name: Save Baselines
    needs: load-config
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: save-baselines
      cancel-in-progress: false
    timeout-minutes: 10

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - *checkout-build-results

      - name: Check if all platform workflows succeeded
        id: gate
        env:
          PLATFORM_WORKFLOWS: ${{ needs.load-config.outputs.platform_workflows }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUNS_CACHE: ${{ runner.temp }}/workflow-runs-cache.json
        run: |
          python3 "${GITHUB_WORKSPACE}/tools/ci/reporting/collect_build_status.py" \
            --repo "$REPO" \
            --head-sha "$HEAD_SHA" \
            --platform-workflows "${PLATFORM_WORKFLOWS}" \
            --event push \
            --require-success \
            --runs-cache "$RUNS_CACHE"

      # Every script in this job uses only the standard library, so it installs no Python
      # dependencies. An empty size list writes no baseline-sizes.json, so the next step fails.
      - name: Download artifacts from all platform workflows
        if: steps.gate.outputs.ready == 'true'
        continue-on-error: true
        uses: ./.github/actions/download-all-artifacts
        with:
          head-sha: ${{ github.event.workflow_run.head_sha }}
          workflows: ${{ needs.load-config.outputs.platform_workflows }}
          event: push
          runs-file: ${{ runner.temp }}/workflow-runs-cache.json
          artifact-prefixes: coverage-report,test-results-
          sizes-file: baseline-sizes.json
          require-sizes: 'true'

      - name: Prepare immutable baseline
        if: steps.gate.outputs.ready == 'true'
        run: |
          test -f baseline-sizes.json
          test -f artifacts/coverage-report/coverage-summary.json
          cp artifacts/coverage-report/coverage-summary.json baseline-coverage-summary.json

      - name: Recheck default branch before publishing
        id: current
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/reporting/report_context.py

      - name: Publish immutable baseline
        if: steps.current.outputs.current == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            baseline-sizes.json
            baseline-coverage-summary.json
          key: build-baseline-v2-${{ github.event.workflow_run.head_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
