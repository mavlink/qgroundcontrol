name: Docker

on:
  push:
    branches:
      - master
      - 'Stable*'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    paths-ignore:
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:
    inputs:
      debug_runner:
        description: 'Open an actor-only SSH session after a failure (up to 15 minutes, branches only)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read
  actions: read

jobs:
  # Change detection and the release-tag gate run in-process (detect_changes.py).
  plan-builds:
    name: Plan Docker Builds
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_jobs: ${{ steps.plan.outputs.has_jobs }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      # PR diffs fetch their base and head commits on demand. Tags need full
      # history and branch refs for the Stable* release-tag check.
      - name: Checkout planner
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.ref_type != 'tag' && 1 || 0 }}
          sparse-checkout: |
            deploy/docker/variants.json
            deploy/docker/_variants.py
            tools/_bootstrap.py
            tools/ci/__init__.py
            tools/ci/planning/__init__.py
            tools/ci/planning/detect_changes.py
            tools/ci/planning/plan_docker_builds.py
            tools/common
            tools/qgc_tools
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Plan matrix
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 "${GITHUB_WORKSPACE}/tools/ci/planning/plan_docker_builds.py"

  build:
    name: Docker ${{ matrix.platform }}
    runs-on: >-
      ${{
        github.repository_owner == 'mavlink' &&
        format('runs-on={0}-build-{1}-{2}/runner={3}{4}',
          github.run_id, github.run_attempt, strategy.job-index,
          vars.RUNS_ON_LINUX_BUILDER || 'linux-x64-builder',
          github.event_name == 'pull_request' && (vars.RUNS_ON_SPOT_POOLS == 'true' && '-spot' ||
            '/spot=cop/family=c8i.xlarge+m8i.xlarge+c7i.xlarge+m7i.xlarge') || '') ||
        'ubuntu-latest'
      }}
    needs: plan-builds
    if: needs.plan-builds.outputs.has_jobs == 'true'
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan-builds.outputs.matrix) }}

    defaults:
      run:
        shell: bash

    steps:
      # The Harden-Runner community tier audits GitHub-hosted runners only, not RunsOn.
      - name: Harden Runner
        if: runner.environment == 'github-hosted'
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Record build timeline
        uses: Kesin11/actions-timeline@v3
        continue-on-error: true
        with:
          show-waiting-runner: true

      - name: Enable RunsOn magic cache
        uses: runs-on/action@v2
        with:
          show_costs: summary

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Native package versions come from git describe and require reachable tags.
          fetch-depth: 0
          persist-credentials: false

      - name: Free Disk Space
        uses: $/.github/actions/free-disk-space

      - name: Resolve push target
        id: push-target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: >-
          python3 "${GITHUB_WORKSPACE}/tools/ci/compile/docker_helper.py" resolve-push-target
          --event-name "${EVENT_NAME}"
          --repo "${REPO}"
          --ref "${REF}"

      - name: Build with Docker
        id: docker-build
        uses: $/.github/actions/docker
        with:
          target: ${{ matrix.target }}
          variant: ${{ matrix.variant }}
          build-args: ${{ matrix.build_args }}
          fuse: ${{ matrix.fuse }}
          # PR builds run PR-controlled Dockerfiles and dependencies; keep the Docker Hub token off them.
          docker-username: ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_USERNAME || '' }}
          docker-token: ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_TOKEN || '' }}
          push-image: ${{ steps.push-target.outputs.ref }}

      - name: Find build artifact
        id: artifact
        run: >-
          python3 "${GITHUB_WORKSPACE}/tools/ci/packaging/find_artifact.py"
          --build-dir "${{ github.workspace }}/build"
          --pattern "${MATRIX_ARTIFACT_PATTERN}"
        env:
          MATRIX_ARTIFACT_PATTERN: ${{ matrix.artifact_pattern }}

      # Per-distro artifact: `variant` keys the name so the parallel matrix entries
      # (linux, linux-debian, linux-fedora, linux-arch, ...) don't collide.
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: qgroundcontrol-${{ matrix.variant }}
          path: |
            ${{ steps.artifact.outputs.path }}
            ${{ github.workspace }}/build/appimagelint-report.json
          if-no-files-found: error
          retention-days: 14

      # Native distro package (.deb/.rpm/.pkg.tar.zst) alongside the AppImage on
      # x86_64 Linux variants; empty package_pattern (aarch64, Android) skips both.
      - name: Find native package
        id: package
        if: matrix.package_pattern != ''
        run: >-
          python3 "${GITHUB_WORKSPACE}/tools/ci/packaging/find_artifact.py"
          --build-dir "${{ github.workspace }}/build"
          --top-level
          --pattern "${MATRIX_PACKAGE_PATTERN}"
        env:
          MATRIX_PACKAGE_PATTERN: ${{ matrix.package_pattern }}

      - name: Validate native package lifecycle
        if: matrix.package_pattern != ''
        shell: bash
        env:
          IMAGE: dronecode/qgroundcontrol:${{ matrix.variant }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
        run: |
          package_dir=$(dirname "${PACKAGE_PATH}")
          package_name=$(basename "${PACKAGE_PATH}")
          docker run --rm --entrypoint /opt/qgc-venv/bin/python \
            -v "${GITHUB_WORKSPACE}:/project/source:ro" \
            -v "${package_dir}:/packages:ro" \
            "${IMAGE}" \
            /project/source/tools/ci/packaging/validate_native_package.py --install "/packages/${package_name}"

      - name: Verify native package checksum
        id: package-checksum
        if: matrix.package_pattern != ''
        shell: bash
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
        run: |
          args=(--source-path "${PACKAGE_PATH}")
          # CPack must emit DEB/RPM checksums; Arch's makepkg has no equivalent, so its sidecar is written here.
          [[ "${PACKAGE_PATH}" == *.pkg.tar.zst ]] || args+=(--require-existing)
          python3 "${GITHUB_WORKSPACE}/tools/ci/publish/attest_helper.py" checksum "${args[@]}"

      - name: Upload native package
        if: matrix.package_pattern != ''
        uses: actions/upload-artifact@v7
        with:
          name: qgroundcontrol-${{ matrix.variant }}-package
          path: |
            ${{ steps.package.outputs.path }}
            ${{ steps.package-checksum.outputs.checksum }}
          if-no-files-found: error
          retention-days: 14

      # SBOM generation and vulnerability scans run on pushes and manual runs; PRs skip them.
      - name: Generate CPM dependency SBOM
        if: github.event_name != 'pull_request'
        env:
          IMAGE: dronecode/qgroundcontrol:${{ matrix.variant }}
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp
          --entrypoint /opt/qgc-venv/bin/python
          -v "${GITHUB_WORKSPACE}:/project/source:ro"
          -v "${GITHUB_WORKSPACE}/build:/project/build:ro"
          "${IMAGE}" /project/source/tools/ci/security/generate_cpm_sbom.py
          --build-dir /project/build --require-components > cpm-sbom.cdx.json

      - name: Generate CPM dependency snapshot
        if: github.event_name != 'pull_request' && matrix.variant == 'linux'
        env:
          IMAGE: dronecode/qgroundcontrol:${{ matrix.variant }}
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp
          --entrypoint /opt/qgc-venv/bin/python
          -v "${GITHUB_WORKSPACE}:/project/source:ro"
          -v "${GITHUB_WORKSPACE}/build:/project/build:ro"
          "${IMAGE}" /project/source/tools/ci/security/generate_cpm_sbom.py
          --build-dir /project/build --format spdx --require-components > cpm-sbom.spdx.json

      - name: Upload CPM dependency snapshot
        if: github.event_name != 'pull_request' && matrix.variant == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: cpm-dependency-snapshot
          path: cpm-sbom.spdx.json
          if-no-files-found: error
          retention-days: 7

      - name: Install Grype
        if: github.event_name != 'pull_request'
        id: install-grype
        timeout-minutes: 5
        run: python3 tools/ci/security/install_grype.py

      - name: Scan SBOM with Grype
        if: github.event_name != 'pull_request'
        id: grype
        uses: anchore/scan-action@v7
        with:
          grype-version: ${{ steps.install-grype.outputs.version }}
          sbom: cpm-sbom.cdx.json
          fail-build: false
          severity-cutoff: high
          only-fixed: true
          output-format: sarif

      - name: Upload Grype results to GitHub Security
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: 'grype-${{ matrix.platform }}'

      - name: Generate builder image SBOM
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0
        with:
          image: dronecode/qgroundcontrol:${{ matrix.variant }}
          format: cyclonedx-json
          output-file: image-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Scan builder image
        if: github.event_name != 'pull_request'
        id: grype-image
        uses: anchore/scan-action@v7
        with:
          grype-version: ${{ steps.install-grype.outputs.version }}
          sbom: image-sbom.cdx.json
          fail-build: false
          severity-cutoff: high
          only-fixed: true
          output-format: sarif

      - name: Upload image scan to GitHub Security
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.grype-image.outputs.sarif }}
          category: grype-image-${{ matrix.variant }}

      - name: Save published image digest
        if: steps.push-target.outputs.ref != ''
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.docker-build.outputs.image-digest }}
        run: |
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "${IMAGE_DIGEST}" > image-digest.txt

      - name: Upload image security evidence
        if: steps.push-target.outputs.ref != ''
        uses: actions/upload-artifact@v7
        with:
          name: qgc-builder-security-${{ matrix.variant }}
          path: |
            image-digest.txt
            image-sbom.cdx.json
          if-no-files-found: error
          retention-days: 7

      - name: Debug failed runner
        if: ${{ failure() && !cancelled() && inputs.debug_runner && github.ref_type == 'branch' }}
        timeout-minutes: 15
        uses: $/.github/actions/debug-runner

  attest-images:
    name: Attest ${{ matrix.platform }} Image
    needs: [plan-builds, build]
    if: github.repository == 'mavlink/qgroundcontrol' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan-builds.outputs.matrix) }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Download image security evidence
        uses: actions/download-artifact@v8
        with:
          name: qgc-builder-security-${{ matrix.variant }}

      - name: Read image digest
        id: image
        shell: bash
        run: |
          digest=$(< image-digest.txt)
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "${digest}" >> "${GITHUB_OUTPUT}"

      - name: Login to GHCR
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Login to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Attest image provenance
        uses: actions/attest@v4
        env:
          NODE_OPTIONS: --max-http-header-size=32768
        with:
          subject-name: ${{ startsWith(github.ref, 'refs/tags/v') && 'dronecode/qgroundcontrol' || 'ghcr.io/mavlink/qgroundcontrol' }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Attest image SBOM
        uses: actions/attest@v4
        with:
          subject-name: ${{ startsWith(github.ref, 'refs/tags/v') && 'dronecode/qgroundcontrol' || 'ghcr.io/mavlink/qgroundcontrol' }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: image-sbom.cdx.json
          push-to-registry: true

  submit-cpm-dependencies:
    name: Submit CPM Dependencies
    needs: [plan-builds, build]
    if: >-
      github.repository == 'mavlink/qgroundcontrol' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      contains(needs.plan-builds.outputs.matrix, '"variant":"linux"')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Download CPM dependency snapshot
        uses: actions/download-artifact@v8
        with:
          name: cpm-dependency-snapshot

      - name: Submit CPM dependency snapshot
        uses: advanced-security/spdx-dependency-submission-action@v0.4.0
        with:
          filePath: .
          filePattern: cpm-sbom.spdx.json
          correlator: qgroundcontrol-cpm
