name: Docker

on:
  push:
    branches:
      - master
      - 'Stable*'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    paths-ignore:
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:
    inputs:
      debug_runner:
        description: 'Open an actor-only SSH session after a failure (up to 15 minutes, branches only)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read
  actions: read

jobs:
  changes:
    uses: ./.github/workflows/_detect-changes.yml
    with:
      platform: docker

  build:
    name: Docker ${{ matrix.platform }}
    runs-on: >-
      ${{
        github.repository_owner == 'mavlink' &&
        format('runs-on={0}-build-{1}-{2}/runner={3}',
          github.run_id, github.run_attempt, strategy.job-index,
          vars.RUNS_ON_LINUX_BUILDER || 'linux-x64-builder') ||
        'ubuntu-latest'
      }}
    needs: changes
    if: needs.changes.outputs.should_build == 'true'
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}

    defaults:
      run:
        shell: bash

    steps:
      # The Harden-Runner community tier audits GitHub-hosted runners only, not RunsOn.
      - name: Harden Runner
        if: runner.environment == 'github-hosted'
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Record build timeline
        uses: Kesin11/actions-timeline@v3
        continue-on-error: true
        with:
          show-waiting-runner: true

      - name: Enable RunsOn magic cache
        uses: runs-on/action@v2
        with:
          show_costs: summary

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Native package versions come from git describe and require reachable tags.
          fetch-depth: 0
          persist-credentials: false

      - name: Free Disk Space
        uses: ./.github/actions/free-disk-space

      - name: Build with Docker
        id: docker-build
        uses: ./.github/actions/docker
        with:
          target: ${{ matrix.target }}
          variant: ${{ matrix.variant }}
          build-args: ${{ matrix.build_args }}
          fuse: ${{ matrix.fuse }}
          # PR builds run PR-controlled Dockerfiles and dependencies; keep the Docker Hub token off them.
          docker-username: ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_USERNAME || '' }}
          docker-token: ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_TOKEN || '' }}
          push-image: ${{ matrix.push_target }}

      - name: Find build artifact
        id: artifact
        run: >-
          python3 "${GITHUB_WORKSPACE}/tools/ci/packaging/find_artifact.py"
          --build-dir "${{ github.workspace }}/build"
          --pattern "${MATRIX_ARTIFACT_PATTERN}"
        env:
          MATRIX_ARTIFACT_PATTERN: ${{ matrix.artifact_pattern }}

      # Per-distro artifact: `variant` keys the name so the parallel matrix entries
      # (linux, linux-debian, linux-fedora, linux-arch, ...) don't collide.
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: qgroundcontrol-${{ matrix.variant }}
          path: |
            ${{ steps.artifact.outputs.path }}
            ${{ github.workspace }}/build/appimagelint-report.json
          if-no-files-found: error
          retention-days: 14

      # Native distro package (.deb/.rpm/.pkg.tar.zst) alongside the AppImage on
      # x86_64 Linux variants; empty package_pattern (aarch64, Android) skips both.
      - name: Find native package
        id: package
        if: matrix.package_pattern != ''
        run: >-
          python3 "${GITHUB_WORKSPACE}/tools/ci/packaging/find_artifact.py"
          --build-dir "${{ github.workspace }}/build"
          --top-level
          --pattern "${MATRIX_PACKAGE_PATTERN}"
        env:
          MATRIX_PACKAGE_PATTERN: ${{ matrix.package_pattern }}

      # Installing the package needs root in the builder image.
      - name: Validate native package lifecycle
        if: matrix.package_pattern != ''
        env:
          IMAGE: ${{ steps.docker-build.outputs.image }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
        run: >-
          python3 "${GITHUB_WORKSPACE}/tools/ci/compile/docker_helper.py" exec --image "${IMAGE}" --root --
          tools/ci/packaging/validate_native_package.py --install "${PACKAGE_PATH}"

      - name: Verify native package checksum
        id: package-checksum
        if: matrix.package_pattern != ''
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
        run: python3 "${GITHUB_WORKSPACE}/tools/ci/publish/attest_helper.py" checksum --source-path "${PACKAGE_PATH}"

      - name: Upload native package
        if: matrix.package_pattern != ''
        uses: actions/upload-artifact@v7
        with:
          name: qgroundcontrol-${{ matrix.variant }}-package
          path: |
            ${{ steps.package.outputs.path }}
            ${{ steps.package-checksum.outputs.checksum }}
          if-no-files-found: error
          retention-days: 14

      # SBOM generation and vulnerability scans run on pushes and manual runs; PRs skip them.
      - name: Generate CPM dependency SBOM
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.docker-build.outputs.image }}
        run: >-
          python3 "${GITHUB_WORKSPACE}/tools/ci/compile/docker_helper.py" exec --image "${IMAGE}" --mount-build --
          tools/ci/security/generate_cpm_sbom.py --build-dir /project/build --require-components > cpm-sbom.cdx.json

      - name: Generate CPM dependency snapshot
        if: github.event_name != 'pull_request' && matrix.variant == 'linux'
        env:
          IMAGE: ${{ steps.docker-build.outputs.image }}
        run: >-
          python3 "${GITHUB_WORKSPACE}/tools/ci/compile/docker_helper.py" exec --image "${IMAGE}" --mount-build --
          tools/ci/security/generate_cpm_sbom.py --build-dir /project/build --format spdx --require-components > cpm-sbom.spdx.json

      - name: Upload CPM dependency snapshot
        if: github.event_name != 'pull_request' && matrix.variant == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: cpm-dependency-snapshot
          path: cpm-sbom.spdx.json
          if-no-files-found: error
          retention-days: 7

      - name: Install Grype
        if: github.event_name != 'pull_request'
        id: install-grype
        timeout-minutes: 5
        run: python3 tools/ci/security/install_grype.py

      - name: Scan SBOM with Grype
        if: github.event_name != 'pull_request'
        id: grype
        uses: anchore/scan-action@v7
        with:
          grype-version: ${{ steps.install-grype.outputs.version }}
          sbom: cpm-sbom.cdx.json
          fail-build: false
          severity-cutoff: high
          only-fixed: true
          output-format: sarif

      - name: Upload Grype results to GitHub Security
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: 'grype-${{ matrix.platform }}'

      - name: Generate builder image SBOM
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.docker-build.outputs.image }}
          format: cyclonedx-json
          output-file: image-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Scan builder image
        if: github.event_name != 'pull_request'
        id: grype-image
        uses: anchore/scan-action@v7
        with:
          grype-version: ${{ steps.install-grype.outputs.version }}
          sbom: image-sbom.cdx.json
          fail-build: false
          severity-cutoff: high
          only-fixed: true
          output-format: sarif

      - name: Upload image scan to GitHub Security
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.grype-image.outputs.sarif }}
          category: grype-image-${{ matrix.variant }}

      - name: Save published image digest
        if: matrix.push_target != ''
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.docker-build.outputs.image-digest }}
        run: |
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "${IMAGE_DIGEST}" > image-digest.txt

      - name: Upload image security evidence
        if: matrix.push_target != ''
        uses: actions/upload-artifact@v7
        with:
          name: qgc-builder-security-${{ matrix.variant }}
          path: |
            image-digest.txt
            image-sbom.cdx.json
          if-no-files-found: error
          retention-days: 7

      - name: Debug failed runner
        if: ${{ failure() && !cancelled() && inputs.debug_runner && github.ref_type == 'branch' }}
        timeout-minutes: 15
        uses: ./.github/actions/debug-runner

  attest-images:
    name: Attest ${{ matrix.platform }} Image
    needs: [changes, build]
    # Every leg carries the planner's push target; '' means the builder images were not pushed.
    if: ${{ !contains(needs.changes.outputs.matrix, '"push_target":""') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Download image security evidence
        uses: actions/download-artifact@v8
        with:
          name: qgc-builder-security-${{ matrix.variant }}

      - name: Read image digest
        id: image
        shell: bash
        run: |
          digest=$(< image-digest.txt)
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "${digest}" >> "${GITHUB_OUTPUT}"

      - name: Login to GHCR
        if: startsWith(matrix.push_target, 'ghcr.io/')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Login to Docker Hub
        if: ${{ !startsWith(matrix.push_target, 'ghcr.io/') }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Attest image provenance
        uses: actions/attest@v4
        env:
          NODE_OPTIONS: --max-http-header-size=32768
        with:
          subject-name: ${{ matrix.push_target }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Attest image SBOM
        uses: actions/attest@v4
        with:
          subject-name: ${{ matrix.push_target }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: image-sbom.cdx.json
          push-to-registry: true

  submit-cpm-dependencies:
    name: Submit CPM Dependencies
    needs: [changes, build]
    if: >-
      github.repository == 'mavlink/qgroundcontrol' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      contains(needs.changes.outputs.matrix, '"variant":"linux"')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Download CPM dependency snapshot
        uses: actions/download-artifact@v8
        with:
          name: cpm-dependency-snapshot

      - name: Submit CPM dependency snapshot
        uses: advanced-security/spdx-dependency-submission-action@v0.4.0
        with:
          filePath: .
          filePattern: cpm-sbom.spdx.json
          correlator: qgroundcontrol-cpm
