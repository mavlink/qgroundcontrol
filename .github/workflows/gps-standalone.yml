name: GPS Standalone

# QGCGPSCore and QGCNTRIPHttp must build without the application (test/GPS/Standalone). One Clang build
# with ASan and UBSan checks that, runs the project's CTest, and fuzzes each libFuzzer harness: for a
# minute when an input of the build changes, and for fifteen every night from the corpus of the night before.
# ClusterFuzzLite cannot build the harnesses: they link Qt, which its base image does not have.
on:
  pull_request:
    # Everything test/GPS/Standalone builds or reads;
    # tools/tests/ci/contracts/test_gps_standalone_workflow.py keeps the source directories complete.
    paths: &standalone-inputs
      - 'src/GPS/**'
      - 'src/Utilities/Geo/GeographicLib.cmake'
      - 'src/Utilities/Geo/geographiclib.patch'
      - 'src/Utilities/Logging/Category/**'
      - 'src/Utilities/Math/**'
      - 'src/Utilities/Network/Client/**'
      - 'src/Utilities/Parsing/Wire/**'
      - 'src/Utilities/Timing/**'
      - 'test/GPS/**'
      - 'cmake/modules/CPM.cmake'
      - 'cmake/modules/CPMPatchCache.cmake'
      - '.github/build-config.json'
      - '.github/workflows/gps-standalone.yml'
  push:
    branches:
      - master
      - 'Stable*'
    paths: *standalone-inputs
  # The default branch, every night. A manual run with `nightly` fuzzes the same way.
  schedule:
    - cron: '47 2 * * *'
  workflow_dispatch:
    inputs:
      nightly:
        description: Fuzz as the nightly run does, for longer and from its saved corpus
        type: boolean
        default: false

concurrency:
  # Only a pull request's runs share a group. In the group of master's pushes, they would wait for a nightly run and
  # cancel it while it waits.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  standalone:
    name: Build, Test, and Fuzz (Clang ASan+UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (github.event_name == 'schedule' || inputs.nightly == true) && 120 || 30 }}
    permissions:
      contents: read
      # The nightly run reads the corpus artifact of the one before it.
      actions: read
    env:
      # As in the application's sanitizer tests (cmake/QGCTest.cmake): a UBSan report otherwise only prints.
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      NIGHTLY: ${{ github.event_name == 'schedule' || inputs.nightly == true }}
      # Seconds each harness fuzzes.
      FUZZ_SECONDS: ${{ (github.event_name == 'schedule' || inputs.nightly == true) && 900 || 60 }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      # The build group's CMake and Ninja, as in a local `just build`; Clang is the runner image's.
      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          groups: build

      # Qt Core, Network and SerialPort are all the standalone project links; the source table fuzzer adds Positioning.
      - name: Install Qt
        uses: ./.github/actions/qt-install
        with:
          host: linux
          arch: linux_gcc_64
          modules: qtserialport qtpositioning
          archives: qtbase icu

      # Optimized: unoptimized, GPSProtocolFuzzSmoke's 10000 runs take about six times as long.
      - name: Configure
        run: >-
          cmake -S test/GPS/Standalone -B "${RUNNER_TEMP}/build" -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}"
          -DCMAKE_CXX_COMPILER=clang++ -DQGC_GPS_LIBFUZZER=ON

      - name: Build
        id: build
        uses: ./.github/actions/cmake-build

      - name: Run tests
        uses: ./.github/actions/run-unit-tests
        with:
          include-labels: GPS
          report-name: GPS Standalone Tests
          artifact-name: test-results-gps-standalone
          retention-days: 7

      # Each harness writes the inputs that reach new code into its directory of gps-fuzz-corpus, which it reads
      # before its seeds. The nightly run starts with what the last one saved there; a failure only warns.
      - name: Restore the fuzzing corpus
        if: ${{ !cancelled() && steps.build.outcome == 'success' && env.NIGHTLY == 'true' }}
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 "${GITHUB_WORKSPACE}/tools/ci/cache/fuzz_corpus_artifact.py"
          --destination "${RUNNER_TEMP}/gps-fuzz-corpus"

      # -timeout turns a hang into a saved input instead of a cancelled step.
      - name: Fuzz the receiver protocols
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: ${{ env.NIGHTLY == 'true' && 20 || 5 }}
        working-directory: ${{ runner.temp }}/build
        run: >-
          ProtocolFuzz/QGCGPSProtocolFuzz -max_total_time="${FUZZ_SECONDS}" -timeout=25 -max_len=8192
          -create_missing_dirs=1 -artifact_prefix="${RUNNER_TEMP}/gps-fuzz-artifacts/protocol-"
          "${RUNNER_TEMP}/gps-fuzz-corpus/protocol" ProtocolFuzz/corpus ProtocolFuzz/fixture-seeds

      # The smoke test writes the seeds: replies recorded from the receiver models, and every recording as output
      # a receiver sends unasked.
      - name: Fuzz the receiver replies
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: ${{ env.NIGHTLY == 'true' && 20 || 5 }}
        working-directory: ${{ runner.temp }}/build
        run: |
          ProtocolFuzz/QGCGPSReplyFuzzSmoke --write-corpus ProtocolFuzz/reply-corpus
          ProtocolFuzz/QGCGPSReplyFuzz -max_total_time="${FUZZ_SECONDS}" -timeout=25 -max_len=8192 \
            -create_missing_dirs=1 -artifact_prefix="${RUNNER_TEMP}/gps-fuzz-artifacts/reply-" \
            "${RUNNER_TEMP}/gps-fuzz-corpus/reply" ProtocolFuzz/reply-corpus

      - name: Fuzz the NTRIP HTTP decoder
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: ${{ env.NIGHTLY == 'true' && 20 || 5 }}
        working-directory: ${{ runner.temp }}/build
        run: |
          NTRIPHttpFuzz/ntrip_http_decoder_smoke --write-corpus NTRIPHttpFuzz/corpus
          NTRIPHttpFuzz/ntrip_http_decoder_fuzzer -max_total_time="${FUZZ_SECONDS}" -timeout=25 -max_len=65536 \
            -dict="${GITHUB_WORKSPACE}/test/GPS/NTRIP/HTTP/Fuzz/NTRIPHttpDecoderFuzzer.dict" \
            -create_missing_dirs=1 -artifact_prefix="${RUNNER_TEMP}/gps-fuzz-artifacts/ntrip-" \
            "${RUNNER_TEMP}/gps-fuzz-corpus/ntrip-http" NTRIPHttpFuzz/corpus

      # The harness frames its input, so the seeds are message payloads.
      - name: Fuzz the RTCM station position decoder
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: ${{ env.NIGHTLY == 'true' && 20 || 5 }}
        working-directory: ${{ runner.temp }}/build
        run: >-
          ProtocolFuzz/QGCRTCMStationPositionFuzz -max_total_time="${FUZZ_SECONDS}" -timeout=25 -max_len=1024
          -create_missing_dirs=1 -artifact_prefix="${RUNNER_TEMP}/gps-fuzz-artifacts/station-"
          "${RUNNER_TEMP}/gps-fuzz-corpus/station-position"
          "${GITHUB_WORKSPACE}/test/GPS/Core/Protocols/corpus/station-position"

      - name: Fuzz the NTRIP source table
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: ${{ env.NIGHTLY == 'true' && 20 || 5 }}
        working-directory: ${{ runner.temp }}/build
        run: >-
          ProtocolFuzz/QGCNTRIPSourceTableFuzz -max_total_time="${FUZZ_SECONDS}" -timeout=25 -max_len=4096
          -dict="${GITHUB_WORKSPACE}/test/GPS/Core/Protocols/Fuzz/SourceTableFuzz.dict"
          -create_missing_dirs=1 -artifact_prefix="${RUNNER_TEMP}/gps-fuzz-artifacts/source-table-"
          "${RUNNER_TEMP}/gps-fuzz-corpus/source-table"
          "${GITHUB_WORKSPACE}/test/GPS/Core/Protocols/corpus/source-table"

      # For the next nightly run, also from a fuzzer that failed: that run then starts close to the failure. A new
      # version in the name, here and in fuzz_corpus_artifact.py, starts over from the seeds.
      - name: Save the fuzzing corpus
        if: ${{ !cancelled() && env.NIGHTLY == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: gps-fuzz-corpus-v1
          path: ${{ runner.temp }}/gps-fuzz-corpus
          if-no-files-found: ignore
          retention-days: 30

      # Only a failed fuzzer writes an input (crash-, leak-, oom- or timeout-), so passing runs upload nothing.
      # Nobody may look at a nightly failure for a while, so its input stays longer.
      - name: Upload fuzzing diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gps-fuzzing-diagnostics
          path: ${{ runner.temp }}/gps-fuzz-artifacts
          if-no-files-found: ignore
          retention-days: ${{ env.NIGHTLY == 'true' && '30' || '7' }}
