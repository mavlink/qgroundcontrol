name: Extended Tests

on:
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/actions/**'
      - '.github/scripts/**'
      - '.github/build-config.json'
      - '.github/workflows/extended-tests.yml'
      - 'tools/setup/**'
  schedule:
    - cron: '41 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  portable:
    name: Portable tests (${{ matrix.preset }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            host: windows
            arch: win64_msvc2022_64
            preset: Windows-debug
          - runner: macos-15
            host: mac
            arch: clang_64
            preset: macOS-debug
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-setup
        with:
          qt-host: ${{ matrix.host }}
          qt-arch: ${{ matrix.arch }}
          aqt-source: ${{ matrix.host == 'windows' && 'git+https://github.com/miurahr/aqtinstall.git@8d961e61720b3c06583517fbc68d57ec0a4e9f95' || '' }}
          build-type: Debug
          cache-variant: portable-tests
      - uses: ./.github/actions/install-dependencies
      - uses: ./.github/actions/cmake-configure
        with:
          preset: ${{ matrix.preset }}
          build-dir: ${{ runner.temp }}/build
          build-type: Debug
          extra-args: -DQGC_MACOS_SIGN_WITH_IDENTITY=OFF -DQGC_MACOS_UNIVERSAL_BUILD=OFF
      - uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Debug
      - name: Run portable unit tests
        id: tests
        uses: ./.github/actions/run-unit-tests
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Debug
          tests-regex: '^(DataRateTrackerTest|QGCCommandLineParserTest|QGCMathTest|SecureMemoryTest|JsonHelperTest|GeoTest)$'
      - uses: ./.github/actions/test-report
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        with:
          name: Portable tests (${{ matrix.preset }})
          build-dir: ${{ runner.temp }}/build
          artifact-name: test-results-portable-${{ matrix.preset }}
          upload-codecov: 'false'

  excluded:
    name: Network and flaky tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-setup
        with:
          qt-host: linux
          qt-arch: linux_gcc_64
          build-type: Debug
      - uses: ./.github/actions/install-dependencies
      - uses: ./.github/actions/cmake-configure
        with:
          preset: Linux-debug
          build-dir: ${{ runner.temp }}/build
          build-type: Debug
      - uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Debug
      - name: Run normally excluded tests
        id: tests
        uses: ./.github/actions/run-unit-tests
        with:
          build-dir: ${{ runner.temp }}/build
          include-labels: 'Network|Flaky'
          exclude-labels: ''
          parallel: '1'
      - uses: ./.github/actions/test-report
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        with:
          name: Network and flaky tests
          build-dir: ${{ runner.temp }}/build
          artifact-name: test-results-excluded
          upload-codecov: 'false'
