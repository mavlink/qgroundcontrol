name: Doxygen API Docs

on:
  schedule:
    - cron: '0 4 * * 0'  # Sunday 04:00 UTC
  pull_request:
    paths:
      - 'Doxyfile'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

# Deploying runs share one queue; each PR gets its own group so PRs never displace each other.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('doxygen-{0}', github.ref) || 'doxygen-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Doxygen and Graphviz
        run: |
          python3 tools/ci/runner/apt_install_retry.py \
            --update \
            --no-install-recommends \
            --install-timeout 300 \
            --label "Doxygen dependencies" \
            doxygen graphviz

      - name: Build Doxygen docs
        run: doxygen Doxyfile

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: doxygen_build
          path: docs/api/html/
          retention-days: 1

  deploy:
    if: github.repository_owner == 'mavlink' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions/deploy-docs
            tools/ci/publish/deploy_docs.py
            tools/_bootstrap.py
            tools/common
            tools/qgc_tools
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Deploy docs
        uses: ./.github/actions/deploy-docs
        with:
          artifact-name: doxygen_build
          target-repo: mavlink/api.qgroundcontrol.com
          target-branch: main
          deploy-token: ${{ secrets.PX4BUILDBOT_ACCESSTOKEN }}
          commit-message: 'QGC Doxygen API docs update'
