name: Doxygen API Docs

on:
  schedule:
    - cron: '0 4 * * 0'  # Sunday 04:00 UTC
  # Without WARN_AS_ERROR in the Doxyfile, source changes do not fail the build: pull requests
  # rebuild only when the configuration or this workflow changes; the weekly run covers sources.
  pull_request:
    paths:
      - 'tools/configs/Doxyfile'
      - '.github/workflows/doxygen.yml'
  workflow_dispatch:

permissions:
  contents: read

# Deploying runs share one queue; each PR gets its own group so PRs never displace each other.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('doxygen-{0}', github.ref) || 'doxygen-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Doxygen and Graphviz
        run: |
          python3 tools/ci/runner/apt_install_retry.py \
            --update \
            --no-install-recommends \
            --install-timeout 300 \
            --label "Doxygen dependencies" \
            doxygen graphviz

      - name: Build Doxygen docs
        run: doxygen tools/configs/Doxyfile

      # The Pages workflow publishes the latest master run's docs under /api/; outliving the weekly
      # schedule by a day keeps one available until the next run uploads its own.
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: doxygen_build
          path: docs/api/html/
          retention-days: ${{ github.event_name == 'pull_request' && '1' || '8' }}

  deploy:
    if: github.repository_owner == 'mavlink' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions/deploy-docs
            tools/ci/publish/deploy_docs.py
            tools/_bootstrap.py
            tools/common
            tools/qgc_tools
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Deploy docs
        uses: ./.github/actions/deploy-docs
        with:
          artifact-name: doxygen_build
          target-repo: mavlink/api.qgroundcontrol.com
          target-branch: main
          deploy-token: ${{ secrets.PX4BUILDBOT_ACCESSTOKEN }}
          commit-message: 'QGC Doxygen API docs update'
