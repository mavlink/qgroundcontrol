name: Build GStreamer

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        required: true
        default: 'linux'
        type: choice
        options:
          - linux
          - macos
          - windows
          - android
          - ios
      version:
        description: 'GStreamer version (empty for the platform''s build-config.json version)'
        required: false
        default: ''
        type: string
      arch:
        description: 'Architecture'
        required: true
        default: 'x86_64'
        type: choice
        options:
          - x86_64
          - arm64
          - aarch64
          - universal
          - armv7
          - x86
          - x64
      build_type:
        description: 'Build type'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug
      simulator:
        description: 'iOS Simulator build'
        required: false
        default: false
        type: boolean
      upload_s3:
        description: 'Upload to S3'
        required: false
        default: true
        type: boolean

concurrency:
  group: gstreamer-${{ inputs.platform }}-${{ inputs.arch }}-${{ inputs.simulator }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: ${{ inputs.platform }} ${{ inputs.arch }}${{ inputs.simulator && ' (Simulator)' || '' }}
    runs-on: >-
      ${{
        inputs.platform == 'linux' && (inputs.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04') ||
        inputs.platform == 'macos' && 'macos-15' ||
        inputs.platform == 'windows' && (inputs.arch == 'arm64' && 'windows-11-arm' || 'windows-2022') ||
        inputs.platform == 'android' && 'ubuntu-24.04' ||
        inputs.platform == 'ios' && 'macos-15' ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 120

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github
            tools
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Fails an architecture this runner cannot build before the long build starts.
      - name: Plan build
        id: plan
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
          ARCH: ${{ inputs.arch }}
          SIMULATOR: ${{ inputs.simulator }}
        run: |
          python3 ./tools/setup/gstreamer/ci_plan.py --platform "$PLATFORM" --arch "$ARCH" \
            --simulator "$SIMULATOR"

      # Linux and Android build on Ubuntu runners.
      - name: Install dependencies (apt)
        if: steps.plan.outputs.apt-category != ''
        uses: ./.github/actions/install-dependencies
        with:
          category: ${{ steps.plan.outputs.apt-category }}

      # Android skips build-setup, which installs CI's pinned CMake and Ninja for every other build.
      - name: Install pinned CMake and Ninja (Android)
        if: steps.plan.outputs.cmake-version != ''
        uses: lukka/get-cmake@v4.4.2
        with:
          cmakeVersion: ${{ steps.plan.outputs.cmake-version }}
          ninjaVersion: ${{ steps.plan.outputs.ninja-version }}
          useCloudCache: true
          useLocalCache: false

      - name: Install dependencies (macOS)
        if: inputs.platform == 'macos' || inputs.platform == 'ios'
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          command: brew install pkg-config gettext

      # Android/iOS builds do not link host Qt. Desktop builds use build-setup
      # for the Qt SDK, Python environment, and compiler toolchain; this checkout
      # has no QGC sources, so the QGC build caches are skipped.
      - name: Build Setup
        if: steps.plan.outputs.qt-host != ''
        uses: ./.github/actions/build-setup
        with:
          build-cache: 'false'
          qt-host: ${{ steps.plan.outputs.qt-host }}
          qt-arch: ${{ steps.plan.outputs.qt-arch }}

      # build_gstreamer.py writes the resolved arch and install prefix to this step's outputs,
      # which the archive step reads. On Actions it also defaults the Windows work directory to
      # RUNNER_TEMP and, for macOS and Windows, the Qt prefix to build-setup's QT_ROOT_DIR.
      - name: Build GStreamer
        id: build
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
          ARCH: ${{ inputs.arch }}
          VERSION: ${{ inputs.version }}
          BUILD_TYPE: ${{ inputs.build_type }}
          SIMULATOR: ${{ steps.plan.outputs.simulator }}
        run: |
          python3 ./tools/setup/build_gstreamer.py --platform "$PLATFORM" --arch "$ARCH" \
            --version "$VERSION" --type "$BUILD_TYPE" ${SIMULATOR:+--simulator} --clean --verify

      - name: Configure AWS Credentials
        if: inputs.upload_s3
        uses: ./.github/actions/aws-credentials
        with:
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Create archive
        id: archive
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
          ARCH: ${{ steps.build.outputs.arch }}
          PREFIX: ${{ steps.build.outputs.prefix }}
          VERSION: ${{ inputs.version }}
          SIMULATOR: ${{ steps.plan.outputs.simulator }}
          UPLOAD_S3: ${{ inputs.upload_s3 && 'true' || '' }}
          AWS_DEFAULT_REGION: us-west-2
        run: |
          python3 ./tools/ci/gstreamer/gstreamer_archive.py --platform "$PLATFORM" --arch "$ARCH" \
            --version "$VERSION" --prefix "$PREFIX" --output-dir "$RUNNER_TEMP" \
            ${SIMULATOR:+--simulator} ${UPLOAD_S3:+--upload-s3}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.archive.outputs.name }}
          path: ${{ steps.archive.outputs.path }}
          retention-days: 30
          compression-level: 0  # Archive already compressed
