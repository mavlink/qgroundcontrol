name: Download All Platform Artifacts
description: Download artifacts from all completed platform workflow runs for the same commit

inputs:
  head-sha:
    description: Commit SHA to fetch workflow artifacts from
    required: true
  workflows:
    description: Comma-separated workflow names to download artifacts from
    required: false
    default: Linux,Windows,MacOS,Android
  event:
    description: Optional workflow event name to filter runs by
    required: false
    default: ''
  output-dir:
    description: Output directory for downloaded artifacts
    required: false
    default: artifacts
  runs-file:
    description: Path to cached workflow runs JSON (skips API call if provided)
    required: false
    default: ''
  include-failed:
    description: Include diagnostics from completed failed builds
    default: 'false'
  allow-missing:
    description: Allow absent diagnostic artifacts selected by prefix, but not download failures
    default: 'false'
  artifact-prefixes:
    description: Comma-separated artifact name prefixes to download
    required: true
  sizes-file:
    description: Optional JSON path for the distributable artifact sizes of each workflow's latest successful run
    required: false
    default: ''
  require-sizes:
    description: Fail and remove sizes-file when no distributable artifact is found
    default: 'false'

runs:
  using: composite
  steps:
    - name: Download artifacts from all platform workflows
      shell: bash
      # download_artifacts.py reads the optional INPUT_* variables as argument defaults and
      # uses runs-file only when that file exists.
      env:
        GH_TOKEN: ${{ github.token }}
        INPUT_REPO: ${{ github.repository }}
        INPUT_HEAD_SHA: ${{ inputs.head-sha }}
        INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
        INPUT_WORKFLOWS: ${{ inputs.workflows }}
        INPUT_EVENT: ${{ inputs.event }}
        INPUT_ARTIFACT_PREFIXES: ${{ inputs.artifact-prefixes }}
        INPUT_RUNS_FILE: ${{ inputs.runs-file }}
        INPUT_INCLUDE_FAILED: ${{ inputs.include-failed }}
        INPUT_ALLOW_MISSING: ${{ inputs.allow-missing }}
        INPUT_SIZES_FILE: ${{ inputs.sizes-file }}
        INPUT_REQUIRE_SIZES: ${{ inputs.require-sizes }}
      run: |
        python3 "${GITHUB_WORKSPACE}/tools/ci/reporting/download_artifacts.py" \
          --repo "$INPUT_REPO" \
          --head-sha "$INPUT_HEAD_SHA" \
          --output-dir "$INPUT_OUTPUT_DIR" \
          --workflows "$INPUT_WORKFLOWS" \
          --event "$INPUT_EVENT" \
          --artifact-prefixes "$INPUT_ARTIFACT_PREFIXES"
