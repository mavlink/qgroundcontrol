name: Install Qt
description: Install Qt using aqtinstall with caching
outputs:
  qt_root_dir:
    description: Absolute Qt root directory
    value: ${{ steps.qt.outputs.qt_root_dir }}
inputs:
  version:
    description: Qt version to install
    required: true
  host:
    description: Host platform (linux, mac, windows, etc.)
    required: true
  target:
    description: Target platform (desktop, android, ios)
    required: false
    default: desktop
  arch:
    description: Architecture (linux_gcc_64, clang_64, win64_msvc2022_64, etc.)
    required: true
  modules:
    description: Qt modules to install (use build-config.outputs.qt_modules)
    required: false
    default: ''
  archives:
    description: Optional Qt archives subset to install (space-separated)
    required: false
    default: ''
  export-env:
    description: Export QT_ROOT_DIR and prepend the Qt bin directory to PATH
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    # Outputs the cache digest, the workspace-relative arch tree to cache, and a compatible
    # preinstalled SDK root (empty when the runner image has none).
    - name: Plan Qt install
      id: plan
      shell: bash
      env:
        PREINSTALLED_DIR: ${{ env.QGC_PREINSTALLED_QT_DIR || '/opt/qgc-sdk' }}
        QT_VERSION: ${{ inputs.version }}
        QT_ARCH: ${{ inputs.arch }}
        QT_MODULES: ${{ inputs.modules }}
        QT_ARCHIVES: ${{ inputs.archives }}
      run: |
        python3 "${GITHUB_WORKSPACE}/tools/setup/install_qt.py" plan \
          --preinstalled-prefix "${PREINSTALLED_DIR}" \
          --outdir "${GITHUB_WORKSPACE}/.qt/Qt" \
          --version "${QT_VERSION}" \
          --arch "${QT_ARCH}" \
          --modules "${QT_MODULES}" \
          --archives "${QT_ARCHIVES}"

    # Cache-service failures should degrade to a Qt reinstall.
    - name: Restore Qt cache
      id: qt-cache
      if: steps.plan.outputs.preinstalled_root == ''
      uses: actions/cache/restore@v6
      continue-on-error: true
      with:
        path: ${{ steps.plan.outputs.cache_path }}
        # `runner.os` is implied by `inputs.host` (linux/mac/windows...) so it's omitted.
        key: qt-${{ inputs.host }}-${{ inputs.target }}-${{ inputs.arch }}-${{ inputs.version }}-${{ steps.plan.outputs.digest }}

    - name: Install Qt ${{ inputs.version }}
      id: qt
      shell: bash
      env:
        QT_VERSION: ${{ inputs.version }}
        QT_HOST: ${{ inputs.host }}
        QT_TARGET: ${{ inputs.target }}
        QT_ARCH: ${{ inputs.arch }}
        QT_MODULES: ${{ inputs.modules }}
        QT_ARCHIVES: ${{ inputs.archives }}
        PREINSTALLED_ROOT: ${{ steps.plan.outputs.preinstalled_root }}
        CACHE_HIT: ${{ steps.qt-cache.outputs.cache-hit }}
        EXPORT_ENV: ${{ inputs.export-env }}
      run: |
        python3 "${GITHUB_WORKSPACE}/tools/setup/install_qt.py" ensure \
          --preinstalled-root "${PREINSTALLED_ROOT}" \
          --cache-hit "${CACHE_HIT}" \
          --export-env "${EXPORT_ENV}" \
          --outdir "${GITHUB_WORKSPACE}/.qt/Qt" \
          --version "${QT_VERSION}" \
          --host "${QT_HOST}" \
          --target "${QT_TARGET}" \
          --arch "${QT_ARCH}" \
          --modules "${QT_MODULES}" \
          --archives "${QT_ARCHIVES}"

    - name: Re-check Qt cache before save
      id: qt-presave
      if: >-
        steps.plan.outputs.preinstalled_root == '' &&
        steps.qt-cache.outputs.cache-hit != 'true' &&
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      uses: actions/cache/restore@v6
      continue-on-error: true
      with:
        path: ${{ steps.plan.outputs.cache_path }}
        key: ${{ steps.qt-cache.outputs.cache-primary-key }}
        lookup-only: true

    - name: Save Qt cache
      if: >-
        steps.plan.outputs.preinstalled_root == '' &&
        steps.qt-cache.outputs.cache-hit != 'true' &&
        steps.qt-presave.outputs.cache-hit != 'true' &&
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.plan.outputs.cache_path }}
        key: ${{ steps.qt-cache.outputs.cache-primary-key }}
