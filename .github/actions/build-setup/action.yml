name: Build Setup
description: >-
  Common setup for platform builds: build config, runner preparation, CMake, Python, build caches,
  and the Qt SDKs for the selected mode.

inputs:
  mode:
    description: "Setup mode: desktop, android, or ios"
    required: false
    default: desktop
  qt-host:
    description: "Qt host platform (linux/linux_arm64/windows/windows_arm64/mac). Required for desktop and android modes; ignored for ios."
    required: false
    default: ""
  qt-arch:
    description: "Qt target architecture. Required for all modes (android: the host desktop arch; ios: ios_device or ios_simulator_<arch>)."
    required: false
    default: ""
  build-type:
    description: Build type for cache key
    required: false
    default: "Release"
  save-cache:
    description: "Whether to save cache (auto = save including PR merge refs; skip pull_request_target)"
    required: false
    default: "auto"
  cache-variant:
    description: Optional ccache key discriminator for compile-flag-distinct builds (e.g. coverage|asan).
    required: false
    default: ""
  cache-key-suffix:
    description: >-
      Per-matrix-leg build-cache discriminator. Set when multiple legs share
      the same host/target/build-type.
    required: false
    default: ""
  abis:
    description: "Android ABIs (arm64-v8a, armeabi-v7a, x86_64; e.g. 'arm64-v8a;armeabi-v7a'). android mode only."
    required: false
    default: "arm64-v8a;armeabi-v7a"
  python-groups:
    description: Comma-separated tools/uv.lock dependency groups for setup-python (e.g. scripts,coverage)
    required: false
    default: scripts
  build-cache:
    description: >-
      Set up the compiler, moc, CPM, and GStreamer SDK caches; 'false' for jobs that build no
      QGroundControl sources (they need only Qt, Python, and the compiler toolchain).
    required: false
    default: 'true'

outputs:
  host_qt_root_dir:
    description: Qt root providing host tools (macOS Qt for iOS, desktop Qt for Android, x64 Qt for Windows ARM64 cross)
    value: ${{ steps.qt-desktop-host.outputs.qt_root_dir || steps.qt.outputs.qt_root_dir }}
  target_qt_root_dir:
    description: Target Qt root directory (mobile modes)
    value: >-
      ${{ steps.qt-ios.outputs.qt_root_dir || steps.qt-android-arm64.outputs.qt_root_dir ||
          steps.qt-android-armv7.outputs.qt_root_dir || steps.qt-android-x86_64.outputs.qt_root_dir }}
  android_platform:
    description: Android platform/API level
    value: ${{ steps.plan.outputs.android_platform }}

runs:
  using: composite
  steps:
    # Its post step logs the job's start, peak, and end disk use, and adds them to the job summary.
    - name: Watch disk use
      uses: ./.github/actions/disk-watch

    # Validates the inputs, creates $RUNNER_TEMP/build, resolves every mode-dependent value and
    # build-config.json version the steps below read, and exports the Android SDK environment.
    # Runs on the system Python, before setup-python.
    - name: Plan build setup
      id: plan
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_QT_HOST: ${{ inputs.qt-host }}
        INPUT_QT_ARCH: ${{ inputs.qt-arch }}
        INPUT_ABIS: ${{ inputs.abis }}
      run: python3 "${GITHUB_WORKSPACE}/tools/ci/runner/build_setup.py"

    - name: Free disk space (Linux)
      id: free-disk-space
      if: runner.os == 'Linux'
      uses: ./.github/actions/free-disk-space
      with:
        remove-android: ${{ inputs.mode != 'android' }}

    - id: python
      uses: ./.github/actions/setup-python
      with:
        groups: ${{ inputs.python-groups }}

    # The one CMake and Ninja for CI builds. After setup-python, so they precede the CMake and
    # Ninja that the build and dev groups add to tools/.venv (local development keeps those).
    - id: cmake
      uses: lukka/get-cmake@v4.4.4
      with:
        cmakeVersion: ${{ steps.plan.outputs.cmake_version }}
        ninjaVersion: ${{ steps.plan.outputs.ninja_version }}
        # Copilot sessions (event "dynamic") cannot write the cache, and the input covers both
        # restore and save; they download the two binaries instead.
        useCloudCache: ${{ github.event_name != 'dynamic' }}
        useLocalCache: false

    # setup-gradle needs the java executable, which RunsOn's Windows image does not provide.
    - name: Setup Java Environment
      id: java
      if: inputs.mode == 'android'
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: ${{ steps.plan.outputs.java_version }}

    # Gradle User Home (wrapper and dependencies) is cached only on RunsOn's S3 backend: in GitHub's
    # size-limited cache it evicted the compiler caches (#14474). `basic` is the MIT actions/cache
    # provider keyed on the Gradle build files; saves match cache_plan.py's auto policy. The post
    # step re-evaluates these inputs without this action's inputs context, so use only env/github.
    # Its key hashes every **/*.gradle* file under the workspace, following symlinks, so this runs
    # after setup-python (which exports QGC_ACTIONS_CACHE_BACKEND) but before the CPM cache and Qt
    # land there: Windows cannot stat android_openssl's per-ABI `include` directory symlinks
    # (EPERM), and their Gradle files are not QGC's build inputs.
    - name: Setup Gradle (Android)
      id: gradle
      if: inputs.mode == 'android'
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-disabled: ${{ env.QGC_ACTIONS_CACHE_BACKEND != 's3' }}
        cache-provider: basic
        cache-read-only: ${{ github.event_name == 'pull_request_target' }}
        # The restored CPM cache under .cache/ contains SDL3's own (unlisted) Gradle wrapper jar.
        # QGC's wrapper is validated on every PR by gradle/actions/wrapper-validation in dependency-review.yml.
        validate-wrappers: false

    - name: Setup caching
      id: cache
      if: inputs.build-cache == 'true'
      uses: ./.github/actions/cache
      with:
        host: ${{ steps.plan.outputs.qt_host }}
        target: ${{ steps.plan.outputs.cache_target }}
        build-type: ${{ inputs.build-type }}
        variant: ${{ inputs.cache-variant }}
        key-suffix: ${{ inputs.cache-key-suffix }}
        save-cache: ${{ inputs.save-cache }}

    # iOS pins its own Xcode version, which can differ from desktop macOS's.
    - name: Setup Xcode
      id: xcode
      if: runner.os == 'macOS' && inputs.mode != 'android'
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ steps.plan.outputs.xcode_version }}

    # The desktop target Qt, or the desktop Qt whose host tools mobile builds run.
    - name: Install Qt
      id: qt
      uses: ./.github/actions/qt-install
      with:
        host: ${{ steps.plan.outputs.qt_host }}
        arch: ${{ steps.plan.outputs.qt_arch }}
        modules: ${{ steps.plan.outputs.qt_modules }}

    # ARM64 cross-compile needs an x64 host Qt for moc/qmlcachegen/etc. that run on the build machine. export-env=false so QT_ROOT_DIR keeps pointing at the target Qt.
    - name: Install host Qt (Windows ARM64 cross-compile)
      if: steps.plan.outputs.host_qt_arch != ''
      id: qt-desktop-host
      uses: ./.github/actions/qt-install
      with:
        host: windows
        arch: ${{ steps.plan.outputs.host_qt_arch }}
        modules: ${{ steps.plan.outputs.qt_modules }}
        export-env: 'false'

    # Installed after the host Qt so QT_ROOT_DIR and qt-cmake resolve to the iOS SDK.
    - name: Install Qt for iOS
      if: inputs.mode == 'ios'
      id: qt-ios
      uses: ./.github/actions/qt-install
      with:
        host: mac
        target: ios
        arch: ${{ inputs.qt-arch }}
        modules: ${{ steps.plan.outputs.qt_modules_ios }}

    # Android-on-Windows uses NDK clang and skips MSVC setup.
    - name: Setup MSVC environment (Windows desktop)
      id: msvc
      if: inputs.mode == 'desktop' && runner.os == 'Windows'
      uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: ${{ steps.plan.outputs.msvc_arch }}

    # Git for Windows shadows MSVC's link.exe on Windows ARM64. See rust-lang/rust#42825.
    - name: Fix Rust linker resolution (Windows ARM64 native)
      id: rust-linker
      if: inputs.mode == 'desktop' && runner.os == 'Windows' && runner.arch == 'ARM64'
      shell: bash
      run: |
        git_link="/c/Program Files/Git/usr/bin/link.exe"
        if [ -f "$git_link" ]; then
          mv "$git_link" "${git_link}.bak"
          echo "Renamed Git link.exe to prevent Rust linker conflict"
        fi

    # Off macOS the plan step pointed ANDROID_SDK_ROOT at $RUNNER_TEMP/android-sdk.
    - name: Setup Android Environment
      id: android
      if: inputs.mode == 'android'
      uses: android-actions/setup-android@v4
      with:
        cmdline-tools-version: ${{ steps.plan.outputs.cmdline_tools }}
        packages: ''
        log-accepted-android-sdk-licenses: false

    # Installs build-config.json's NDK, platform, and build-tools versions.
    - name: Install Android SDK / NDK / Tools
      id: android-sdk
      if: inputs.mode == 'android'
      shell: bash
      run: python3 "${GITHUB_WORKSPACE}/tools/ci/android/android_sdk_helper.py"

    # The first installed ABI (in this order) supplies target_qt_root_dir.
    - name: Install Qt for Android (arm64_v8a)
      if: steps.plan.outputs.android_arm64 == 'true'
      id: qt-android-arm64
      uses: ./.github/actions/qt-install
      with:
        host: ${{ inputs.qt-host }}
        target: android
        arch: android_arm64_v8a
        modules: ${{ steps.plan.outputs.qt_modules }}
        export-env: 'false'

    - name: Install Qt for Android (armv7)
      if: steps.plan.outputs.android_armv7 == 'true'
      id: qt-android-armv7
      uses: ./.github/actions/qt-install
      with:
        host: ${{ inputs.qt-host }}
        target: android
        arch: android_armv7
        modules: ${{ steps.plan.outputs.qt_modules }}
        export-env: 'false'

    - name: Install Qt for Android (x86_64)
      if: steps.plan.outputs.android_x86_64 == 'true'
      id: qt-android-x86_64
      uses: ./.github/actions/qt-install
      with:
        host: ${{ inputs.qt-host }}
        target: android
        arch: android_x86_64
        modules: ${{ steps.plan.outputs.qt_modules }}
        export-env: 'false'

    # One Setup section in the job summary: the runner and its image, instance, and hardware, the
    # toolchain versions, and what each cache restored. It also runs after a failed step, which it
    # names from the steps' outcomes. RUNS_ON_*, ImageOS/ImageVersion, MSVC's VCToolsVersion, and
    # QGC_CCACHE_KEY come from the job environment.
    - name: Summarize setup
      if: ${{ !cancelled() }}
      shell: bash
      env:
        SETUP_MODE: ${{ inputs.mode }}
        SETUP_STEPS: ${{ toJSON(steps) }}
        QT_VERSION: ${{ steps.qt.outputs.version }}
        QT_ARCH: ${{ steps.plan.outputs.qt_arch }}
        QT_INSTALLER: ${{ steps.qt.outputs.installer }}
        QT_SOURCE: ${{ steps.qt.outputs.source }}
        QT_HOST_SOURCE: ${{ steps.qt-desktop-host.outputs.source }}
        QT_IOS_SOURCE: ${{ steps.qt-ios.outputs.source }}
        QT_ANDROID_ARM64_V8A_SOURCE: ${{ steps.qt-android-arm64.outputs.source }}
        QT_ANDROID_ARMV7_SOURCE: ${{ steps.qt-android-armv7.outputs.source }}
        QT_ANDROID_X86_64_SOURCE: ${{ steps.qt-android-x86_64.outputs.source }}
        CMAKE_VERSION: ${{ steps.plan.outputs.cmake_version }}
        NINJA_VERSION: ${{ steps.plan.outputs.ninja_version }}
        XCODE_VERSION: ${{ steps.plan.outputs.xcode_version }}
        JDK_VERSION: ${{ steps.java.outputs.version }}
        JDK_REQUESTED: ${{ steps.plan.outputs.java_version }}
        PYTHON_GROUPS: ${{ inputs.python-groups }}
        BUILD_CACHE: ${{ inputs.build-cache }}
        COMPILER_CACHE: ${{ steps.cache.outputs.compiler-cache }}
        COMPILER_CACHE_KEY: ${{ steps.cache.outputs.compiler-cache-key }}
        MOC_CACHE: ${{ steps.cache.outputs.moc-cache }}
        MOC_CACHE_KEY: ${{ steps.cache.outputs.moc-cache-key }}
        CPM_CACHE: ${{ steps.cache.outputs.cpm-cache }}
        GSTREAMER_CACHE: ${{ steps.cache.outputs.gstreamer-cache }}
        GSTREAMER_MODE: ${{ steps.cache.outputs.gstreamer-mode }}
      run: python3 "${GITHUB_WORKSPACE}/tools/ci/reporting/setup_summary.py"
