name: Run Unit Tests
description: Run tests via CTest, then report and upload their results even when tests fail.

inputs:
  build-dir:
    description: Path to CMake build directory
    required: true
  build-type:
    description: CTest configuration for multi-config generators
    default: ''
  junit-output:
    description: JUnit XML output filename (relative to build-dir)
    required: false
    default: junit-results.xml
  ctest-output:
    description: Captured CTest stdout/stderr filename (relative to build-dir)
    required: false
    default: test-output.txt
  include-labels:
    description: CTest labels regex to include
    required: false
    default: Unit
  exclude-labels:
    description: CTest labels regex to exclude
    required: false
    default: 'Flaky|Network'
  parallel:
    description: Number of parallel CTest jobs, or 'auto' (one per CPU)
    required: false
    default: auto
  report-name:
    description: Publish the JUnit results to the job summary under this name; empty skips publishing
    required: false
    default: ''
  artifact-name:
    description: Upload the JUnit and CTest output files as this artifact; empty skips the upload
    required: false
    default: ''
  retention-days:
    description: Days to retain the results artifact
    required: false
    default: '14'
  duration-report:
    description: Summarize slow tests and write their durations to this JSON file (relative to build-dir); empty skips
    required: false
    default: ''
  upload-codecov:
    description: Upload JUnit test analytics to Codecov using OIDC (caller needs id-token write)
    required: false
    default: 'false'
  codecov-flags:
    description: Flags identifying this test suite in Codecov
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Run CTest
      shell: bash
      working-directory: ${{ inputs.build-dir }}
      run: |
        python3 "${GITHUB_WORKSPACE}/tools/ci/compile/cmake_helper.py" ctest \
          --junit-output "${INPUTS_JUNIT_OUTPUT}" \
          --ctest-output "${INPUTS_CTEST_OUTPUT}" \
          --jobs "${INPUTS_PARALLEL}" \
          --build-type "${INPUTS_BUILD_TYPE}" \
          --include-labels "${INPUTS_INCLUDE_LABELS}" \
          --exclude-labels "${INPUTS_EXCLUDE_LABELS}"
      env:
        INPUTS_JUNIT_OUTPUT: ${{ inputs.junit-output }}
        INPUTS_CTEST_OUTPUT: ${{ inputs.ctest-output }}
        INPUTS_PARALLEL: ${{ inputs.parallel }}
        INPUTS_BUILD_TYPE: ${{ inputs.build-type }}
        INPUTS_INCLUDE_LABELS: ${{ inputs.include-labels }}
        INPUTS_EXCLUDE_LABELS: ${{ inputs.exclude-labels }}

    # The steps below also run after test failures; the failed CTest step still fails the action.
    - name: Analyze test durations
      if: ${{ !cancelled() && inputs.duration-report != '' }}
      shell: bash
      working-directory: ${{ inputs.build-dir }}
      run: |
        python3 "${GITHUB_WORKSPACE}/tools/ci/reporting/test_duration_report.py" \
          --junit-path "${INPUTS_JUNIT_OUTPUT}" \
          --report-json-path "${INPUTS_DURATION_REPORT}"
      env:
        INPUTS_JUNIT_OUTPUT: ${{ inputs.junit-output }}
        INPUTS_DURATION_REPORT: ${{ inputs.duration-report }}

    - name: Upload Codecov test analytics
      if: ${{ !cancelled() && inputs.upload-codecov == 'true' }}
      uses: codecov/codecov-action@v7
      with:
        files: ${{ inputs.build-dir }}/${{ inputs.junit-output }}
        report_type: test_results
        flags: ${{ inputs.codecov-flags }}
        name: ${{ inputs.report-name }}
        use_oidc: true
        disable_search: true
        handle_no_reports_found: true
        fail_ci_if_error: false

    - name: Publish test results
      if: ${{ !cancelled() && inputs.report-name != '' }}
      uses: dorny/test-reporter@v3
      with:
        name: ${{ inputs.report-name }}
        path: ${{ inputs.build-dir }}/${{ inputs.junit-output }}
        path-replace-backslashes: true
        reporter: java-junit
        use-actions-summary: true
        fail-on-error: false

    - name: Upload test results
      if: ${{ !cancelled() && inputs.artifact-name != '' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.build-dir }}/${{ inputs.ctest-output }}
          ${{ inputs.build-dir }}/${{ inputs.junit-output }}
        retention-days: ${{ inputs.retention-days }}
