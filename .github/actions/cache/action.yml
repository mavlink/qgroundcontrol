name: Caching
description: Setup Caching
inputs:
  host:
    description: Host OS
    required: true
  target:
    description: Target OS
    required: true
  build-type:
    description: Build Type
    required: true
  variant:
    description: Optional discriminator (e.g. coverage|asan) — distinct compile flags must not share a ccache key.
    required: false
    default: ''
  key-suffix:
    description: >-
      Optional per-job discriminator for build caches. Required when multiple
      matrix legs share the same host/target/build-type.
    required: false
    default: ''
  cpm-modules:
    description: Path to CPM Modules
    required: false
  save-cache:
    description: "Whether to save cache (auto = save for pushes and same-repo PRs, skip for fork PRs)"
    required: false
    default: 'auto'
runs:
  using: composite
  steps:
    - name: Resolve save-cache
      id: cache-policy
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        THIS_REPO: ${{ github.repository }}
        REQUESTED: ${{ inputs.save-cache }}
      run: python3 "${GITHUB_WORKSPACE}/.github/scripts/cache_policy.py" --requested "${REQUESTED}"

    - name: Determine cache scope
      id: cache-scope
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        REF_NAME: ${{ github.ref_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: python3 "${GITHUB_WORKSPACE}/.github/scripts/ccache_helper.py" scope --event-name "${EVENT_NAME}" --ref-name "${REF_NAME}" --pr-number "${PR_NUMBER:-}"

    - name: Get ccache config
      id: ccache-config
      shell: bash
      run: |
        python3 "${GITHUB_WORKSPACE}/.github/scripts/ccache_helper.py" config \
          --target "${INPUTS_TARGET}" \
          --conf "${GITHUB_WORKSPACE}/tools/configs/ccache.conf"
      env:
        INPUTS_TARGET: ${{ inputs.target }}

    - name: Install ccache (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        python3 "${GITHUB_WORKSPACE}/.github/scripts/ccache_helper.py" install \
          --version "${STEPS_CCACHE_CONFIG_OUTPUTS_VERSION}" \
          --arch "${STEPS_CCACHE_CONFIG_OUTPUTS_ARCH}"
      env:
        STEPS_CCACHE_CONFIG_OUTPUTS_VERSION: ${{ steps.ccache-config.outputs.version }}
        STEPS_CCACHE_CONFIG_OUTPUTS_ARCH: ${{ steps.ccache-config.outputs.arch }}

    - name: Install mold (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        python3 "${GITHUB_WORKSPACE}/.github/scripts/mold_helper.py" install \
          --arch "${STEPS_CCACHE_CONFIG_OUTPUTS_ARCH}"
      env:
        STEPS_CCACHE_CONFIG_OUTPUTS_ARCH: ${{ steps.ccache-config.outputs.arch }}

    - name: Resolve macOS ccache SHA256
      if: runner.os == 'macOS'
      id: mac-ccache
      shell: bash
      run: python3 "${GITHUB_WORKSPACE}/.github/scripts/ccache_helper.py" macos-config

    - name: Install ccache (macOS)
      if: runner.os == 'macOS'
      shell: bash
      env:
        CCACHE_VERSION: ${{ steps.ccache-config.outputs.version }}
        CCACHE_MAC_SHA256: ${{ steps.mac-ccache.outputs.sha256 }}
      run: |
        sudo python3 "${GITHUB_WORKSPACE}/.github/scripts/ccache_helper.py" install-macos \
          --version "${CCACHE_VERSION}" \
          --sha256 "${CCACHE_MAC_SHA256}"
        ccache --version

    - name: Determine Windows ccache arch
      if: runner.os == 'Windows'
      id: win-ccache
      shell: bash
      run: python3 "${GITHUB_WORKSPACE}/.github/scripts/ccache_helper.py" windows-config --host "${INPUTS_HOST}" --target "${INPUTS_TARGET}"
      env:
        INPUTS_HOST: ${{ inputs.host }}
        INPUTS_TARGET: ${{ inputs.target }}

    - name: Install ccache (Windows)
      if: runner.os == 'Windows'
      shell: bash
      env:
        CCACHE_VERSION: ${{ steps.ccache-config.outputs.version }}
        CCACHE_ARCH: ${{ steps.win-ccache.outputs.arch }}
        CCACHE_WIN_SHA256: ${{ steps.win-ccache.outputs.sha256 }}
      run: |
        python3 "${GITHUB_WORKSPACE}/.github/scripts/ccache_helper.py" install-windows \
          --version "${CCACHE_VERSION}" \
          --arch "${CCACHE_ARCH}" \
          --sha256 "${CCACHE_WIN_SHA256}" \
          --runner-temp "${RUNNER_TEMP//\\//}"

    - name: Add ccache to PATH (Windows)
      if: runner.os == 'Windows'
      shell: bash
      env:
        CCACHE_VERSION: ${{ steps.ccache-config.outputs.version }}
        CCACHE_ARCH: ${{ steps.win-ccache.outputs.arch }}
      run: python3 "${GITHUB_WORKSPACE}/.github/scripts/ccache_helper.py" add-windows-path --version "${CCACHE_VERSION}" --arch "${CCACHE_ARCH}" --runner-temp "${RUNNER_TEMP//\\//}"

    - name: Configure ccache environment
      shell: bash
      env:
        CONFIGURED_MAX_SIZE: ${{ steps.ccache-config.outputs.max_size }}
      run: |
        max_size=2G
        if [[ -n "${RUNS_ON_S3_BUCKET_CACHE:-}" ]]; then
          max_size="${CONFIGURED_MAX_SIZE}"
        fi
        python3 "${GITHUB_WORKSPACE}/.github/scripts/ccache_helper.py" configure-env \
          --workspace "${GITHUB_WORKSPACE//\\//}" \
          --max-size "${max_size}"

    - name: Configure CPM source cache
      if: inputs.cpm-modules != ''
      id: cpm-cache
      shell: bash
      env:
        CPM_MODULES_INPUT: ${{ inputs.cpm-modules }}
      run: python3 "${GITHUB_WORKSPACE}/.github/scripts/cpm_helper.py" configure-cache --path "${CPM_MODULES_INPUT}"

    - name: Compute CPM dependency fingerprint
      if: inputs.cpm-modules != ''
      id: cpm-key
      shell: bash
      run: python3 "${GITHUB_WORKSPACE}/.github/scripts/cpm_helper.py" fingerprint --root "${GITHUB_WORKSPACE}"

    - name: Build cache key prefixes
      id: cache-keys
      shell: bash
      env:
        HOST: ${{ inputs.host }}
        TARGET: ${{ inputs.target }}
        BUILD_TYPE: ${{ inputs.build-type }}
        VARIANT: ${{ inputs.variant }}
        KEY_SUFFIX: ${{ inputs.key-suffix }}
        SCOPE: ${{ steps.cache-scope.outputs.scope }}
        CCACHE_HASH: ${{ hashFiles('.github/build-config.json', 'tools/configs/ccache.conf') }}
        MOCCACHE_HASH: ${{ hashFiles('.github/build-config.json') }}
        CPM_FINGERPRINT: ${{ steps.cpm-key.outputs.fingerprint }}
      run: |
        variant_suffix="${VARIANT:+-${VARIANT}}"
        key_suffix="${KEY_SUFFIX:+-${KEY_SUFFIX}}"
        ccache_base="ccache-${HOST}-${TARGET}-${BUILD_TYPE}${variant_suffix}"
        moccache_base="moccache-${HOST}-${TARGET}-${BUILD_TYPE}-${SCOPE}"
        cpm_base="cpm-modules-${HOST}-${TARGET}${key_suffix}"
        {
          echo "ccache_key=${ccache_base}${key_suffix}-${SCOPE}-${CCACHE_HASH}"
          echo "ccache_scope=${ccache_base}${key_suffix}-${SCOPE}-"
          echo "ccache_legacy_scope=${ccache_base}-${SCOPE}-"
          echo "ccache_shared=${ccache_base}-shared-"
          echo "ccache_unvaried_shared=${VARIANT:+ccache-${HOST}-${TARGET}-${BUILD_TYPE}-shared-}"
          echo "moccache_key=${moccache_base}-${MOCCACHE_HASH}${key_suffix}"
          echo "moccache_hash=${moccache_base}-${MOCCACHE_HASH}-"
          echo "moccache_scope=${moccache_base}-"
          echo "moccache_shared=moccache-${HOST}-${TARGET}-${BUILD_TYPE}-shared-"
          echo "cpm_key=${cpm_base}-${SCOPE}-${CPM_FINGERPRINT}"
          echo "cpm_scope=${cpm_base}-${SCOPE}-"
          echo "cpm_shared=${cpm_base}-shared-"
        } >> "$GITHUB_OUTPUT"

    - name: Restore Build Cache (ccache, save)
      if: steps.cache-policy.outputs.save == 'true' && inputs.variant != 'coverage'
      uses: actions/cache@v5
      with:
        path: ${{ github.workspace }}/.ccache
        key: ${{ steps.cache-keys.outputs.ccache_key }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ steps.cache-keys.outputs.ccache_key }}-
          ${{ steps.cache-keys.outputs.ccache_scope }}
          ${{ steps.cache-keys.outputs.ccache_legacy_scope }}
          ${{ steps.cache-keys.outputs.ccache_shared }}
          ${{ steps.cache-keys.outputs.ccache_unvaried_shared }}

    - name: Restore Build Cache (ccache, read-only)
      if: steps.cache-policy.outputs.save != 'true' && inputs.variant != 'coverage'
      uses: actions/cache/restore@v5
      with:
        path: ${{ github.workspace }}/.ccache
        key: ${{ steps.cache-keys.outputs.ccache_key }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ steps.cache-keys.outputs.ccache_key }}-
          ${{ steps.cache-keys.outputs.ccache_scope }}
          ${{ steps.cache-keys.outputs.ccache_legacy_scope }}
          ${{ steps.cache-keys.outputs.ccache_shared }}
          ${{ steps.cache-keys.outputs.ccache_unvaried_shared }}

    - name: Initialize ccache stats
      shell: bash
      run: ccache -z

    # moccache entries are content-addressed and basedir-normalized, so they
    # are safe to share across build types and branches; keys exist only for
    # scoping and eviction. Windows is skipped (moccache no-ops there).
    #
    # The saved key ends in key-suffix + run id + attempt so every saving job
    # (including matrix legs sharing host/target and re-run attempts) writes a
    # fresh cache (an exact-key hit would otherwise freeze the cache: new
    # entries from jobs like linux-emulator or custom builds would never be
    # saved back). Lookups go through the restore-keys prefixes, and each save
    # includes the restored entries, so caches converge over successive runs.
    # MOCCACHE_MAX_SIZE (set by the launcher) bounds growth via LRU trim.
    - name: Cache moc output (moccache, save)
      if: runner.os != 'Windows' && steps.cache-policy.outputs.save == 'true' && inputs.variant != 'coverage'
      uses: actions/cache@v5
      with:
        path: ${{ github.workspace }}/.cache/moccache
        key: ${{ steps.cache-keys.outputs.moccache_key }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ steps.cache-keys.outputs.moccache_hash }}
          ${{ steps.cache-keys.outputs.moccache_scope }}
          ${{ steps.cache-keys.outputs.moccache_shared }}

    - name: Cache moc output (moccache, read-only)
      if: runner.os != 'Windows' && (steps.cache-policy.outputs.save != 'true' || inputs.variant == 'coverage')
      uses: actions/cache/restore@v5
      with:
        path: ${{ github.workspace }}/.cache/moccache
        key: ${{ steps.cache-keys.outputs.moccache_key }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ steps.cache-keys.outputs.moccache_hash }}
          ${{ steps.cache-keys.outputs.moccache_scope }}
          ${{ steps.cache-keys.outputs.moccache_shared }}

    # Record per-run moc hit/miss stats; a restored cache may carry the
    # previous run's stats.log, so reset it for accurate numbers.
    - name: Enable moccache stats
      if: runner.os != 'Windows'
      shell: bash
      env:
        MOCCACHE_DIR: ${{ github.workspace }}/.cache/moccache
      run: |
        echo "MOCCACHE_STATS=1" >> "$GITHUB_ENV"
        python3 "${GITHUB_WORKSPACE}/tools/moccache.py" --zero-stats

    # CPM is content-identical across build types; only Release writes the
    # cache. Debug + sanitizer + coverage jobs are read-only to avoid parallel
    # save races on the same key (last-writer-wins waste).
    - name: Cache CPM Modules (restore and save)
      if: inputs.cpm-modules != '' && steps.cache-policy.outputs.save == 'true' && inputs.build-type == 'Release'
      uses: actions/cache@v5
      with:
        path: ${{ steps.cpm-cache.outputs.path }}
        key: ${{ steps.cache-keys.outputs.cpm_key }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ steps.cache-keys.outputs.cpm_key }}-
          ${{ steps.cache-keys.outputs.cpm_scope }}
          ${{ steps.cache-keys.outputs.cpm_shared }}
          cpm-modules-${{ steps.cache-scope.outputs.scope }}-
          cpm-modules-shared-

    - name: Cache CPM Modules (restore only)
      if: inputs.cpm-modules != '' && (steps.cache-policy.outputs.save != 'true' || inputs.build-type != 'Release')
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.cpm-cache.outputs.path }}
        key: ${{ steps.cache-keys.outputs.cpm_key }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ steps.cache-keys.outputs.cpm_key }}-
          ${{ steps.cache-keys.outputs.cpm_scope }}
          ${{ steps.cache-keys.outputs.cpm_shared }}
          cpm-modules-${{ steps.cache-scope.outputs.scope }}-
          cpm-modules-shared-
