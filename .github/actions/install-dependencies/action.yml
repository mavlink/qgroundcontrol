name: Install Dependencies
description: >-
  Install platform build dependencies: apt packages on Linux, Homebrew packages and GStreamer on
  macOS, and MSVC with NSIS on Windows. CMake, Ninja, ccache, and mold come from build-setup.

inputs:
  msvc-arm64:
    description: 'Also add the ARM64 cross compiler component (Windows only)'
    required: false
    default: 'false'
  extra-packages:
    description: 'Additional packages to install (space-separated, Linux only)'
    required: false
    default: ''
  category:
    description: 'Install only this install_dependencies category (Linux only, e.g. core); blank installs the full desktop set'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Python (Windows)
      if: runner.os == 'Windows'
      uses: ./.github/actions/setup-python

    - name: Install MSVC and NSIS (Windows)
      if: runner.os == 'Windows'
      uses: nick-fields/retry@v4
      env:
        INPUT_MSVC_ARM64: ${{ inputs.msvc-arm64 }}
      with:
        timeout_minutes: 20
        max_attempts: 3
        command: python tools/ci/runner/install_dependencies_helper.py windows

    - name: Plan apt packages (Linux)
      if: runner.os == 'Linux'
      id: apt-plan
      shell: bash
      env:
        INPUT_CATEGORY: ${{ inputs.category }}
      run: python3 "${GITHUB_WORKSPACE}/tools/ci/runner/install_dependencies_helper.py" plan

    # Downloaded .debs, so slow apt mirrors only hurt on a miss (key rationale in the plan step's
    # helper). actions/cache saves only when the job succeeds, so a failed install never stores a
    # partial set under a key that would then never be re-saved.
    - name: Restore apt download cache (Linux)
      if: runner.os == 'Linux'
      uses: actions/cache@v6
      with:
        path: ~/.cache/qgc-apt-archives
        key: ${{ steps.apt-plan.outputs.key }}
        restore-keys: ${{ steps.apt-plan.outputs.restore-keys }}

    # Retry, mirror, and cache-ownership handling live in tools/ci/runner/apt_install_retry.py.
    - name: Install apt packages (Linux)
      if: runner.os == 'Linux'
      shell: bash
      env:
        INPUT_CATEGORY: ${{ inputs.category }}
        INPUT_EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: python3 "${GITHUB_WORKSPACE}/tools/ci/runner/install_dependencies_helper.py" install

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      uses: nick-fields/retry@v4
      with:
        timeout_minutes: 10
        max_attempts: 3
        command: python3 tools/ci/runner/install_dependencies_helper.py macos
