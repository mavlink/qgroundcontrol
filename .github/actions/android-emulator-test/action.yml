name: Android Emulator Boot Test
description: >-
  Run the APK install + launch smoke test against an x86_64 Android emulator.
  Enables KVM, boots a fresh AVD, and collects failure diagnostics.

inputs:
  apk-path:
    description: Path to the APK to install
    required: true
  package:
    description: Android package id to launch (e.g. org.mavlink.qgroundcontrol)
    required: true
  android-platform:
    description: Android API level (from build-config)
    required: true
  diagnostics-name:
    description: Suffix for the uploaded emulator-diagnostics artifact name
    required: false
    default: ${{ github.job }}

runs:
  using: composite
  steps:
    - name: Enable KVM
      shell: bash
      run: python3 tools/ci/runner/enable_kvm.py

    # The runner executes each script line through sh -c, so inputs reach it as environment variables.
    # android_boot_test.py starts adb, waits for the booted device, and holds the test's settings.
    - name: Emulator Boot Test
      uses: reactivecircus/android-emulator-runner@v2
      env:
        APK_PATH: ${{ inputs.apk-path }}
        APP_PACKAGE: ${{ inputs.package }}
      with:
        api-level: ${{ inputs.android-platform }}
        system-image-api-level: ${{ inputs.android-platform }}
        arch: x86_64
        target: google_apis
        profile: pixel_6
        cores: 4
        ram-size: 4096M
        heap-size: 1024M
        avd-name: qgc-ci
        force-avd-creation: true
        emulator-boot-timeout: 420
        disable-animations: true
        disable-spellchecker: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
        script: python3 tools/ci/android/android_boot_test.py --apk "$APK_PATH" --package "$APP_PACKAGE"

    - name: Collect Emulator Diagnostics
      if: failure()
      shell: bash
      run: |
        python3 "${GITHUB_WORKSPACE}/tools/ci/android/android_collect_diagnostics.py" \
          --out-dir "${RUNNER_TEMP}/emulator-diagnostics" \
          --build-dir "${RUNNER_TEMP}/build" \
          --boot-log "${RUNNER_TEMP}/qgc_emulator_boot.log"

    - name: Upload Emulator Diagnostics
      id: upload-diagnostics
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: emulator-diagnostics-${{ inputs.diagnostics-name }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/emulator-diagnostics
        if-no-files-found: warn
        retention-days: 14

    - name: Link Emulator Diagnostics
      if: failure() && steps.upload-diagnostics.outputs.artifact-url != ''
      shell: bash
      run: python3 "${GITHUB_WORKSPACE}/tools/ci/packaging/artifact_link.py" --label "Emulator diagnostics"
      env:
        ARTIFACT_NAME: emulator-diagnostics-${{ inputs.diagnostics-name }}-${{ github.run_id }}-${{ github.run_attempt }}
        ARTIFACT_URL: ${{ steps.upload-diagnostics.outputs.artifact-url }}
