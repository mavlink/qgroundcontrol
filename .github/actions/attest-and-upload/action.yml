name: Attest and Upload
description: Generate SBOM attestation and upload build artifact (GitHub + optional AWS)

inputs:
  artifact-name:
    description: 'Artifact filename (e.g. QGroundControl.AppImage)'
    required: true
  package-name:
    description: 'Package name for GitHub artifact'
    required: true
  scan-path:
    description: 'Path to scan for SBOM (defaults to build dir)'
    required: false
    default: ''
  build-dir:
    description: 'CMake build directory used to inventory CPM dependencies'
    required: false
    default: ''
  subject-name:
    description: 'SBOM subject name (defaults to package-name)'
    required: false
    default: ''
  aws-role-arn:
    description: 'AWS IAM role ARN for OIDC authentication (preferred)'
    required: false
    default: ''
  aws-key-id:
    description: 'AWS access key ID'
    required: false
    default: ''
  aws-secret-access-key:
    description: 'AWS secret access key'
    required: false
    default: ''
  aws-distribution-id:
    description: 'AWS CloudFront distribution ID'
    required: false
    default: ''
  upload-aws:
    description: 'Upload artifact to AWS'
    required: false
    default: 'true'
  retention-days:
    description: 'Days to retain GitHub artifact (default 7 for PRs, 30 for pushes)'
    required: false
    default: ''
  compression-level:
    description: 'GitHub artifact compression level 0-9 (0=none, best for pre-compressed binaries)'
    required: false
    default: '0'
  artifact-source-path:
    description: >-
      Override for the source path of the artifact. Defaults to
      <runner.temp>/build/<artifact-name>. Use this for multi-config
      generators (e.g. iOS Ninja Multi-Config writes to build/Release/<bundle>).
    required: false
    default: ''
  additional-artifact-paths:
    description: 'Optional newline-separated paths to include in the GitHub artifact'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Resolve source path
      id: src
      shell: bash
      env:
        OVERRIDE: ${{ inputs.artifact-source-path }}
        DEFAULT: ${{ runner.temp }}/build/${{ inputs.artifact-name }}
      run: |
        python3 "${GITHUB_WORKSPACE}/.github/scripts/attest_helper.py" resolve-path \
          --override "${OVERRIDE}" \
          --default "${DEFAULT}"

    - name: Verify or create SHA-256 checksum
      id: checksum
      shell: bash
      env:
        SOURCE_PATH: ${{ steps.src.outputs.path }}
      run: |
        python3 "${GITHUB_WORKSPACE}/.github/scripts/attest_helper.py" checksum \
          --source-path "${SOURCE_PATH}"

    - name: Generate CPM dependency SBOM
      id: dependency-sbom
      shell: bash
      env:
        BUILD_DIR: ${{ inputs.build-dir || format('{0}/build', runner.temp) }}
        SBOM_PATH: ${{ format('{0}/{1}.dependencies.cdx.json', steps.src.outputs.parent, inputs.subject-name || inputs.package-name) }}
      run: |
        python3 "${GITHUB_WORKSPACE}/.github/scripts/generate_cpm_sbom.py" \
          --build-dir "${BUILD_DIR}" \
          --output "${SBOM_PATH}" \
          --require-components
        echo "path=${SBOM_PATH}" >> "${GITHUB_OUTPUT}"

    - name: Attest Build with SBOM
      uses: ./.github/actions/attest-sbom
      with:
        subject-path: ${{ steps.src.outputs.path }}
        subject-name: ${{ inputs.subject-name || inputs.package-name }}
        scan-path: ${{ inputs.scan-path || format('{0}/build', runner.temp) }}

    - name: Attest CPM dependency SBOM
      if: github.event_name != 'pull_request'
      uses: actions/attest@v4
      with:
        subject-path: ${{ steps.src.outputs.path }}
        sbom-path: ${{ steps.dependency-sbom.outputs.path }}

    - name: Save artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.package-name }}
        path: |
          ${{ steps.src.outputs.path }}
          ${{ steps.checksum.outputs.path }}
          ${{ steps.dependency-sbom.outputs.path }}
          ${{ inputs.additional-artifact-paths }}
        retention-days: ${{ inputs.retention-days != '' && inputs.retention-days || (github.event_name == 'pull_request' && '7' || '30') }}
        compression-level: ${{ inputs.compression-level }}

    - name: Upload to AWS
      if: >-
        fromJSON(inputs.upload-aws) &&
        (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag')) &&
        github.repository_owner == 'mavlink' &&
        (inputs.aws-role-arn != '' || (inputs.aws-key-id != '' && inputs.aws-secret-access-key != ''))
      uses: ./.github/actions/aws-upload
      with:
        artifact-name: ${{ inputs.artifact-name }}
        artifact-path: ${{ steps.src.outputs.path }}
        aws-role-arn: ${{ inputs.aws-role-arn }}
        aws-key-id: ${{ inputs.aws-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-distribution-id: ${{ inputs.aws-distribution-id }}

    - name: Upload checksum to AWS
      if: >-
        fromJSON(inputs.upload-aws) &&
        (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag')) &&
        github.repository_owner == 'mavlink' &&
        (inputs.aws-role-arn != '' || (inputs.aws-key-id != '' && inputs.aws-secret-access-key != ''))
      uses: ./.github/actions/aws-upload
      with:
        artifact-name: ${{ inputs.artifact-name }}.sha256
        artifact-path: ${{ steps.checksum.outputs.path }}
        aws-role-arn: ${{ inputs.aws-role-arn }}
        aws-key-id: ${{ inputs.aws-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-distribution-id: ${{ inputs.aws-distribution-id }}
