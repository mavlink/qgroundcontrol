name: Attest and Upload
description: >-
  Attest build provenance and SBOMs, then upload the build artifact. The Publish Builds workflow
  publishes the packages marked with `publish`; this action holds no publishing credentials.
  The provenance attestation covers the package, the build metadata that marks it, and its
  companion file.

inputs:
  artifact-name:
    description: 'Artifact filename (e.g. QGroundControl.AppImage)'
    required: true
  package-name:
    description: 'Package name for GitHub artifact'
    required: true
  subject-name:
    description: 'SBOM subject name (defaults to package-name)'
    required: false
    default: ''
  publish:
    description: >-
      'true' marks the package for the Publish Builds workflow, which publishes it as
      artifact-name once every platform has built the commit; 'false' keeps it a workflow artifact
    required: true
  job-id:
    description: >-
      The calling job's id, `job.check_run_id`. A step that marks a package passes it: the Publish
      Builds workflow refuses a marked package it cannot trace to a job that passed. Without a
      usable id this action warns and the build goes on
    required: false
    default: ''
  artifact-source-path:
    description: >-
      Override for the source path of the artifact. Defaults to
      <runner.temp>/build/<artifact-name>. Use this for multi-config
      generators (e.g. iOS Ninja Multi-Config writes to build/Release/<bundle>).
    required: false
    default: ''
  companion-path:
    description: >-
      A file that goes beside the package on its GitHub Release and nowhere else: the `.zsync` of
      an AppImage that embeds update information, `<artifact-name>.zsync` in the package's
      directory. It is attested and uploaded with the package and listed in the publish marker,
      so the Publish Builds workflow requires it. Empty when there is none
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Prepare artifact checksum, dependency SBOM and build identity
      id: prepare
      shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        OVERRIDE: ${{ inputs.artifact-source-path }}
        PACKAGE_NAME: ${{ inputs.package-name }}
        SUBJECT_NAME: ${{ inputs.subject-name }}
        PUBLISH: ${{ inputs.publish }}
        JOB_ID: ${{ inputs.job-id }}
        COMPANION: ${{ inputs.companion-path }}
      run: |
        python3 "${GITHUB_WORKSPACE}/tools/ci/publish/attest_helper.py" prepare \
          --artifact-name "${ARTIFACT_NAME}" \
          --override "${OVERRIDE}" \
          --package-name "${PACKAGE_NAME}" \
          --subject-name "${SUBJECT_NAME}" \
          --publish "${PUBLISH}" \
          --job-id "${JOB_ID}" \
          --companion "${COMPANION}"

    # Pull request builds aren't released: they skip the SBOM scan and Sigstore attestations.
    - name: Generate SBOM
      if: github.event_name != 'pull_request'
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      env:
        # A 64 MiB gen0 budget (hex) avoids a PowerShell jump-list heap corruption that intermittently
        # crashes the pwsh extracting syft on windows-11-arm (dotnet/runtime#131636).
        DOTNET_GCgen0size: '4000000'
      with:
        path: ${{ runner.temp }}/build
        format: spdx-json
        output-file: ${{ steps.prepare.outputs.sbom-path }}
        upload-artifact: true
        upload-artifact-retention: 30
        artifact-name: sbom-${{ steps.prepare.outputs.subject-name }}

    # The build metadata is a subject too: the publisher trusts its publish marker and job id
    # only with this attestation. So is the companion file, which the publisher publishes.
    - name: Attest Build Provenance
      if: github.event_name != 'pull_request'
      uses: actions/attest@v4
      env:
        NODE_OPTIONS: --max-http-header-size=32768
      with:
        subject-path: ${{ steps.prepare.outputs.provenance-subjects }}

    - name: Attest SBOM
      if: github.event_name != 'pull_request'
      uses: actions/attest@v4
      with:
        subject-path: ${{ steps.prepare.outputs.path }}
        sbom-path: ${{ steps.prepare.outputs.sbom-path }}

    - name: Attest CPM dependency SBOM
      if: github.event_name != 'pull_request'
      uses: actions/attest@v4
      with:
        subject-path: ${{ steps.prepare.outputs.path }}
        sbom-path: ${{ steps.prepare.outputs.dependency-sbom }}

    - name: Save artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.package-name }}
        path: |
          ${{ steps.prepare.outputs.path }}
          ${{ steps.prepare.outputs.checksum }}
          ${{ steps.prepare.outputs.metadata }}
          ${{ steps.prepare.outputs.dependency-sbom }}
          ${{ steps.prepare.outputs.companion }}
        retention-days: ${{ github.event_name == 'pull_request' && '7' || '30' }}
        compression-level: 0
