name: Android Qt
description: Install the Android SDK/NDK and the Android Qt SDK for each requested ABI
outputs:
  target_qt_root_dir:
    description: Android Qt root used for target packages (first of arm64-v8a, armeabi-v7a, x86_64)
    value: ${{ steps.qt-android-arm64.outputs.qt_root_dir || steps.qt-android-armv7.outputs.qt_root_dir || steps.qt-android-x86_64.outputs.qt_root_dir }}
inputs:
  host:
    description: Qt host platform
    required: true
  version:
    description: Qt Version
    required: true
  modules:
    description: Qt Modules
    required: true
  abis:
    description: ABIs to Build
    required: false
    default: 'arm64-v8a;armeabi-v7a'
  ndk-full-version:
    description: Android NDK full version (pass build-config.outputs.android_ndk_full_version)
    required: true
  java-version:
    description: Java version (pass build-config.outputs.android_java_version)
    required: true
  android-platform:
    description: Android platform/API level (pass build-config.outputs.android_platform)
    required: true
  android-cmdline-tools:
    description: Android cmdline-tools version (pass build-config.outputs.android_cmdline_tools)
    required: true
  android-build-tools:
    description: Android build-tools version (pass build-config.outputs.android_build_tools)
    required: true
runs:
  using: composite
  steps:
    # RunsOn images ship no Android SDK and don't preset ANDROID_SDK_ROOT (unlike GitHub-hosted
    # images), so setup-android has no install target. Point it at a writable path; macOS legs
    # stay GitHub-hosted and keep their preinstalled SDK.
    - name: Set Android SDK location
      if: runner.os != 'macOS'
      shell: bash
      run: | # zizmor: ignore[github-env] fixed path under the runner's temp directory
        echo "ANDROID_SDK_ROOT=${RUNNER_TEMP}/android-sdk" >> "$GITHUB_ENV"
        echo "ANDROID_HOME=${RUNNER_TEMP}/android-sdk" >> "$GITHUB_ENV"

    - name: Setup Java Environment
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: Setup Android Environment
      uses: android-actions/setup-android@v4
      with:
        cmdline-tools-version: ${{ inputs.android-cmdline-tools }}
        packages: ''
        log-accepted-android-sdk-licenses: false

    - name: Install Android SDK / NDK / Tools
      shell: bash
      run: |
        python3 "${GITHUB_WORKSPACE}/tools/ci/android/android_sdk_helper.py" \
          --ndk-version "${INPUTS_NDK_FULL_VERSION}" \
          --platform "${INPUTS_ANDROID_PLATFORM}" \
          --build-tools "${INPUTS_ANDROID_BUILD_TOOLS}" \
          --workspace "${GITHUB_WORKSPACE}"
      env:
        INPUTS_NDK_FULL_VERSION: ${{ inputs.ndk-full-version }}
        INPUTS_ANDROID_PLATFORM: ${{ inputs.android-platform }}
        INPUTS_ANDROID_BUILD_TOOLS: ${{ inputs.android-build-tools }}

    - name: Install Qt for Android (arm64_v8a)
      if: contains(format(';{0};', inputs.abis), ';arm64-v8a;')
      id: qt-android-arm64
      uses: ./.github/actions/qt-install
      with:
        version: ${{ inputs.version }}
        host: ${{ inputs.host }}
        target: android
        arch: android_arm64_v8a
        modules: ${{ inputs.modules }}
        export-env: 'false'

    - name: Install Qt for Android (armv7)
      if: contains(format(';{0};', inputs.abis), ';armeabi-v7a;')
      id: qt-android-armv7
      uses: ./.github/actions/qt-install
      with:
        version: ${{ inputs.version }}
        host: ${{ inputs.host }}
        target: android
        arch: android_armv7
        modules: ${{ inputs.modules }}
        export-env: 'false'

    - name: Install Qt for Android (x86_64)
      if: contains(format(';{0};', inputs.abis), ';x86_64;')
      id: qt-android-x86_64
      uses: ./.github/actions/qt-install
      with:
        version: ${{ inputs.version }}
        host: ${{ inputs.host }}
        target: android
        arch: android_x86_64
        modules: ${{ inputs.modules }}
        export-env: 'false'
