name: Setup Python
description: Setup Python with uv for fast dependency installation

inputs:
  groups:
    description: 'Dependency groups to install (comma-separated: scripts, precommit, test, qt, coverage, build, lint, terrain, release, dev, all)'
    required: false
    default: 'scripts'
  python-version:
    description: 'Python version'
    required: false
    default: '3.12'

runs:
  using: composite
  steps:
    # The runner injects the cache URLs that cache actions use into JavaScript actions only, where
    # they can override the shell environment (RunsOn < 3.1 on Windows), so the probe runs with a
    # JavaScript action's environment rather than in a shell step.
    - name: Detect Actions cache backend
      uses: actions/github-script@v9
      with:
        script: await exec.exec('python3', ['tools/ci/cache/cache_backend.py'])

    - name: Setup uv and Python ${{ inputs.python-version }}
      uses: astral-sh/setup-uv@v10.3.2
      with:
        # These inputs are evaluated again during nested post-job cleanup.
        enable-cache: ${{ env.QGC_ACTIONS_CACHE_BACKEND == 's3' }}
        cache-python: ${{ env.QGC_ACTIONS_CACHE_BACKEND == 's3' }}
        cache-dependency-glob: tools/uv.lock
        python-version: ${{ inputs.python-version }}
        # Installs exactly the required-version floor, matching install_uv.py and the Docker image.
        version-file: tools/pyproject.toml
        resolution-strategy: lowest

    # install_python.py also adds the environment's bin/Scripts directory to GITHUB_PATH.
    - name: Install dependencies
      shell: bash
      env:
        GROUPS: ${{ inputs.groups }}
      run: |
        uv run --no-project python tools/setup/install_python.py "$GROUPS"
