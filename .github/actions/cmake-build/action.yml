name: CMake Build
description: Build QGroundControl with consistent options

inputs:
  build-dir:
    description: 'Build directory'
    required: false
    default: ${{ runner.temp }}/build
  target:
    description: 'Build target'
    required: false
    default: 'all'
  parallel:
    description: 'Enable parallel builds'
    required: false
    default: 'true'
  parallel-jobs:
    description: 'Optional max parallel jobs when parallel is enabled'
    required: false
    default: ''
  output-file:
    description: 'File that captures the build output, relative to build-dir; default $RUNNER_TEMP/build-output.log'
    required: false
    default: ''
  reviewdog:
    description: 'Enable reviewdog to annotate compiler warnings on PRs'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Build
      id: compile
      shell: bash
      working-directory: ${{ inputs.build-dir }}
      # cmake_helper.py reads the INPUT_* variables as argument defaults and takes a multi-config
      # generator's configuration from the preset's CMAKE_BUILD_TYPE in CMakeCache.txt. It tees the
      # build output to output-file and writes one job-summary section per build, also after
      # failures: result, duration, toolchain, this build's compiler and moc cache hit rates, and,
      # collapsed, the failed targets and first errors (also error annotations) and slowest steps.
      env:
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_PARALLEL: ${{ inputs.parallel }}
        INPUT_PARALLEL_JOBS: ${{ inputs.parallel-jobs }}
        INPUT_OUTPUT_FILE: ${{ inputs.output-file }}
        INPUT_REVIEWDOG: ${{ inputs.reviewdog }}
      run: python3 "${GITHUB_WORKSPACE}/tools/ci/compile/cmake_helper.py" build

    - name: Save successful build caches
      if: steps.compile.outputs.build_success == 'true' && (inputs.target == 'all' || inputs.target == 'autogen')
      uses: ./.github/actions/save-build-cache

    - name: Upload build timings
      id: upload-timings
      if: always() && steps.compile.outputs.profile_path != ''
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.compile.outputs.profile_name }}
        path: ${{ steps.compile.outputs.profile_path }}
        retention-days: 7
        if-no-files-found: warn

    # Saving caches writes no summary, so the link lands below this build's section.
    - name: Link build timings
      if: ${{ !cancelled() && steps.upload-timings.outputs.artifact-url != '' }}
      shell: bash
      run: python3 "${GITHUB_WORKSPACE}/tools/ci/packaging/artifact_link.py" --label "Ninja build timings"
      env:
        ARTIFACT_NAME: ${{ steps.compile.outputs.profile_name }}
        ARTIFACT_URL: ${{ steps.upload-timings.outputs.artifact-url }}

    - name: Setup reviewdog
      id: reviewdog
      continue-on-error: true
      if: inputs.reviewdog == 'true' && env.REVIEWDOG_LOG != ''
      uses: reviewdog/action-setup@v1

    - name: Annotate compiler warnings
      if: inputs.reviewdog == 'true' && env.REVIEWDOG_LOG != '' && steps.reviewdog.outcome == 'success'
      shell: bash
      env:
        REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
      run: |
        reviewdog \
          -f=gcc \
          -reporter=github-pr-check \
          -filter-mode=added \
          -fail-level=none \
          -name="compiler-warnings" \
          < "$REVIEWDOG_LOG" || true
