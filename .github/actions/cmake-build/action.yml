name: CMake Build
description: Build QGroundControl with consistent options

inputs:
  build-dir:
    description: 'Build directory'
    required: false
    default: ${{ runner.temp }}/build
  target:
    description: 'Build target'
    required: false
    default: 'all'
  parallel:
    description: 'Enable parallel builds'
    required: false
    default: 'true'
  parallel-jobs:
    description: 'Optional max parallel jobs when parallel is enabled'
    required: false
    default: ''
  output-file:
    description: 'File to capture build output (optional)'
    required: false
    default: ''
  reviewdog:
    description: 'Enable reviewdog to annotate compiler warnings on PRs'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Build
      id: compile
      shell: bash
      working-directory: ${{ inputs.build-dir }}
      # cmake_helper.py reads the INPUT_* variables as argument defaults and takes a multi-config
      # generator's configuration from the preset's CMAKE_BUILD_TYPE in CMakeCache.txt.
      env:
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_PARALLEL: ${{ inputs.parallel }}
        INPUT_PARALLEL_JOBS: ${{ inputs.parallel-jobs }}
        INPUT_OUTPUT_FILE: ${{ inputs.output-file }}
        INPUT_REVIEWDOG: ${{ inputs.reviewdog }}
      run: python3 "${GITHUB_WORKSPACE}/tools/ci/compile/cmake_helper.py" build

    - name: Save successful build caches
      if: steps.compile.outputs.build_success == 'true' && (inputs.target == 'all' || inputs.target == 'autogen')
      uses: ./.github/actions/save-build-cache

    - name: Upload build timings
      if: always() && steps.compile.outputs.profile_path != ''
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.compile.outputs.profile_name }}
        path: ${{ steps.compile.outputs.profile_path }}
        retention-days: 7
        if-no-files-found: warn

    - name: Setup reviewdog
      id: reviewdog
      continue-on-error: true
      if: inputs.reviewdog == 'true' && env.REVIEWDOG_LOG != ''
      uses: reviewdog/action-setup@v1

    - name: Annotate compiler warnings
      if: inputs.reviewdog == 'true' && env.REVIEWDOG_LOG != '' && steps.reviewdog.outcome == 'success'
      shell: bash
      env:
        REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
      run: |
        reviewdog \
          -f=gcc \
          -reporter=github-pr-check \
          -filter-mode=added \
          -fail-level=none \
          -name="compiler-warnings" \
          < "$REVIEWDOG_LOG" || true

    - name: Compiler Cache Stats
      if: always()
      shell: bash
      run: |
        if command -v ccache >/dev/null 2>&1; then
          python3 "${GITHUB_WORKSPACE}/tools/ci/cache/ccache_helper.py" summary
        fi

    - name: Moc Cache Stats
      if: always()
      shell: bash
      env:
        MOCCACHE_DIR: ${{ github.workspace }}/.cache/moccache
        BUILD_DIR: ${{ inputs.build-dir }}
      run: |
        python3 "${GITHUB_WORKSPACE}/tools/moccache_launcher.py" --show-stats --build-dir "$BUILD_DIR"
        if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
          python3 "${GITHUB_WORKSPACE}/tools/moccache_launcher.py" --show-stats --build-dir "$BUILD_DIR" --markdown \
            >> "$GITHUB_STEP_SUMMARY"
        fi
