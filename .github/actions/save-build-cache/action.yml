name: Save build caches
description: Preserve successful compilation before packaging, tests, or scanners can fail
inputs:
  docker-report:
    description: Docker build report holding the container's ccache statistics
    required: false
    default: ''
runs:
  using: composite
  steps:
    # Pull requests skip a cache whose build added fewer entries than cache_plan.py's
    # PR_SAVE_MIN_MISSES; a failed decision saves. An empty key skips that cache's save.
    - name: Plan build cache save
      id: plan
      if: env.QGC_SAVE_BUILD_CACHE == 'true' && env.QGC_BUILD_CACHE_SAVED != 'true'
      shell: bash
      env:
        INPUT_DOCKER_REPORT: ${{ inputs.docker-report }}
      run: python3 tools/ci/cache/ccache_helper.py save-plan

    - name: Retain compiler cache snapshot
      id: artifact
      if: steps.plan.outputs.artifact_path != ''
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.QGC_BUILD_CACHE_ARTIFACT_NAME }}
        path: ${{ steps.plan.outputs.artifact_path }}
        compression-level: 0
        retention-days: 1
        overwrite: true
        if-no-files-found: error

    # A failed snapshot upload falls back to the dependency cache.
    - name: Save compiler cache
      if: steps.artifact.outcome != 'success' && steps.plan.outputs.ccache_key != ''
      uses: actions/cache/save@v6
      with:
        path: .cache/ccache
        key: ${{ steps.plan.outputs.ccache_key }}

    - name: Save moc cache
      if: steps.artifact.outcome != 'success' && steps.plan.outputs.moccache_key != ''
      uses: actions/cache/save@v6
      with:
        path: .cache/moccache
        key: ${{ steps.plan.outputs.moccache_key }}
