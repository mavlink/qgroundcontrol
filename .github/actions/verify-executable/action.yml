name: Verify Executable
description: Run simple boot test on QGroundControl binary or package

inputs:
  binary-path:
    description: "Path to the executable or package to verify; the boot test runs in its directory"
    required: true
  type:
    description: "Type of executable (binary, appimage, dmg, exe); dmg attaches the image, verifies its app bundle, and detaches it"
    required: false
    default: "binary"
  build-dir:
    description: "CMake build directory (used to locate auto-downloaded GStreamer SDK for dev builds)"
    required: false
    default: ""
  expect-archs:
    description: "Space-separated Mach-O architectures the binary must contain exactly (macOS only)"
    required: false
    default: ""
  expected-appimage-update-information:
    description: "Expected embedded AppImage update information; empty skips the check"
    required: false
    default: ""

runs:
  using: composite
  steps:
    # verify_executable.py reads the INPUT_* variables as argument defaults.
    - name: Verify executable
      shell: bash
      run: python3 "${GITHUB_WORKSPACE}/tools/ci/packaging/verify_executable.py"
      env:
        INPUT_BINARY_PATH: ${{ inputs.binary-path }}
        INPUT_TYPE: ${{ inputs.type }}
        INPUT_BUILD_DIR: ${{ inputs.build-dir }}
        INPUT_EXPECT_ARCHS: ${{ inputs.expect-archs }}
        INPUT_EXPECTED_APPIMAGE_UPDATE_INFORMATION: ${{ inputs.expected-appimage-update-information }}
