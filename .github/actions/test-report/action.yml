name: Test Report
description: Publish and upload test results

inputs:
  name:
    description: Test report name
    required: true
  build-dir:
    description: Build directory path
    required: true
  junit-file:
    description: JUnit XML file name (relative to build-dir)
    required: false
    default: junit-results.xml
  output-file:
    description: Test output file name (relative to build-dir)
    required: false
    default: test-output.txt
  artifact-name:
    description: Artifact name for uploaded results
    required: true
  retention-days:
    description: Days to retain artifacts
    required: false
    default: "14"
  upload-codecov:
    description: Upload JUnit test analytics using OIDC (caller needs id-token write)
    required: false
    default: 'false'
  codecov-flags:
    description: Flags identifying this test suite in Codecov
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Check Codecov test results
      id: codecov-results
      if: ${{ !cancelled() && inputs.upload-codecov == 'true' }}
      shell: bash
      env:
        JUNIT_PATH: ${{ inputs.build-dir }}/${{ inputs.junit-file }}
      run: |
        if [[ -f "$JUNIT_PATH" ]]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        else
          echo "available=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload Codecov test analytics
      if: ${{ !cancelled() && inputs.upload-codecov == 'true' && steps.codecov-results.outputs.available == 'true' }}
      uses: codecov/codecov-action@v7
      with:
        files: ${{ inputs.build-dir }}/${{ inputs.junit-file }}
        report_type: test_results
        flags: ${{ inputs.codecov-flags }}
        name: ${{ inputs.name }}
        use_oidc: true
        disable_search: true
        fail_ci_if_error: false

    - name: Publish Test Results
      if: always()
      uses: dorny/test-reporter@v3
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.build-dir }}/${{ inputs.junit-file }}
        reporter: java-junit
        fail-on-error: false

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.build-dir }}/${{ inputs.output-file }}
          ${{ inputs.build-dir }}/${{ inputs.junit-file }}
        retention-days: ${{ inputs.retention-days }}
