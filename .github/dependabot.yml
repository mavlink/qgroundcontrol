# Dependabot owns workflow actions. Renovate owns npm, Python, pre-commit, development
# environments, and composite actions (see .github/renovate.json).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    groups:
      github-actions:
        patterns: ["*"]
    cooldown:
      default-days: 7
