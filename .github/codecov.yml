codecov:
  require_ci_to_pass: false
  notify:
    after_n_builds: 1  # Only Linux Debug generates coverage
    wait_for_ci: false

coverage:
  range: "30...90"

  status:
    project:
      default:
        target: 30%
        threshold: 2%
        if_ci_failed: success
        informational: true
    patch:
      default:
        target: 30%
        threshold: 5%
        if_ci_failed: success
        informational: true

comment:
  layout: "reach,diff,flags,tree,footer"
  require_base: false
  require_head: false

# gcovr reports only src/ and test/ (cmake/modules/Coverage.cmake)
ignore:
  - "test/**/*"

flags:
  unittests:
    carryforward: true
