# The protocol definitions QGC uses, with the values QGC uses today. Generation fails when an entry
# is missing from the pinned pyubx2/pysbf2 databases or disagrees with them. An entry that keeps
# QGC's value against upstream sets upstream-type to the upstream value it was reviewed against,
# so any later upstream change fails again.

[ubx]
# Ports whose CFG-MSGOUT keys QGC writes, besides the I2C key that names each family.
msgout-ports = ["UART1", "USB"]

# pyubx2 message name = [class, id].
[ubx.messages]
NAV-POSLLH = [0x01, 0x02]
NAV-STATUS = [0x01, 0x03]
NAV-DOP = [0x01, 0x04]
NAV-SOL = [0x01, 0x06]
NAV-PVT = [0x01, 0x07]
NAV-VELNED = [0x01, 0x12]
NAV-HPPOSLLH = [0x01, 0x14]
NAV-TIMEGPS = [0x01, 0x20]
NAV-TIMEUTC = [0x01, 0x21]
NAV-SVINFO = [0x01, 0x30]
NAV-SAT = [0x01, 0x35]
NAV-SVIN = [0x01, 0x3b]
NAV-RELPOSNED = [0x01, 0x3c]
NAV-DAHEADING = [0x01, 0x45]
NAV-EOE = [0x01, 0x61]
RXM-SFRBX = [0x02, 0x13]
RXM-RAWX = [0x02, 0x15]
RXM-RTCM = [0x02, 0x32]
RXM-COR = [0x02, 0x34]
INF-ERROR = [0x04, 0x00]
INF-WARNING = [0x04, 0x01]
INF-NOTICE = [0x04, 0x02]
INF-DEBUG = [0x04, 0x04]
ACK-NAK = [0x05, 0x00]
ACK-ACK = [0x05, 0x01]
CFG-PRT = [0x06, 0x00]
CFG-MSG = [0x06, 0x01]
CFG-RATE = [0x06, 0x08]
CFG-NAV5 = [0x06, 0x24]
CFG-TMODE3 = [0x06, 0x71]
CFG-VALSET = [0x06, 0x8a]
CFG-VALGET = [0x06, 0x8b]
MON-VER = [0x0a, 0x04]
MON-HW = [0x0a, 0x09]
MON-COMMS = [0x0a, 0x36]
MON-RF = [0x0a, 0x38]
SEC-SIG = [0x27, 0x09]
RTCM3-1005 = [0xf5, 0x05]
RTCM3-1074 = [0xf5, 0x4a]
RTCM3-1077 = [0xf5, 0x4d]
RTCM3-1084 = [0xf5, 0x54]
RTCM3-1087 = [0xf5, 0x57]
RTCM3-1094 = [0xf5, 0x5e]
