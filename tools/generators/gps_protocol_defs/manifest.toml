# pysbf2 block = its block id. Fields map the pysbf2 field name to the C++ member, the type QGC
# decodes and the offset from the block's first sync byte; only the fields QGC reads are listed.
[sbf.blocks.PVTGeodetic]
id = 4007

[sbf.blocks.PVTGeodetic.fields]
TOW = { member = "tow", type = "uint32_t", offset = 8 }
WNc = { member = "wnc", type = "uint16_t", offset = 12 }
Mode = { member = "mode", type = "uint8_t", offset = 14 }
Error = { member = "error", type = "uint8_t", offset = 15 }
Latitude = { member = "latitude", type = "double", offset = 16 }
Longitude = { member = "longitude", type = "double", offset = 24 }
Height = { member = "height", type = "double", offset = 32 }
Undulation = { member = "undulation", type = "float", offset = 40 }
Vn = { member = "vn", type = "float", offset = 44 }
Ve = { member = "ve", type = "float", offset = 48 }
Vu = { member = "vu", type = "float", offset = 52 }
COG = { member = "cog", type = "float", offset = 56 }
Datum = { member = "datum", type = "uint8_t", offset = 73 }
NrSV = { member = "nrSV", type = "uint8_t", offset = 74 }
HAccuracy = { member = "hAccuracy", type = "uint16_t", offset = 90 }
VAccuracy = { member = "vAccuracy", type = "uint16_t", offset = 92 }

# Bitfield subfield QGC reads = the accessor to generate and the mask QGC applies.
[sbf.blocks.PVTGeodetic.bits.Mode]
Type = { accessor = "modeType", mask = 0x0f }
AutoSet = { accessor = "modeAutoSet", mask = 0x40 }
2D = { accessor = "mode2D", mask = 0x80 }
