# signed type does not change the wire bytes.
CFG_NAVSPG_DAHEADING_OFFSET = { id = 0x401100e4, type = "int32_t", upstream-type = "U004" }
CFG_NAVSPG_DYNMODEL = { id = 0x20110021, type = "uint8_t" }
