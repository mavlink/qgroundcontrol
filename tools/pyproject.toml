[project]
name = "qgc-tools"
version = "0.0.0"
requires-python = ">=3.10"

[dependency-groups]
scripts = [
  "packaging>=24",
  "defusedxml>=0.7.1",
  "lxml>=5",
  "fastcrc>=0.3",
  "httpx>=0.28",
  "jinja2>=3.1",
  "tomli>=2.0; python_version < '3.11'",
]
precommit = [
  "pre-commit",
]
test = [
  {include-group = "scripts"},
  "pytest",
  "jsonschema>=4.23",
  "jinja2",
  "pyyaml",
  "tomli>=2.0; python_version < '3.11'",
]
ci = [
  {include-group = "scripts"},
  "pre-commit",
  "meson",
  "ninja",
]
qt = [
  {include-group = "scripts"},
  "aqtinstall",
]
coverage = [
  {include-group = "scripts"},
  "gcovr",
]
dev = [
  {include-group = "test"},
  {include-group = "lint"},
  {include-group = "build"},
  {include-group = "qt"},
  {include-group = "precommit"},
  "jinja2",
  "pyyaml",
  "pymavlink",
  "rust-just>=1.55.1",
  "tomli>=2.0; python_version < '3.11'",
]
build = [
  {include-group = "ci"},
  {include-group = "coverage"},
  "cmake>=3.25,<4",
]
lint = [
  {include-group = "scripts"},
  "ruff==0.16.5",
  "pyright==1.1.411",
  "import-linter>=2.0",
  "jsonschema>=4.23",
  "pyyaml>=6",
  "clang-format==23.1.0",
]

[tool.uv]
default-groups = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.importlinter]
root_packages = ["common", "analyzers", "generators", "qgc_tools", "setup"]

[[tool.importlinter.contracts]]
name = "common is a dependency-free foundation"
type = "forbidden"
source_modules = ["common"]
forbidden_modules = ["analyzers", "generators", "qgc_tools", "setup"]

[[tool.importlinter.contracts]]
name = "tool packages are mutually independent"
type = "independence"
modules = ["analyzers", "generators"]

[[tool.importlinter.contracts]]
name = "shared domains do not import command entrypoints"
type = "forbidden"
source_modules = ["qgc_tools"]
forbidden_modules = ["setup", "analyzers", "generators"]

[[tool.importlinter.contracts]]
name = "system setup does not depend on code analysis or generation"
type = "forbidden"
source_modules = ["setup"]
forbidden_modules = ["analyzers", "generators"]
