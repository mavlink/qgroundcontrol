[project]
name = "qgc-tools"
version = "0.0.0"
requires-python = ">=3.10"

[dependency-groups]
scripts = [
  "packaging>=24",
  "defusedxml>=0.7.1",
  # lxml and fastcrc serve pymavlink's mavgen, which CMake runs for src/MAVLink; tools/ never imports them.
  "lxml>=5",
  "fastcrc>=0.3",
  "jinja2>=3.1",
  "tomli>=2.0; python_version < '3.11'",
]
precommit = [
  # prek runs .pre-commit-config.yaml; pre-commit stays as a fallback runner for one release.
  "prek==0.5.7",
  "pre-commit",
]
test = [
  {include-group = "scripts"},
  "pytest",
  "pytest-xdist>=3.8",
  "pytest-randomly>=5.0",
  "pytest-timeout>=2.4",
  "pytest-subprocess>=1.6",
  "hypothesis>=6.168",
  "syrupy>=6.1",
  "jsonschema>=4.23",
  "pyyaml>=6",
]
qt = [
  {include-group = "scripts"},
  "aqtinstall",
]
coverage = [
  {include-group = "scripts"},
  "gcovr",
]
terrain = [
  "numpy>=2",
  "pillow>=11",
  "rasterio>=1.4",
]
dev = [
  {include-group = "test"},
  {include-group = "lint"},
  {include-group = "build"},
  {include-group = "qt"},
  "pymavlink",
  "rust-just>=1.55.1",
]
# The devcontainer's /opt/qgc-venv syncs only scripts, qt and build, so build keeps prek and gcovr.
build = [
  {include-group = "scripts"},
  {include-group = "precommit"},
  {include-group = "coverage"},
  "cmake>=3.28,<4",
  "meson",
  "ninja",
]
lint = [
  {include-group = "scripts"},
  "ruff==0.16.5",
  "pyright==1.1.411",
  "import-linter>=2.0",
  "jsonschema>=4.23",
  "pyyaml>=6",
  "clang-format==23.1.0",
]

[tool.uv]
default-groups = []
# The single uv version: CI installs this floor exactly, as do install_uv.py and the Docker image.
required-version = ">=0.12.8"

[tool.uv.sources]
# Qt 6.12's split iOS SDKs and versioned extensions need miurahr/aqtinstall#1048; return to PyPI once released.
aqtinstall = { git = "https://github.com/miurahr/aqtinstall", rev = "6f0f842da47c744cdc814cd94da9828d934d7bf0" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["--strict-markers"]
# The slowest test takes about 3 s; a hang fails that test with a traceback instead of the CI job timeout.
timeout = 60
markers = [
  "windows: exercises Windows-specific code paths; CI also runs these on a Windows runner",
]
# rasterio's own Affine arithmetic triggers this; tools/terrain does not use the `*` form.
filterwarnings = ["ignore:Use `@` matmul:PendingDeprecationWarning:rasterio"]

[tool.importlinter]
root_packages = ["ci", "common", "analyzers", "generators", "qgc_tools", "setup", "terrain", "translations"]

# Higher layers may import lower ones; packages joined by "|" are mutually independent.
[[tool.importlinter.contracts]]
name = "tools layering"
type = "layers"
layers = ["ci", "analyzers | generators | terrain | translations", "setup", "qgc_tools", "common"]

# Code shared by several CI concerns belongs in common or qgc_tools.
[[tool.importlinter.contracts]]
name = "ci subpackages are independent"
type = "independence"
modules = ["ci.*"]
ignore_imports = [
    # The attestation bundle embeds the dependency SBOM that generate_cpm_sbom.py also writes standalone.
    "ci.publish.attest_helper -> ci.security.generate_cpm_sbom",
]
