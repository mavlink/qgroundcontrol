# yamlfmt trial: the manual-stage `yamlfmt` hook runs `yamlfmt -lint`; yamllint remains the
# enforced YAML check. Settings follow .yamllint.yml: no document start marker (document-start is
# disabled), two-space indented sequences, at most 200 columns, and comments padded by two spaces
# (yamllint requires at least one).
exclude:
  # clang-format and clang-tidy read these as YAML, but their documented layout keeps `---`.
  - .clang-format
  - .clang-tidy
formatter:
  type: basic
  max_line_length: 200
  pad_line_comments: 2
  retain_line_breaks_single: true
  scan_folded_as_literal: true
